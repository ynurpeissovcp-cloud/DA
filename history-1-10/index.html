  color-scheme:dark }}
:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg) var(--orn) repeat;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.18}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.top{display:flex;flex-direction:column;gap:10px;padding-block:8px 18px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.top h1{font-size:clamp(30px,8vw,42px)}
.top p{margin:0;color:var(--muted);max-width:52ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:20px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:8px 22px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.mode.primary{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode.gold{border-color:var(--gold);background:var(--gold-soft)}
.mode.gold strong{color:var(--gold)}
.mode strong{font-family:var(--display);font-size:20px;font-weight:400}
.mode small{font-size:13px;opacity:.85;line-height:1.35}
.mode:disabled{opacity:.5;cursor:default}

.sec-title{display:flex;flex-direction:column;gap:2px;margin-block:22px 10px}
.sec-title h2{font-size:23px}
.sec-title .mono{font-size:12px;color:var(--muted);letter-spacing:.04em}

.route{display:flex;flex-direction:column;gap:10px}
.topic{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.pin{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:-.03em;border:2px solid var(--c);color:var(--c);background:var(--cs)}
.pin.done{background:var(--c);color:var(--surface)}
.topic h3{font-size:18px}
.topic .meta{font-size:13px;color:var(--muted);margin-top:3px}
.topic .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px}
.chip.fill{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c)}
.s1{--c:var(--s1);--cs:var(--s1s)} .s2{--c:var(--s2);--cs:var(--s2s)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.back{background:none;border:none;padding:6px 0;color:var(--accent);font-weight:600;font-size:15px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}

.qtop{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);align-items:center}
.qtop .mono{white-space:nowrap}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);background:var(--cs);border-radius:6px;padding:3px 8px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-block:10px 16px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font-size:19px;font-weight:600;line-height:1.4;margin-block:6px 6px}
.hint{font-size:13px;color:var(--muted);margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px;line-height:1.35}
.opt .box{flex:0 0 22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:-1px}
.opt.round .box{border-radius:50%}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.order-built{display:flex;flex-direction:column;gap:6px;min-height:52px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:10px}
.order-built .empty{color:var(--muted);font-size:14px;padding:6px}
.oitem{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:8px;padding:9px 12px;text-align:left;font-size:15px}
.oitem .n{font-family:var(--mono);font-weight:700;color:var(--accent)}
.oitem.right{background:var(--ok-bg);border-color:var(--ok)} .oitem.right .n{color:var(--ok)}
.oitem.wrong{background:var(--bad-bg);border-color:var(--bad)} .oitem.wrong .n{color:var(--bad)}
.match{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.mrow label{font-weight:600;font-size:15px}
.mrow select{width:100%;font:inherit;font-size:15px;padding:9px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.mrow.right{border-color:var(--ok);background:var(--ok-bg)} .mrow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mrow .fix{font-size:14px;color:var(--ok);font-weight:600}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:none;border-radius:10px;padding:13px 18px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb b.v{display:block;font-family:var(--display);font-weight:400;font-size:19px;margin-bottom:4px}
.fb.ok b.v{color:var(--ok)} .fb.no b.v{color:var(--bad)}
.fb .pg{font-family:var(--mono);font-size:12px;color:var(--muted);display:block;margin-top:6px}

.cheat h2{font-size:26px}
.cheat h3{font-size:19px;margin-block:20px 8px;color:var(--c)}
.cheat p,.cheat li{font-size:16px}
.cheat ul{padding-left:20px;margin:6px 0;display:flex;flex-direction:column;gap:6px}
.cheat b{color:var(--c)}
.remember{border-left:4px solid var(--c);background:var(--cs);border-radius:0 10px 10px 0;padding:10px 14px;margin-block:12px}
.remember::before{content:"Запомни";display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.kz{border:1px dashed var(--gold);background:var(--gold-soft);border-radius:10px;padding:10px 14px;margin-block:12px;font-size:15px}
.kz::before{content:"Казахские слова";display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.kz i{font-style:normal;font-weight:600}
.tbl{overflow-x:auto;margin-block:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--cs);font-weight:600}

.score{font-family:var(--mono);font-size:52px;font-weight:700;line-height:1;color:var(--accent)}
.verdict{font-size:18px;font-weight:600;margin-top:6px}
.mist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mist div{background:var(--bad-bg);border-radius:8px;padding:10px 12px;font-size:14px}
.mist div b{display:block;margin-bottom:2px}

.task{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px}
.task + .task{margin-top:10px}
.task .q{font-weight:600;font-size:16px}
.task .ans{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:15px}
.task .ans ul{padding-left:18px;margin:4px 0}
.task .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.task.known{border-color:var(--ok)}
.filter{display:flex;flex-wrap:wrap;gap:8px;margin-block:10px 14px}
.filter .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* timeline */
.tl{position:relative;display:flex;flex-direction:column;gap:0;margin-top:12px}
.tl::before{content:"";position:absolute;left:68px;top:6px;bottom:6px;width:2px;background:var(--gold);opacity:.45}
.ev{display:grid;grid-template-columns:58px 1fr;gap:22px;align-items:start;padding-block:8px;text-align:left;background:none;border:none;width:100%;position:relative}
.ev .yr{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--gold);text-align:right;line-height:1.3}
.ev .yr small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.ev::after{content:"";position:absolute;left:63px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--c)}
.ev .tx{font-size:15px;line-height:1.4;min-width:0;border-radius:6px}
.tl.hide .ev:not(.open) .tx{color:transparent;background:var(--line);user-select:none}
.ev .sec{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-bottom:2px}
.tl.hide .ev:not(.open) .sec{opacity:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
.foot{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:380px){.stat b{font-size:17px}.modes{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ================== ТЕМЫ ================== */
const TOPICS = [
 {id:1, s:1, par:"§1–2", pages:"5–11", title:"Начало войны против джунгар. «Годы Великого бедствия»"},
 {id:2, s:1, par:"§3–4", pages:"12–17", title:"Народное ополчение и курултаи"},
 {id:3, s:1, par:"§5–6", pages:"18–24", title:"Булантинское и Аныракайское сражения"},
 {id:4, s:2, par:"§7–8", pages:"25–29", title:"Казахско-русские отношения до начала XVIII века"},
 {id:5, s:2, par:"§9–10", pages:"30–36", title:"Начало присоединения к Российской империи"}
];
const SECTIONS = {1:["Раздел I. Казахско-джунгарские войны","§1–6 · стр. 5–24"],2:["Раздел II. Казахское ханство в XVIII веке","§7–10 · стр. 25–36"]};

/* ================== ВОПРОСЫ ==================
 k: one | multi | order | match;  d:1 — вопрос на дату (идёт в «Тест по датам»)
*/
const Q = [
/* ---------- 1. §1–2 ---------- */
{t:1,k:"one",q:"Кто стал преемником хана Тауке и не смог сохранить единство Казахского ханства?",o:["Каип","Абулхаир","Абылай","Самеке"],a:0,ex:"При Тауке ханство было сильным и единым. После него хан Каип (правил 1716–1719) не удержал власть: султаны начали спорить, кто главный.",p:5},
{t:1,k:"one",q:"Что такое сепаратизм?",o:["Стремление части государства обособиться, отделиться","Объединение всех жузов","Переселение людей на новые места","Массовая гибель скота"],a:0,ex:"В начале XVIII в. усилился сепаратизм султанов: каждый тянул в свою сторону, связи между жузами ослабли.",p:"5, 11"},
{t:1,k:"match",q:"Соедини хана и жуз, где его позиции укрепились.",m:[["Абулхаир","Младший жуз"],["Болат, Самеке, Кушик","Средний жуз"],["Жолбарыс","Старший жуз"]],ex:"Центральная власть ослабла, а местные ханы в каждом жузе стали сильнее.",p:5},
{t:1,k:"multi",q:"Кто совершал набеги на Казахское ханство в начале XVIII века? Выбери все.",o:["Джунгары","Волжские калмыки","Башкиры","Уральские казаки","Сибирские казаки","Турки-османы"],a:[0,1,2,3,4],ex:"На схеме учебника пять соседей: джунгары, волжские калмыки, башкиры, уральские и сибирские казаки.",p:6},
{t:1,k:"one",q:"Какие две державы одинаково хотели ослабить и Казахское ханство, и Джунгарию?",o:["Российская империя и Китай","Бухара и Хива","Китай и Иран","Россия и Швеция"],a:0,ex:"Обеим империям было выгодно, чтобы два сильных кочевых соседа слабели в войне друг с другом.",p:6},
{t:1,k:"one",d:1,q:"В каком году образовалось Джунгарское ханство?",o:["1635","1640","1698","1723"],a:0,ex:"1635 — Джунгарское ханство во главе с Батуром хунтайджи. 1640 — их законы «Степное уложение».",p:6},
{t:1,k:"one",q:"Кто возглавлял Джунгарское ханство при его образовании?",o:["Батур хунтайджи","Цэван-Рабдан","Галдан-Цэрэн","Аюке хан"],a:0,ex:"Цэван-Рабдан и Галдан-Цэрэн правили позже. Аюке — хан волжских калмыков.",p:6},
{t:1,k:"one",q:"«Степное уложение» (1640) — это…",o:["свод военных и гражданских законов джунгар","казахский закон хана Тауке","договор джунгар с Китаем","песня о войне"],a:0,ex:"Законы были очень строгими: за уход с поля боя — штраф скотом и оружием, за предательство — казнь.",p:6},
{t:1,k:"one",q:"Кто наладил у джунгар производство пушек?",o:["Швед Иоган Густав Ренат, попавший в плен","Немецкий учёный И. Георги","Китайский император Канси","Русский боярин Белоусов"],a:0,ex:"В конце XVII в. джунгары сами делали порох (из селитры и серы), сабли, панцири, а с помощью Рената — пушки.",p:6},
{t:1,k:"one",q:"Какое войско могли выставить джунгары?",o:["До 100 тысяч воинов","До 10 тысяч","До 20 тысяч","До 1 миллиона"],a:0,ex:"Каждое родовое подразделение джунгар быстро превращалось в боевую единицу. Были даже отряды стрелков.",p:6},
{t:1,k:"multi",q:"Почему джунгары нападали на Казахское ханство? Выбери все причины из схемы.",o:["Хотели контролировать торговые маршруты","Хотели больше податного населения","Хотели захватить пастбища и торгово-ремесленные центры","Хотели свободный проход к волжским калмыкам","Захватывали людей в рабство","Хотели распространить ислам"],a:[0,1,2,3,4],ex:"Пять причин на схеме стр. 7. Ислам тут ни при чём.",p:7},
{t:1,k:"one",d:1,q:"В каком году умер китайский император Канси и джунгары заключили мир с Китаем?",o:["1722","1723","1716","1727"],a:0,ex:"Мир с Китаем развязал джунгарам руки: на востоке стало спокойно, можно было идти на казахов.",p:7},
{t:1,k:"one",q:"Какую позицию заняла Россия во время войны казахов и джунгар?",o:["Относительно нейтральную: ей было выгодно ослабление обоих","Помогала казахам войском","Воевала на стороне джунгар","Объявила войну Китаю"],a:0,ex:"Россия в это время строила Иртышскую военную линию и серьёзной опасности не представляла.",p:7},
{t:1,k:"one",d:1,q:"Когда правитель джунгар Цэван-Рабдан двинул войско на Казахское ханство?",o:["Весной 1723 г.","Осенью 1726 г.","Весной 1730 г.","В 1698 г."],a:0,ex:"Первый удар — по Семиречью и Прииртышью. Нападение было внезапным, людям пришлось бросать скот и жилища.",p:8},
{t:1,k:"one",q:"Жители какого города вместе с казахским ополчением почти месяц держали оборону?",o:["Ташкента","Туркестана","Омска","Хивы"],a:0,ex:"После Ташкента пали Сайрам, Туркестан и другие города. Уцелели только отдалённые районы на западе.",p:8},
{t:1,k:"one",d:1,q:"Какие годы называют «Ақтабан шұбырынды, Алқакөл сұлама» («Годы Великого бедствия»)?",o:["1723–1727","1710–1717","1728–1730","1731–1734"],a:0,ex:"Самые тяжёлые годы для народа: голод, нищета, тысячи убитых и угнанных в плен.",p:8},
{t:1,k:"match",q:"Куда откочевали казахи, спасаясь от джунгар? Соедини.",m:[["Большинство родов Среднего жуза","через Сырдарью к Самарканду"],["Младший жуз","в пределы Хивы и Бухары"],["Многие казахи на западе","к реке Жайык (Урал)"]],ex:"Массовая миграция к Жайыку обеспокоила Россию — она укрепила пограничную стражу.",p:9},
{t:1,k:"one",q:"Как называется песня-плач, ставшая знаком великой скорби народа?",o:["«Елім-ай»","«Қалқаман-Мамыр»","«Алаш»","«Қалмақ қырылған»"],a:0,ex:"«Елім-ай» — это жоқтау (песня-плач). Строки: «С хребта Каратау караван идёт…».",p:9},
{t:1,k:"multi",q:"Почему казахи потерпели поражение в первые годы Великого бедствия? Выбери все причины.",o:["Разобщённость жузов, нет единства","Джунгары хорошо подготовились","Внезапное нападение весной, аулы были далеко друг от друга","Сильный джут, нехватка лошадей","Джунгары заключили мир с Китаем","Казахов было слишком много"],a:[0,1,2,3,4],ex:"Причины идут по порядку: во-первых, во-вторых, в-третьих… Плюс у джунгар была хорошо вооружённая опытная армия.",p:"9–10"},
{t:1,k:"one",q:"По сведениям Шакарима Кудайбердыулы, сколько степного населения погибло?",o:["Две трети","Одна десятая","Половина","Одна треть"],a:0,ex:"Часть жителей продали в рабство, начался массовый голод.",p:10},
{t:1,k:"one",q:"Что значит выражение «қайың сауған»?",o:["Люди от голода пили берёзовый сок","Победа над врагом","Место гибели калмыков","Песня-плач"],a:0,ex:"«Қайың сауған» дословно — «доившие берёзу». Так голодно было в годы бедствия.",p:10},
{t:1,k:"one",q:"В каком произведении Шакарима хорошо описаны события «Ақтабан шұбырынды»?",o:["Поэма-дастан «Қалқаман-Мамыр»","Песня «Елім-ай»","«Степное уложение»","«Сборник летописей»"],a:0,ex:"Поэма-дастан Ш. Кудайбердыулы «Қалқаман-Мамыр».",p:10},
{t:1,k:"order",d:1,q:"Расставь события по порядку (задание из учебника).",o:["Образование Джунгарского ханства Батуром хунтайджи (1635)","Смерть китайского императора Канси (1722)","Вторжение войска Цэван-Рабдана (весна 1723)","Период «Ақтабан шұбырынды» (1723–1727)"],ex:"1635 → 1722 → 1723 → 1723–1727. Вторжение стало началом Великого бедствия.",p:10},
{t:1,k:"match",q:"Соедини понятие и его значение.",m:[["Джут","массовая гибель скота от природных катаклизмов"],["Миграция","переселение людей на другое место"],["Каракалпаки","тюркоязычный народ у южного Арала"],["Сепаратизм","стремление к отделению"]],ex:"Эти четыре слова — в словарике на стр. 11.",p:11},
{t:1,k:"multi",q:"С какими народами у казахов начались земельные конфликты из-за переселения на запад и юго-запад?",o:["Каракалпаки","Туркмены","Узбеки","Башкиры и калмыки","Китайцы"],a:[0,1,2,3],ex:"Также осложнились отношения с уральскими казаками и русским населением Западной Сибири.",p:10},
{t:1,k:"one",q:"Документ из сборника Крафта: куда откочевали казахи Среднего жуза после нападения 15 000 джунгар?",o:["К Яику (Уралу)","К Иртышу","В Китай","На Сырдарью"],a:0,ex:"Они бросили скот и имущество и хотели зимовать у калмыков и башкир. Россия велела не допускать разорения своих подданных.",p:11},
{t:1,k:"match",q:"Кто это? Соедини личность и описание.",m:[["Каип","казахский хан, правил 1716–1719"],["Канси","второй император династии Цин в Китае"],["Цэван-Рабдан","джунгарский правитель, начал вторжение 1723 г."],["Аюке","хан волжских калмыков"]],ex:"К Аюке джунгары посылали послов, чтобы воевать против казахов вместе.",p:"7, 11"},

/* ---------- 2. §3–4 ---------- */
{t:2,k:"multi",q:"От каких предков казахи унаследовали высокие боевые качества?",o:["Кыпчаки","Тюрки","Гунны","Саки","Римляне"],a:[0,1,2,3],ex:"Так сказано во введении к §3–4.",p:12},
{t:2,k:"one",q:"Что выполняло у казахов функции регулярной армии?",o:["Всенародное ополчение","Наёмные войска","Китайские отряды","Казачьи полки"],a:0,ex:"Профессиональной армии у казахов не было. При нападении врага каждый мужчина становился воином.",p:12},
{t:2,k:"one",q:"По какому принципу формировались боевые отряды ополчения?",o:["По родоплеменному","По возрасту","По жребию","По богатству"],a:0,ex:"Воины одного рода воевали рядом с родственниками, поэтому не бросали поле боя.",p:12},
{t:2,k:"one",q:"Из кого состояли небольшие вооружённые отряды ханов и султанов?",o:["Из толенгутов","Из мергенов","Из сардаров","Из аманатов"],a:0,ex:"Толенгуты — личная дружина хана или султана.",p:12},
{t:2,k:"one",q:"Кто, как правило, был верховным главнокомандующим общенародного ополчения?",o:["Хан","Бий","Жырау","Самый старый батыр"],a:0,ex:"Большими отрядами командовали прославленные батыры, а всем ополчением — хан.",p:12},
{t:2,k:"one",q:"Сколько коней брал каждый воин в дальний поход?",o:["Два и более","Одного","Пять","Ни одного, шли пешком"],a:0,ex:"Один конь — для боя, другие — походные: на них везли еду и часть оружия.",p:13},
{t:2,k:"one",q:"Что такое уран (ұран)?",o:["Боевой клич","Вид сабли","Военный совет","Заложник"],a:0,ex:"Уран называли в честь предка или уважаемого сородича. Он поднимал боевой дух.",p:13},
{t:2,k:"one",q:"Какой уран был общим для всех казахов?",o:["«Алаш»","«Елім-ай»","«Аңырақай»","«Жекпе-жек»"],a:0,ex:"«Алаш» — имя мифического прародителя всех казахов и ряда тюркоязычных народов.",p:13},
{t:2,k:"one",q:"Как можно было получить звание батыра?",o:["Только за личные подвиги","По наследству от отца","Купить у хана","Выиграть в көкпар"],a:0,ex:"Батыром мог стать и простолюдин, и бий, и султан, и хан — но только за подвиги.",p:13},
{t:2,k:"multi",q:"Какие казахские ханы имели статус батыра?",o:["Абулхаир","Абылай","Кенесары","Цэван-Рабдан","Канси"],a:[0,1,2],ex:"Цэван-Рабдан — правитель джунгар, Канси — император Китая.",p:13},
{t:2,k:"one",q:"Где хоронили самых отличившихся батыров?",o:["В мавзолее Ходжа Ахмеда Ясауи в Туркестане","На вершинах Алатау","В Ордабасы","В Омской крепости"],a:0,ex:"Туркестан — священный город, право захоронения там было большой честью.",p:13},
{t:2,k:"match",q:"Оружие казахского воина. Соедини название и описание.",m:[["Садақ","лук со стрелами"],["Семсер","прямой меч"],["Қылыш","кривая сабля"],["Найза","копьё с широким наконечником"],["Сүңгі","длинная пика с тонким гранёным наконечником"],["Шоқпар","палица из цельного куска дерева"]],ex:"Самое распространённое оружие дальнего боя — лук со стрелами (садақ). Сүңгі нужна против врага в доспехах.",p:13},
{t:2,k:"match",q:"Ещё оружие. Соедини.",m:[["Балта","боевой топор"],["Айбалта","секира с лунообразным широким лезвием"],["Сапы","казахская шашка"],["Қылышбау","ножны для сабли"]],ex:"Ножны обтягивали кожей и бархатом, украшали серебром и золотом.",p:13},
{t:2,k:"one",q:"Кто такой сардар?",o:["Предводитель войска, военачальник","Песенник-жырау","Заложник","Меткий стрелок"],a:0,ex:"Перед дальним походом сардары собирали военный совет.",p:"14, 17"},
{t:2,k:"one",q:"Что такое «жекпе-жек»?",o:["Единоборство двух батыров перед сражением","Конная игра","Боевой клич","Военный совет"],a:0,ex:"После жекпе-жек в бой постепенно вводили крупные отряды.",p:14},
{t:2,k:"order",q:"Расставь, как казахское войско вступало в бой.",o:["Единоборство батыров (жекпе-жек)","Авангард лучников обстреливает врага","Действуют копьеносцы","Отряд сабельщиков и воины с палицами"],ex:"Если атака не удалась, войско рассеивалось и быстро перестраивалось для новой атаки.",p:14},
{t:2,k:"one",q:"Какой военной хитростью пользовались казахи?",o:["Притворно убегали и заманивали врага в засаду","Строили каменные крепости","Нанимали китайских солдат","Нападали только ночью"],a:0,ex:"Ещё нападали с разных сторон, чтобы вызвать панику.",p:14},
{t:2,k:"match",q:"Как степняки оповещали соседей о набеге врага?",m:[["Днём","поворотами и кружением на коне"],["Ночью","зажжёнными огнями"]],ex:"Левшин писал: «вместо телеграфов зажигают огни». Гавердовский описал и дневные сигналы.",p:"14, 17"},
{t:2,k:"multi",q:"Какие игры и занятия готовили казахов к войне?",o:["Көкпар","Аударыспақ (конная борьба)","Садақ тарту, жамбы ату (стрельба)","Қазақ күресі (борьба)","Шахматы"],a:[0,1,2,3],ex:"Мальчика сажали на коня с 3–4 лет. Стрелять учили на полном скаку и в разные стороны.",p:14},
{t:2,k:"one",q:"Как называли метких стрелков?",o:["Мергены","Сардары","Толенгуты","Жырау"],a:0,ex:"Одним выстрелом из лука они могли попасть в подброшенную монету.",p:"14–15"},
{t:2,k:"one",d:1,q:"Когда и где прошёл курултай, решивший создать всеказахское ополчение?",o:["1710 г., Каракумы (между пустыней Каракум и горами Улытау)","1726 г., Ордабасы","1728 г., Буланты","1730 г., Аныракай"],a:0,ex:"Участники курултая дали клятву сражаться с врагом до победного конца.",p:15},
{t:2,k:"one",d:1,q:"Осенью 1723 г. Абулхаир с 20-тысячным войском совершил упреждающие походы против…",o:["волжских калмыков","джунгар в Китае","башкир","уральских казаков"],a:0,ex:"Волжские калмыки — этнически родственны джунгарам. Абулхаир обезопасил свой тыл.",p:"15–16"},
{t:2,k:"one",d:1,q:"Какой город освободил Абулхаир весной 1724 г.?",o:["Туркестан — столицу ханства","Ташкент","Омск","Сайрам"],a:0,ex:"Абулхаир удерживал город год, но под напором врага оставил его.",p:16},
{t:2,k:"one",q:"Какой численности было казахско-каракалпакское войско Абулхаира?",o:["50 тысяч воинов","20 тысяч","100 тысяч","5 тысяч"],a:0,ex:"Плечом к плечу с казахами сражались кыргызы, узбеки, каракалпаки.",p:16},
{t:2,k:"one",d:1,q:"Когда прошёл всеказахский курултай в Ордабасы?",o:["Осенью 1726 г.","Весной 1723 г.","В 1710 г.","Весной 1730 г."],a:0,ex:"Там собрались ханы, султаны, бии, батыры всех трёх жузов и дали клятву верности друг другу.",p:16},
{t:2,k:"one",q:"Кого единогласно избрали предводителем всенародного ополчения в Ордабасы?",o:["Хана Абулхаира","Хана Самеке","Султана Абылая","Хана Абулмамбета"],a:0,ex:"Каждый род обязался дать свои военные отряды.",p:17},
{t:2,k:"match",q:"Сравни два курултая. Соедини.",m:[["Каракумы: год","1710"],["Ордабасы: год","1726"],["Каракумы: решение","создать всеказахское ополчение"],["Ордабасы: решение","Абулхаир избран предводителем ополчения"]],ex:"Это таблица из задания 3 на стр. 17. Ордабасы стал символом единства народа.",p:"15–17"},
{t:2,k:"one",q:"Что такое курултай?",o:["Собрание кочевых аристократов, принимающее важнейшие решения","Казахская крепость","Боевой клич","Вид оружия"],a:0,ex:"Курултай — система высшей власти тюрко-монгольских народов.",p:17},
{t:2,k:"one",q:"По Гавердовскому, сколько стрел брал с собой всадник?",o:["Не более 20","100","5","Сколько угодно"],a:0,ex:"Поэтому каждый старался, чтобы стрела не была потрачена напрасно.",p:17},
{t:2,k:"one",q:"Абулхаир (1693–1748) — это…",o:["хан Младшего жуза","хан Старшего жуза","правитель джунгар","русский дипломат"],a:0,ex:"Один из главных руководителей борьбы с джунгарами.",p:17},

/* ---------- 3. §5–6 ---------- */
{t:3,k:"multi",q:"Какие ханы и султаны стояли во главе крупных отрядов?",o:["Абулмамбет","Барак","Самеке","Абулхаир","Жолбарыс","Галдан-Цэрэн"],a:[0,1,2,3,4],ex:"Галдан-Цэрэн — правитель джунгар, враг.",p:18},
{t:3,k:"one",q:"Кто взял на себя идейное руководство освободительной борьбой?",o:["Авторитетные бии трёх жузов","Русские послы","Жырау","Китайский император"],a:0,ex:"Бии — уважаемые судьи и советники народа.",p:18},
{t:3,k:"one",q:"Авторитет какого молодого султана значительно вырос в эти годы?",o:["Абылая","Нуралы","Каипа","Барака"],a:0,ex:"Абылай потом стал одним из самых влиятельных и почитаемых правителей.",p:18},
{t:3,k:"multi",q:"Выбери батыров, которые сражались с джунгарами.",o:["Каракерей Кабанбай","Канжыгалы Богенбай","Тама Есет Кокиулы","Райымбек","Шапырашты Наурызбай","Цэван-Рабдан"],a:[0,1,2,3,4],ex:"Также Шакшак Жанибек, Малайсары, Баян, Олжабай, Кожаберген и многие другие.",p:18},
{t:3,k:"match",q:"Женщины-героини. Соедини.",m:[["Айтолкын","дочь султана Абылая"],["Есенбике","дочь Карасай батыра"],["Айбике","жена Буланбай батыра"]],ex:"В войне активно участвовала и женская часть общества.",p:18},
{t:3,k:"multi",q:"Какие жырау воспевали героизм батыров?",o:["Умбетей","Актамберды","Таттикара","Бухар","Тевкелев"],a:[0,1,2,3],ex:"Многие из них сами участвовали в сражениях. Тевкелев — русский дипломат.",p:19},
{t:3,k:"one",q:"Что помогло успешному наступлению казахов в 1727–1728 гг.?",o:["Загадочная смерть джунгарского правителя Цэван-Рабдана в 1727 г.","Помощь китайской армии","Помощь России","Смерть хана Абулхаира"],a:0,ex:"Его сын Галдан-Цэрэн временно приостановил войну, но от захватов не отказался.",p:19},
{t:3,k:"one",d:1,q:"В каком году казахи победили в Булантинском сражении?",o:["1728","1730","1726","1723"],a:0,ex:"1728 — Буланты, 1730 — Аныракай. Запомни: сначала Буланты, потом Аныракай.",p:19},
{t:3,k:"one",q:"Где произошло Булантинское сражение?",o:["В предгорьях Улытау, в местности Карасиыр у реки Буланты","У озера Балкаш, в местности Итишпес Алаколь","У города Ташкент","У реки Иртыш"],a:0,ex:"Итишпес Алаколь у Балкаша — это место Аныракайской битвы.",p:19},
{t:3,k:"one",q:"Какое народное название получило место Булантинского сражения?",o:["«Қалмақ қырылған» — место гибели калмыков","«Аңырақай» — место стонов врага","«Ақтабан шұбырынды»","«Елім-ай»"],a:0,ex:"Было уничтожено до 10 тысяч джунгарских воинов.",p:19},
{t:3,k:"one",q:"Сколько воинов было в объединённых силах казахов при Буланты?",o:["Около 60 тысяч","Около 10 тысяч","Около 200 тысяч","Около 5 тысяч"],a:0,ex:"На стороне казахов были кыргызские и каракалпакские отряды.",p:19},
{t:3,k:"one",q:"В чём главное значение победы на реке Буланты?",o:["Укрепился дух народа, развеян миф о непобедимости джунгар","Война полностью закончилась","Казахи захватили Джунгарию","Казахи приняли подданство России"],a:0,ex:"Победа стала залогом успеха в следующей, Аныракайской битве.",p:19},
{t:3,k:"one",q:"Где по указанию Канжыгалы Богенбая похоронили погибших казахских воинов?",o:["На вершинах Улытау","В Туркестане","У Балкаша","В Ордабасы"],a:0,ex:"Это рубрика «Знайте» на стр. 19.",p:19},
{t:3,k:"one",d:1,q:"Когда произошла Аныракайская битва?",o:["Весной 1730 г.","Осенью 1726 г.","В 1728 г.","10 октября 1731 г."],a:0,ex:"Выдающееся событие освободительной войны.",p:19},
{t:3,k:"one",q:"Кто руководил Аныракайской битвой?",o:["Хан Младшего жуза Абулхаир","Султан Абылай","Хан Самеке","Батыр Богенбай"],a:0,ex:"В битве участвовало ополчение всех трёх жузов.",p:19},
{t:3,k:"one",q:"Как переводится название «Аңырақай»?",o:["«Место стонов и рыданий врага»","«Место гибели калмыков»","«Доившие берёзу»","«Годы Великого бедствия»"],a:0,ex:"На месте сражения остались тысячи убитых врагов. Казахи стреляли из винтовок, беглецов добивали лучники в ущельях.",p:21},
{t:3,k:"one",q:"Почему Аныракайскую битву считают коренным переломом в войне?",o:["Три жуза выступили единым фронтом, джунгары начали отступать","Погиб правитель джунгар","В битве участвовала Россия","После неё казахи заключили мир с Китаем"],a:0,ex:"Победа была логичным результатом объединения всего народа Степи.",p:21},
{t:3,k:"match",q:"Сравни два сражения. Соедини.",m:[["Буланты: год","1728"],["Аныракай: год","1730"],["Буланты: место","предгорья Улытау, река Буланты"],["Аныракай: место","Итишпес Алаколь, недалеко от Балкаша"],["Буланты: название в народе","«Қалмақ қырылған»"],["Аныракай: название в народе","«Место стонов и рыданий врага»"]],ex:"Это таблица из задания 3 на стр. 22 — почти наверняка будет на СОРе.",p:"19–21"},
{t:3,k:"one",q:"Сколько длились казахско-джунгарские столкновения?",o:["До 30–40-х гг. XVIII в., с переменным успехом","Закончились в 1730 г.","До 1900 г.","Всего один год"],a:0,ex:"Между войнами бывали и мирные периоды: дипломатия, выгодная торговля.",p:21},
{t:3,k:"one",q:"Кто были главными претендентами на титул старшего хана после Аныракая?",o:["Абулхаир и Самеке","Абылай и Барак","Абулмамбет и Жолбарыс","Богенбай и Кабанбай"],a:0,ex:"Началась борьба за ханскую власть.",p:21},
{t:3,k:"one",q:"Кого степная знать выбрала старшим ханом?",o:["Абулмамбета, ничем себя не проявившего","Абулхаира","Самеке","Абылая"],a:0,ex:"Региональным правителям не нужны были сильные личности. Обиженные Абулхаир и Самеке ушли с войском.",p:21},
{t:3,k:"one",q:"Каким было последствие спора за ханскую власть?",o:["Распалось общеказахское ополчение","Джунгары сразу сдались","Казахи объединились ещё сильнее","Китай напал на джунгар"],a:0,ex:"Теперь каждый жуз сам искал выход из трудного положения.",p:"21–22"},
{t:3,k:"match",q:"Что стало с каждым жузом после распада ополчения?",m:[["Старший жуз","на время подчинился джунгарам: аманаты и ежегодная дань"],["Средний жуз","продолжал борьбу"],["Младший жуз","оказался в окружении: хивинцы, туркмены, калмыки, яицкие казаки, башкиры"]],ex:"Средний жуз больше всех пострадал от нашествия, но продолжал воевать.",p:22},
{t:3,k:"one",q:"Аманат — это…",o:["Заложник","Боевой клич","Военачальник","Крепость"],a:0,ex:"В знак верности соседние правители брали в аманаты детей из влиятельных семей ханов, султанов, биев, батыров.",p:22},
{t:3,k:"match",q:"Батыры. Соедини имя и описание.",m:[["Канжыгалы Богенбай","полководец и дипломат, сподвижник хана Абылая"],["Каракерей Кабанбай","Абылай назвал его Дарабоз — «Штурмующий небо»"],["Райымбек","батыр из племени албан Старшего жуза"],["Есет Кокиулы","полководец из Младшего жуза"]],ex:"Годы жизни: Богенбай 1680–1778, Кабанбай 1691–1769, Райымбек 1705–1785, Есет 1667–1749.",p:22},
{t:3,k:"one",q:"Документ о батыре Жасыбае: в каких горах шла битва?",o:["В Баянаульских горах (Павлодарская область)","В Алатау","В горах Улытау","В Каратау"],a:0,ex:"Там озёра Жасыбай и Торайгыр. Жасыбай похоронен у озера, названного в его честь.",p:23},
{t:3,k:"one",q:"Чем закончилась битва в Баянаульских горах?",o:["Подоспел Олжабай, и калмыки просили пощады","Казахи отступили","Джунгары захватили Баянаул","Был заключён мир с Китаем"],a:0,ex:"Жасыбай смертельно ранил калмыцкого хана, а Олжабай подоспел с войском.",p:23},
{t:3,k:"one",q:"Кто написал о сложном периоде в жизни казахов — «Ақтабан шұбырынды»?",o:["Шакарим Кудайбердыулы","Актамберды жырау","Левшин","Гавердовский"],a:0,ex:"Вопрос из повторения раздела (стр. 24). Второй вопрос там: Аныракайской битвой руководил хан Младшего жуза — Абулхаир.",p:24},
{t:3,k:"order",d:1,q:"Расставь события Раздела I по порядку.",o:["Образование Джунгарского ханства (1635)","Курултай в Каракумах (1710)","Начало «Ақтабан шұбырынды» (1723)","Курултай в Ордабасы (1726)","Булантинское сражение (1728)","Аныракайская битва (1730)"],ex:"Главная цепочка дат первого раздела.",p:"6–19"},

{t:4,k:"one",q:"С какого века начинаются казахско-российские отношения?",o:["С XVI века","С X века","С XVIII века","С XIX века"],a:0,ex:"Сначала это были в основном дипломатические и торговые связи.",p:25},
{t:4,k:"one",q:"С какими купцами торговали казахи Среднего жуза в XVI веке?",o:["Строгановыми","Брянцевыми","Тевкелевыми","Бухгольцами"],a:0,ex:"Строгановы также организовали поход Ермака в Западную Сибирь.",p:"25, 29"},
{t:4,k:"one",q:"Кто считал Казахстан «ключом и вратами» в Азию?",o:["Пётр I","Анна Иоанновна","Абулхаир","Канси"],a:0,ex:"Российский царь Пётр I (1672–1725).",p:25},
{t:4,k:"one",d:1,q:"В 1716 г. хан Каип обратился к России с просьбой…",o:["вместе бороться с джунгарами","принять казахов в подданство","построить Омскую крепость","продать оружие Китаю"],a:0,ex:"Такие попытки были и у хана Младшего жуза Абулхаира.",p:25},
{t:4,k:"one",q:"Почему Россия тогда не откликнулась на предложение степных правителей?",o:["Была занята тяжёлой и затяжной войной со Швецией","Воевала с Китаем","Не знала о казахах","Дружила с джунгарами"],a:0,ex:"Удобный момент для России наступил только к началу 30-х гг. XVIII в.",p:25},
{t:4,k:"multi",q:"Почему Россия хотела включить Казахское ханство в сферу своего влияния? Выбери все причины.",o:["Степь — плацдарм для продвижения в Центральную Азию, Индию, Афганистан","Огромный рынок для российских фабричных товаров","Источник сырья, полезных ископаемых, продукции скотоводства","Казахи стали бы новым податным населением","Россия хотела бесплатно защищать казахов"],a:[0,1,2,3],ex:"Четыре причины на схеме стр. 26. Ещё Россия видела распри в правящей элите чингизидов.",p:"25–26"},
{t:4,k:"one",d:1,q:"Когда и кем была заложена Омская крепость?",o:["Весной 1716 г., отрядом И. Бухгольца","В 1735 г., Тевкелевым","В 1720 г., Строгановыми","В 1731 г., Анной Иоанновной"],a:0,ex:"Потом между крепостями появились форпосты и редуты.",p:26},
{t:4,k:"one",q:"Как царская администрация объясняла строительство крепостей?",o:["Джунгарам — защитой от казахов, казахам — защитой от джунгар","Всем — защитой от Китая","Торговлей с Индией","Никак не объясняла"],a:0,ex:"На деле крепости были плацдармом для продвижения России по Иртышу.",p:26},
{t:4,k:"match",q:"Крепости Иртышской линии. Соедини крепость и год.",m:[["Ямышевская и Омская","1716"],["Железинская","1717"],["Семипалатинская","1718"],["Усть-Каменогорская и Коряковская","1720"]],ex:"Рубрика «Запомните» на стр. 28. Это таблица из задания 2 на стр. 29.",p:28},
{t:4,k:"order",d:1,q:"Расставь крепости по времени постройки.",o:["Омская","Железинская","Семипалатинская","Усть-Каменогорская"],ex:"1716 → 1717 → 1718 → 1720. Подсказка: идут вверх по Иртышу, с севера на юго-восток.",p:28},
{t:4,k:"one",q:"По словам Н. Коншина, Иртышская линия должна была охранять земли…",o:["сначала от джунгар, а вскоре и от киргизов (казахов)","только от китайцев","от башкир","от Швеции"],a:0,ex:"Киргизами (киргиз-кайсаками) в русских документах тогда называли казахов.",p:26},
{t:4,k:"match",q:"Русские посольства в Казахскую степь. Соедини.",m:[["Никита Белоусов, тобольский боярин","1716"],["Борис Брянцев и Фёдор Жилин","1717–1718"],["Колмаков, Урусов, Сомов","изучение озера Жайсан и Чёрного Иртыша"]],ex:"Маршрут всех посольств шёл через казахскую землю.",p:28},
{t:4,k:"one",q:"Чего ещё, кроме торговли и союза, добивалась Россия?",o:["Искала пути подчинения Казахского ханства","Хотела отдать земли Китаю","Хотела переселить казахов в Сибирь","Ничего"],a:0,ex:"Это вызывало сопротивление казахских правителей.",p:28},
{t:4,k:"one",d:1,q:"Что произошло в 1711 г.?",o:["16-тысячный отряд казахов захватил хлебный обоз, шедший в Яицкий городок","Построили Омскую крепость","Абулхаир принял подданство","Битва при Буланты"],a:0,ex:"Тогда 300 казаков попали в плен к казахам.",p:28},
{t:4,k:"one",d:1,q:"В 1718 г. 20-тысячный отряд казахов и каракалпаков…",o:["месяц держал в осаде Яицкий городок","взял Омскую крепость","победил джунгар при Аныракае","захватил Ташкент"],a:0,ex:"Яицкий городок — нынешний Уральск.",p:28},
{t:4,k:"one",d:1,q:"Какую территорию заняли войска Абулхаира в 1723–1724 гг.?",o:["Между Яиком и Волгой","Между Иртышом и Обью","Между Сырдарьей и Амударьей","Всю Джунгарию"],a:0,ex:"Абулхаир активно боролся за право казахов кочевать у Яика.",p:28},
{t:4,k:"one",q:"Кому принадлежат слова: «…доколь р. Яик не высохнет, киргизский народ от нее не отлучится»?",o:["Хану Абулхаиру","Петру I","Тевкелеву","Хану Каипу"],a:0,ex:"Так Абулхаир защищал право казахов кочевать в бассейне реки Яик.",p:28},
{t:4,k:"multi",q:"Причины пограничных конфликтов России и Казахского ханства. Выбери все.",o:["Борьба за пастбищные угодья","Взаимный угон скота","Несогласие казахов со строительством линии и запретом кочевать рядом","Участие казахов в башкирских восстаниях","Спор о религии"],a:[0,1,2,3],ex:"Схема на стр. 28.",p:28},
{t:4,k:"match",q:"Соедини понятие и значение.",m:[["Редут","укрепление из дерева или камня с земляной насыпью"],["Форпост","передовой пост, небольшое укрепление между крепостями"],["Яик","название реки Урал до 1775 г."],["Яицкий городок","нынешний город Уральск"]],ex:"Словарик на стр. 29.",p:29},
{t:4,k:"one",q:"Почему реку Яик в 1775 г. переименовали в Урал?",o:["После подавления восстания Пугачёва, чтобы стереть память о нём","Так захотели казахи","Река изменила русло","По просьбе Китая"],a:0,ex:"Восстание Е. И. Пугачёва начиналось на Яике.",p:29},
{t:4,k:"one",q:"Где сейчас находится бывшая Ямышевская крепость?",o:["Село Ямышевское в Павлодарской области","Город Омск","Город Уральск","Город Семей"],a:0,ex:"Документ на стр. 29: князь Гагарин писал контайше, что Ямышевская крепость нужна для защиты от киргизов (казахов).",p:29},
{t:4,k:"one",q:"Н. Я. Коншин (1864–1937) — это…",o:["русский учёный, историк и фольклорист из Семипалатинска","русский царь","джунгарский правитель","казахский батыр"],a:0,ex:"Член Семипалатинского подотдела Русского географического общества.",p:29},
{t:4,k:"one",q:"С какой целью, по документу, царизм строил крепости по правобережью Иртыша?",o:["Для укрепления позиций и продвижения в степь под видом защиты","Для торговли с Индией","Чтобы помочь джунгарам","Для добычи золота"],a:0,ex:"Официально — защита. На деле — плацдарм для присоединения казахских и джунгарских земель.",p:"26, 29"},

/* ---------- 5. §9–10 ---------- */
{t:5,k:"one",q:"Чем воспользовалась Российская империя, чтобы начать присоединение казахских земель?",o:["Тем, что казахи воевали с джунгарами, а ханы спорили за власть","Тем, что казахи сами попросили","Голодом в Китае","Войной со Швецией"],a:0,ex:"Междоусобная борьба ханов и султанов привела к тому, что в неё втянулась и Россия.",p:30},

<h3>Курултаи</h3><div class="tbl"><table><tr><th></th><th>Каракумы</th><th>Ордабасы</th></tr><tr><td>Когда</td><td><b>1710</b></td><td><b>осень 1726</b></td></tr><tr><td>Где</td><td>между пустыней Каракум и горами Улытау</td><td>местность Ордабасы (юг)</td></tr><tr><td>Решение</td><td>создать всеказахское ополчение, клятва биться до победы</td><td><b>Абулхаир</b> избран предводителем всенародного ополчения</td></tr><tr><td>Итог</td><td>начало побед, джунгар вытесняли на восток</td><td>символ единства трёх жузов</td></tr></table></div>
<div class="remember">Осень <b>1723</b> — Абулхаир (20 тыс.) идёт на волжских калмыков. Весна <b>1724</b> — освобождает <b>Туркестан</b>. Потом ведёт казахско-каракалпакское войско в <b>50 тыс.</b></div>
<p><b>Курултай</b> — собрание кочевой знати, высшая власть. <b>Сардар</b> — военачальник. <b>Абулхаир</b> (1693–1748) — хан Младшего жуза.</p>`,
3:`<div class="kz"><i>Қалмақ қырылған</i> — «место гибели калмыков» (Буланты). <i>Аңырақай</i> — «место стонов и рыданий врага». <i>Дарабоз</i> — «Штурмующий небо» (прозвище Кабанбая).</div>
<h3>Кто вёл борьбу</h3><ul><li>Ханы и султаны: Абулмамбет, Барак, Самеке, <b>Абулхаир</b>, Жолбарыс; растёт авторитет молодого <b>Абылая</b></li><li>Идейные руководители — <b>бии</b> трёх жузов</li><li>Батыры: <b>Кабанбай, Богенбай, Есет, Райымбек</b>, Жанибек, Малайсары, Баян, Наурызбай, Олжабай, Кожаберген</li><li>Женщины: Айтолкын (дочь Абылая), Есенбике (дочь Карасай батыра), Айбике (жена Буланбай батыра)</li></ul>
<h3>Два великих сражения</h3><div class="tbl"><table><tr><th></th><th>Буланты</th><th>Аныракай</th></tr><tr><td>Когда</td><td><b>1728</b></td><td><b>весна 1730</b></td></tr><tr><td>Где</td><td>предгорья Улытау, Карасиыр, р. Буланты</td><td>Итишпес Алаколь, у оз. Балкаш</td></tr><tr><td>Кто</td><td>ополчение + кыргызы и каракалпаки, ~60 тыс.</td><td>все три жуза, руководил <b>Абулхаир</b></td></tr><tr><td>Итог</td><td>до 10 тыс. джунгар уничтожено, «Қалмақ қырылған»</td><td>джунгары разгромлены, «место стонов врага»</td></tr><tr><td>Значение</td><td>поднят дух народа, развеян миф о непобедимости джунгар</td><td><b>коренной перелом</b> в войне, джунгары отступают</td></tr></table></div>
<p>1727 — загадочная смерть Цэван-Рабдана, правит его сын <b>Галдан-Цэрэн</b>. По указанию Богенбая погибших похоронили на вершинах Улытау. Столкновения шли до 30–40-х гг. XVIII в.</p>
<h3>После Аныракая</h3><ul><li>Спор за титул старшего хана: <b>Абулхаир и Самеке</b></li><li>Знать выбрала слабого <b>Абулмамбета</b> → Абулхаир и Самеке ушли → ополчение распалось</li><li>Старший жуз — временно под джунгарами (аманаты, дань); Средний — воюет; Младший — в окружении (хивинцы, туркмены, калмыки, яицкие казаки, башкиры)</li></ul>
<div class="remember"><b>Аманат</b> — заложник. Богенбай (1680–1778) — полководец, дипломат, сподвижник Абылая. Кабанбай (1691–1769) — «Дарабоз». Райымбек (1705–1785) — Старший жуз, род албан. Есет Кокиулы (1667–1749) — Младший жуз.</div>
<p>Документ: Баянаульские горы (Павлодарская обл.), батыр <b>Жасыбай</b>, предводитель <b>Олжабай</b> — калмыки просили пощады.</p>`,
4:`<h3>Начало отношений</h3><ul><li>С <b>XVI в.</b>: торговля и дипломатия. Средний жуз торговал с купцами <b>Строгановыми</b></li><li><b>Пётр I</b>: Казахстан — «ключ и врата» в Азию</li><li><b>1716</b> — хан <b>Каип</b> просит Россию вместе бороться с джунгарами (то же пытался Абулхаир). Россия занята войной со <b>Швецией</b></li></ul>
<h3>Зачем России Казахстан (4 причины)</h3><ul><li>Плацдарм для продвижения в Центральную Азию, Индию, Афганистан</li><li>Рынок для российских фабричных товаров</li><li>Сырьё, полезные ископаемые, продукция скотоводства</li><li>Новое податное население</li></ul>
<h3>Иртышская линия</h3><div class="tbl"><table><tr><th>Год</th><th>Крепость</th></tr><tr><td>1716</td><td><b>Омская</b> (И. Бухгольц) и Ямышевская</td></tr><tr><td>1717</td><td>Железинская</td></tr><tr><td>1718</td><td>Семипалатинская</td></tr><tr><td>1720</td><td>Усть-Каменогорская и Коряковская</td></tr></table></div>
<p>Между крепостями — <b>форпосты</b> и <b>редуты</b>. Джунгарам говорили: защита от казахов; казахам: защита от джунгар. На деле — плацдарм.</p>
<h3>Посольства</h3><ul><li>1716 — тобольский боярин <b>Никита Белоусов</b></li><li>1717–1718 — <b>Борис Брянцев и Фёдор Жилин</b></li><li>Колмаков, Урусов, Сомов — изучали оз. Жайсан и Чёрный Иртыш</li></ul>
<h3>Пограничные конфликты</h3><ul><li><b>1711</b> — 16 тыс. казахов захватили хлебный обоз в Яицкий городок, 300 казаков в плену</li><li><b>1718</b> — 20 тыс. казахов и каракалпаков месяц осаждали Яицкий городок</li><li><b>1723–1724</b> — войска Абулхаира заняли земли между Яиком и Волгой. «…доколь р. Яик не высохнет, киргизский народ от нее не отлучится»</li></ul>
<div class="remember">Причины конфликтов: борьба за пастбища; взаимный угон скота; запрет кочевать у линии; участие казахов в башкирских восстаниях.</div>
<p><b>Яик</b> — Урал до 1775 г. (переименовали после восстания Пугачёва). <b>Яицкий городок</b> — Уральск. <b>Ямышевская</b> — село в Павлодарской обл. <b>Коншин</b> (1864–1937) — историк из Семипалатинска.</p>`,
5:`<h3>Почему Абулхаир пошёл к России</h3><ul><li>Хотел укрепить <b>единоличную власть</b> с помощью России</li><li>Хотел остановить набеги башкир, калмыков, уральских казаков, джунгар</li><li>1730 — бии Младшего жуза поручили договориться о <b>военном союзе</b></li><li>Преувеличивал: «Хива и Бухара в моей воле»</li></ul>
<h3>Главные события</h3><div class="tbl"><table><tr><th>Когда</th><th>Что</th></tr><tr><td>сентябрь 1730</td><td>посольство Абулхаира в Петербург к <b>Анне Иоанновне</b></td></tr><tr><td><b>19 февраля 1731</b></td><td>грамота о принятии Младшего жуза в подданство</td></tr><tr><td>весна 1731</td><td>посольство <b>А. И. Тевкелева</b> (до 1 млн руб. на подкуп; с ним Таймас Шаимов)</td></tr><tr><td><b>10 октября 1731</b></td><td>присяга в урочище <b>Майтюбе</b> (между Иргизом и Тоболом)</td></tr></table></div>
<div class="remember">Условия грамоты: казахи верны России и платят налог как башкиры; подданные России не нападают на казахов; Россия защищает казахов; Абулхаир возвращает пленных и живёт в мире с калмыками и башкирами. <b>Ни один пункт не выполнен.</b></div>
<ul><li>Письмо хана <b>не</b> содержало просьбы о подданстве — только о дружбе</li><li>Казахи понимали это как <b>военный союз</b> при полной самостоятельности</li><li>Уже присоединены: волжские калмыки, Кабардинское княжество</li><li><b>Оппозиция</b>: подданство — личная инициатива хана. Тевкелева едва не убили. Охрана — сын хана <b>Нуралы</b></li><li>Награды: Тевкелев — полковник, потом генерал; Шаимов — <b>тархан</b>; Абулхаир — хан только Младшего жуза</li><li><b>1741</b> — поход Галдан-Цэрэна, Россия не помогла</li><li>Степь фактически самостоятельна до <b>20-х гг. XIX в.</b>, налогов не платили</li></ul>
<h3>Политика России в 30–50-е гг.</h3><ul><li><b>1734</b> — Киргиз-кайсацкая экспедиция; запрет кочевать на правобережье Яика</li><li><b>1735</b> — Орская (Оренбургская) крепость</li><li>Уйская линия: Верхнеяицкая — Звериноголовская, 770 вёрст</li><li><b>1742</b>, 19 октября — указ: не кочевать близ Яика</li><li><b>1752–1755</b> — Новоишимская линия (соединила Уйскую с Иртышской)</li></ul>
<h3>Последствия</h3><ul><li>Постепенная потеря независимости, ханы → послушные чиновники</li><li>Раздробленность, разрушение единства</li><li>Меньше пастбищ, подрыв скотоводства</li><li>Хуже отношения со Средней Азией: набеги Хивы и Бухары</li></ul>
<p><b>Нуралы</b> — хан Младшего жуза 1748–1786, старший сын Абулхаира. <b>Тевкелев</b> (1674–1766) — дипломат, переводчик, генерал.</p>`
};

const OPEN = [
{t:1,q:"Какова была политика Российской империи по отношению к казахско-джунгарским войнам?",a:"Россия держалась <b>относительно нейтрально</b>: ей было выгодно, чтобы и Казахское ханство, и Джунгария ослабли. В это время она строила Иртышскую военную линию. Когда казахи массово откочевали к Жайыку, Россия укрепила пограничную стражу и стала строить новые укрепления."},
{t:1,q:"Назовите причины поражения казахов в первые годы Великого бедствия.",a:"<ul><li>Разобщённость жузов, нет единства</li><li>Джунгары хорошо подготовились</li><li>Внезапное нападение весной, когда аулы были далеко друг от друга</li><li>Сильный джут, нехватка лошадей</li><li>Джунгары заключили мир с Китаем</li><li>У джунгар хорошо вооружённая опытная армия</li></ul>"},
{t:1,q:"Какие последствия имели «Годы Великого бедствия»?",a:"Погибло две трети населения, многих угнали в рабство, начался голод. Нарушились маршруты кочёвок, потеряны пастбища и скот, прервалась торговля, разрушены города. Народ рассеялся, начались земельные конфликты с соседями. Ослабевшее ханство потом не устояло против колонизации Российской империей."},
{t:1,q:"Почему «Елім-ай» стала всенародной песней?",a:"В ней выражено горе всего народа: потеря родины и близких, бегство от врага. Беда коснулась каждой семьи во всех трёх жузах, поэтому песню пели все."},
{t:1,q:"Вставьте пропущенные слова: «В 1635 г. образовалось … во главе с Батуром хунтайджи. «Ақтабан шұбырынды» охватывают … годы. События освещены в поэме-дастане Ш. Кудайбердыулы … . Знаком великой скорби стала песня-плач …».",a:"Джунгарское ханство; <b>1723–1727</b>; «Қалқаман-Мамыр»; «Елім-ай»."},
{t:2,q:"Какую роль играли батыры в казахском обществе?",a:"Батыры командовали отрядами ополчения, защищали землю и народ, поднимали боевой дух. Звание давали только за личные подвиги, поэтому им мог стать человек любого происхождения. Батыров уважали: в их честь называли детей, лучших хоронили в мавзолее Ходжа Ахмеда Ясауи."},
{t:2,q:"Заполните таблицу о курултаях 1710 и 1726 гг.",a:"<ul><li><b>Каракумы, 1710</b>, между пустыней Каракум и горами Улытау. Решение: создать всеказахское ополчение, клятва сражаться до победы. Итог: начались победы, джунгар стали вытеснять на восток.</li><li><b>Ордабасы, осень 1726</b>. Собрались ханы, султаны, бии, батыры трёх жузов. Решение: Абулхаир избран предводителем ополчения, каждый род даёт отряды. Итог: судьбоносная роль в освободительной борьбе, символ единства.</li></ul>"},
{t:2,q:"Каким образом степняки оповещали соплеменников о надвигающейся угрозе?",a:"Днём — поворотами и кружением на коне вправо или влево. Ночью — зажжёнными огнями и искрами от огнива. Левшин писал: «вместо телеграфов зажигают огни»."},
{t:2,q:"Опишите вооружение казахского воина.",a:"Дальний бой: лук со стрелами (<b>садақ</b>). Ближний бой: прямой меч <b>семсер</b>, кривая сабля <b>қылыш</b>, шашка <b>сапы</b>. Колющее: копьё <b>найза</b>, длинная пика <b>сүңгі</b>. Ещё топор <b>балта</b>, секира <b>айбалта</b>, палица <b>шоқпар</b>. Богатые воины носили кольчугу из стальной проволоки и железный шлем."},
{t:3,q:"Сравните Булантинское и Аныракайское сражения (место, время, результат, значение).",a:"<ul><li><b>Буланты</b>: 1728, предгорья Улытау, р. Буланты. ~60 тыс. казахов с кыргызами и каракалпаками, уничтожено до 10 тыс. джунгар. Значение: поднят дух, развеян миф о непобедимости джунгар.</li><li><b>Аныракай</b>: весна 1730, Итишпес Алаколь у Балкаша. Руководил Абулхаир, все три жуза. Значение: коренной перелом, джунгары начали отступать.</li></ul>"},
{t:3,q:"Почему Аныракайскую битву считают коренным переломом в войне?",a:"Ханы и султаны трёх жузов забыли старые споры и выступили единым фронтом. Джунгарское войско было разгромлено, джунгары начали отступать и оставлять захваченные земли. Окончательная победа стала близка."},
{t:3,q:"Назовите причины кризиса ханской власти после Аныракая. Как вы оцениваете действия Абулхаира и Самеке?",a:"Началась борьба за титул старшего хана. Знать выбрала слабого Абулмамбета: местным правителям не нужен был сильный хан. Обиженные Абулхаир и Самеке ушли с поля боевых действий, и ополчение распалось. <i>Оценка:</i> они были сильными полководцами, но личная обида оказалась важнее единства народа — каждый жуз остался один перед врагом."},
{t:3,q:"Каким было положение Казахского ханства в начале XVIII в.? Приведите 5 доказательств.",a:"<ul><li>После Тауке ханство потеряло единство</li><li>Борьба султанов за власть, сепаратизм</li><li>Ослабли связи между жузами</li><li>Набеги джунгар, калмыков, башкир, казаков</li><li>Россия и Китай хотели ослабить ханство</li></ul>"},
{t:4,q:"С какими задачами отправляли посольства в Казахскую степь?",a:"Торговля, вопрос военного союза, изучение земель (озеро Жайсан, Чёрный Иртыш), а главное — Россия искала пути <b>подчинения</b> Казахского ханства."},
{t:4,q:"Назовите крепости, построенные в тот период, и время строительства. Сделайте вывод.",a:"1716 — Ямышевская и Омская; 1717 — Железинская; 1718 — Семипалатинская; 1720 — Усть-Каменогорская и Коряковская. <b>Вывод</b>: Россия построила Иртышскую линию, чтобы закрепиться в Прииртышье и продвигаться в казахскую степь."},
{t:4,q:"Почему Россия считала Казахстан «ключом и вратами» в Азию?",a:"Через казахскую степь лежал путь в Центральную Азию, Индию, Афганистан и другие страны Азии. Кто владеет степью, тот открывает себе дорогу на Восток."},
{t:4,q:"С какой целью царизм строил крепости по правобережью Иртыша?",a:"Официально — для защиты от набегов (джунгарам говорили: от казахов, казахам — от джунгар). На деле — как <b>плацдарм</b> для усиления царизма в бассейне Иртыша и последующего присоединения казахских и джунгарских земель."},

OPEN.forEach((o,i)=>o.id="o"+i);

/* ================== СОСТОЯНИЕ ================== */
const KEY="hist7_arsen_v1";
let S={best:{},wrong:{},seen:{},known:{},sor:[]};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const app=document.getElementById("app");
const T=id=>TOPICS.find(t=>t.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200);}
function top0(){window.scrollTo(0,0);}

/* ================== ГЛАВНАЯ ================== */
function home(){
  const seen=Object.keys(S.seen).length, wrongN=Object.keys(S.wrong).length;
  const known=Object.keys(S.known).length, dN=Q.filter(q=>q.d).length;
  let h=`<header class="top">
    <div class="eyebrow">Арсен · 7 класс · стр. 5–36</div>
    <h1>История Казахстана: готовимся к СОРу</h1>
    <p>Арсен, выбери тему: сначала прочитай шпаргалку, потом пройди тест. Ошибки сохраняются, их можно отработать отдельно. Даты учи в «Ленте дат».</p>
    <div class="stats">
      <div class="stat"><b>${seen}/${Q.length}</b><span>вопросов решено</span></div>
      <div class="stat"><b>${wrongN}</b><span>ошибок на работу</span></div>
      <div class="stat"><b>${S.sor.length?Math.max(...S.sor)+"%":"—"}</b><span>лучший пробный СОР</span></div>
    </div></header>
  <div class="modes">
    <button class="mode primary" data-act="sor"><strong>Пробный СОР</strong><small>15 случайных вопросов по разделу, с оценкой в конце</small></button>
    <button class="mode gold" data-act="dates"><strong>Лента дат</strong><small>${DATES.length} дат по порядку + тест из ${dN} вопросов</small></button>
    <button class="mode" data-act="mist" ${wrongN?"":"disabled"}><strong>Работа над ошибками</strong><small>${wrongN?wrongN+" вопр. — пока не ответишь верно":"Ошибок пока нет"}</small></button>
    <button class="mode" data-act="open" style="grid-column:1/-1"><strong>Письменные задания</strong><small>Вопросы «объясните, сравните, заполните таблицу» с образцами ответов · ${known}/${OPEN.length}</small></button>
  </div>`;
  [1,2].forEach(s=>{
    h+=`<div class="sec-title"><h2>${SECTIONS[s][0]}</h2><span class="mono">${SECTIONS[s][1]}</span></div><div class="route">`;
    TOPICS.filter(t=>t.s===s).forEach(t=>{
      const n=Q.filter(q=>q.t===t.id).length, b=S.best[t.id];
      h+=`<div class="topic s${t.s}"><div class="pin ${b>=80?"done":""}">${t.par}</div><div style="min-width:0">
        <h3>${t.title}</h3><div class="meta">стр. ${t.pages} · ${n} вопросов${b!=null?` · рекорд <span class="mono">${b}%</span>`:""}</div>
        <div class="bar"><i style="width:${b||0}%"></i></div>
        <div class="acts"><button class="chip" data-cheat="${t.id}">Шпаргалка</button><button class="chip fill" data-quiz="${t.id}">Тест</button></div></div></div>`;
    });
    h+=`</div>`;
  });
  h+=`<p class="foot">Учебник: История Казахстана (XVIII–XIX вв.), 7 класс, Кабульдинов, Калиев, Бейсембаева, «Атамұра» 2025. Прогресс хранится в этом браузере.</p>`;
  app.innerHTML=h; top0();
  app.querySelectorAll("[data-cheat]").forEach(b=>b.onclick=()=>cheat(+b.dataset.cheat));
  app.querySelectorAll("[data-quiz]").forEach(b=>b.onclick=()=>startQuiz(shuffle(Q.filter(q=>q.t===+b.dataset.quiz)),{type:"topic",topic:+b.dataset.quiz}));
  app.querySelector('[data-act="sor"]').onclick=sorPick;
  app.querySelector('[data-act="dates"]').onclick=()=>dates(false);
  app.querySelector('[data-act="mist"]').onclick=()=>{const l=Q.filter(q=>S.wrong[q.id]);if(l.length)startQuiz(shuffle(l),{type:"mist"});};
  app.querySelector('[data-act="open"]').onclick=()=>openTasks(0);
}

/* ================== ШПАРГАЛКА ================== */
function cheat(id){
  const t=T(id);
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Все темы</button><span class="tag s${t.s}">${t.par} · стр. ${t.pages}</span></div>
  <article class="panel cheat s${t.s}"><h2>${t.title}</h2>${CHEAT[id]}
  <div class="btns"><button class="btn" id="go">Пройти тест по теме</button><button class="btn ghost" id="bk2">Назад</button></div></article>`;
  top0();
  document.getElementById("bk").onclick=home;document.getElementById("bk2").onclick=home;
  document.getElementById("go").onclick=()=>startQuiz(shuffle(Q.filter(q=>q.t===id)),{type:"topic",topic:id});
}

/* ================== ЛЕНТА ДАТ ================== */
function dates(hide){
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Все темы</button></div>
  <div class="panel"><h2 style="font-size:26px">Лента дат</h2>
  <p class="muted" style="margin:6px 0 0">Читай сверху вниз. Потом включи «Проверь себя»: события скроются, вспоминай и нажимай на строку, чтобы открыть.</p>
  <div class="filter"><button class="chip ${hide?"":"on"}" data-h="0">Показать всё</button><button class="chip ${hide?"on":""}" data-h="1">Проверь себя</button></div>
  <div class="tl ${hide?"hide":""}" id="tl">${DATES.map(([y,sub,tx,s])=>`<button class="ev s${s}"><span class="yr">${y}${sub?`<small>${sub}</small>`:""}</span><span class="tx"><span class="sec">${s===1?"Раздел I":"Раздел II"}</span><br>${tx}</span></button>`).join("")}</div>
  <div class="btns"><button class="btn" id="dq">Тест по датам (${Q.filter(q=>q.d).length})</button></div></div>`;

/* ================== ПРОБНЫЙ СОР ================== */
function sorPick(){
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Все темы</button></div>
  <div class="panel"><h2 style="font-size:26px">Пробный СОР</h2>
  <p class="muted">Выбери, что будет на СОРе. Если не знаешь — бери «Всё, стр. 5–36».</p>
  <div class="btns">
   <button class="btn" data-s="1">Раздел I · §1–6 (джунгарские войны)</button>
   <button class="btn" data-s="2">Раздел II · §7–10 (Россия)</button>
   <button class="btn ghost" data-s="0">Всё, стр. 5–36 (20 вопросов)</button>
  </div></div>`;
  top0();
  document.getElementById("bk").onclick=home;
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    const s=+b.dataset.s;
    let pool=s?Q.filter(q=>T(q.t).s===s):Q.slice();
    const n=s?Math.min(15,pool.length):20;
    const byT={};shuffle(pool).forEach(q=>(byT[q.t]=byT[q.t]||[]).push(q));
    const keys=Object.keys(byT);let out=[];let i=0;
    while(out.length<n){const k=keys[i%keys.length];if(byT[k].length)out.push(byT[k].shift());i++;if(i>1000)break;}
    startQuiz(shuffle(out),{type:"sor",sec:s});
  });
}

/* ================== КВИЗ ================== */
let R=null;
function startQuiz(list,mode){R={list,mode,i:0,right:0,wrongList:[]};renderQ();}
function renderQ(){
  const q=R.list[R.i], t=T(q.t), n=R.list.length;
  const title=R.mode.type==="sor"?"Пробный СОР":R.mode.type==="mist"?"Работа над ошибками":R.mode.type==="dates"?"Тест по датам":t.title;
  let body="";
  const kindHint={one:"Выбери один ответ",multi:"Выбери ВСЕ верные ответы",order:"Нажимай по порядку. Нажми ещё раз, чтобы убрать",match:"Для каждой строки выбери ответ из списка"}[q.k];
  if(q.k==="one"||q.k==="multi"){
    R.perm=shuffle(q.o.map((_,i)=>i));
    body=`<div class="opts">${R.perm.map((oi,j)=>`<button class="opt ${q.k==="one"?"round":""}" data-oi="${oi}"><span class="box">${q.k==="multi"?"":"АБВГДЕЖЗИ"[j]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>`;
  } else if(q.k==="order"){
    R.pick=[];R.perm=shuffle(q.o.map((_,i)=>i));
    body=`<div class="order-built" id="built"></div><div class="opts" id="pool"></div>`;
  } else if(q.k==="match"){
    const rights=[...new Set(q.m.map(p=>p[1]))];R.rights=shuffle(rights);
    body=`<div class="match">${q.m.map((p,i)=>`<div class="mrow" id="mr${i}"><label for="ms${i}">${esc(p[0])}</label><select id="ms${i}"><option value="">— выбери —</option>${R.rights.map((r,j)=>`<option value="${j}">${esc(r)}</option>`).join("")}</select></div>`).join("")}</div>`;
  }
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Выйти</button><span class="mono muted" style="font-size:13px">${R.i+1} / ${n}</span></div>
  <div class="panel s${t.s}">
   <div class="qtop"><span class="tag">${t.par} · ${esc(title)}</span><span class="mono">стр. ${q.p}</span></div>
   <div class="progress"><i style="width:${(R.i)/n*100}%"></i></div>
   <div class="qtext">${esc(q.q)}</div><div class="hint">${kindHint}</div>
   ${body}
   <div id="fbx"></div>
   <div class="btns" id="ctl">${q.k==="one"?"":`<button class="btn" id="chk" disabled>Проверить</button>`}</div>
  </div>`;
  top0();
  document.getElementById("bk").onclick=()=>{R=null;home();};
  const chk=document.getElementById("chk");
  if(q.k==="one"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{b.classList.add("sel");check(+b.dataset.oi);});
  } else if(q.k==="multi"){
    const sel=new Set();
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const oi=+b.dataset.oi;sel.has(oi)?sel.delete(oi):sel.add(oi);b.classList.toggle("sel");b.querySelector(".box").textContent=sel.has(oi)?"✓":"";chk.disabled=!sel.size;});
    chk.onclick=()=>check([...sel]);
  } else if(q.k==="order"){
    const draw=()=>{
      const built=document.getElementById("built"),pool=document.getElementById("pool");
      built.innerHTML=R.pick.length?R.pick.map((oi,k)=>`<button class="oitem" data-rm="${oi}"><span class="n">${k+1}</span><span>${esc(q.o[oi])}</span></button>`).join(""):`<div class="empty">Нажимай на пункты ниже в правильном порядке</div>`;
      pool.innerHTML=R.perm.filter(oi=>!R.pick.includes(oi)).map(oi=>`<button class="opt" data-ad="${oi}"><span class="box">+</span><span>${esc(q.o[oi])}</span></button>`).join("");
      built.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{R.pick=R.pick.filter(x=>x!==+b.dataset.rm);draw();});
      pool.querySelectorAll("[data-ad]").forEach(b=>b.onclick=()=>{R.pick.push(+b.dataset.ad);draw();});
      chk.disabled=R.pick.length!==q.o.length;
    };
    draw();chk.onclick=()=>check(R.pick.slice());
  } else if(q.k==="match"){
    const sels=[...app.querySelectorAll("select")];
    sels.forEach(s=>s.onchange=()=>{chk.disabled=sels.some(x=>x.value==="");});
    chk.onclick=()=>check(sels.map(s=>R.rights[+s.value]));
  }
}
function check(ans){
  const q=R.list[R.i];let ok=false,rightText="";
  if(q.k==="one"){
    ok=ans===q.a;
    app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const oi=+b.dataset.oi;if(oi===q.a)b.classList.add("right");else if(oi===ans)b.classList.add("wrong");b.classList.remove("sel");});
    rightText=q.o[q.a];
  } else if(q.k==="multi"){
    const A=new Set(q.a);ok=ans.length===A.size&&ans.every(x=>A.has(x));
    app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const oi=+b.dataset.oi,picked=ans.includes(oi);b.classList.remove("sel");
      if(A.has(oi)){b.classList.add("right");b.querySelector(".box").textContent="✓";}else if(picked){b.classList.add("wrong");b.querySelector(".box").textContent="✕";}});
    rightText=q.a.map(i=>q.o[i]).join("; ");
  } else if(q.k==="order"){
    ok=ans.every((oi,k)=>oi===k);
    const built=document.getElementById("built");
    built.innerHTML=ans.map((oi,k)=>`<div class="oitem ${oi===k?"right":"wrong"}"><span class="n">${k+1}</span><span>${esc(q.o[oi])}</span></div>`).join("");
    document.getElementById("pool").innerHTML="";
    rightText=q.o.map((x,k)=>(k+1)+") "+x).join(" → ");
  } else if(q.k==="match"){
    ok=ans.every((r,i)=>r===q.m[i][1]);
    q.m.forEach((p,i)=>{const row=document.getElementById("mr"+i),s=document.getElementById("ms"+i);s.disabled=true;
      if(ans[i]===p[1])row.classList.add("right");else{row.classList.add("wrong");row.insertAdjacentHTML("beforeend",`<span class="fix">Верно: ${esc(p[1])}</span>`);}});
    rightText="";
  }
  S.seen[q.id]=1;
  if(ok){R.right++;if(S.wrong[q.id])delete S.wrong[q.id];}
  else{S.wrong[q.id]=1;R.wrongList.push(q);}
  save();
  const praise=["Верно!","Точно!","Молодец!","Так держать!","Правильно!","Жарайсың!"];
  document.getElementById("fbx").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b class="v">${ok?praise[Math.floor(Math.random()*praise.length)]:"Не совсем"}</b>${!ok&&rightText?`<div><b>Правильно:</b> ${esc(rightText)}</div>`:""}<div>${esc(q.ex)}</div><span class="pg">Учебник, стр. ${q.p}</span></div>`;
  const last=R.i===R.list.length-1;
  document.getElementById("ctl").innerHTML=`<button class="btn" id="nx">${last?"Результат":"Дальше →"}</button>`;
  document.getElementById("nx").onclick=()=>{if(last)result();else{R.i++;renderQ();}};
  document.getElementById("fbx").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function result(){
  const n=R.list.length,pct=Math.round(R.right/n*100),m=R.mode;
  if(m.type==="topic"){S.best[m.topic]=Math.max(S.best[m.topic]||0,pct);}
  if(m.type==="sor"){S.sor.push(pct);}
  save();
  let verdict=pct>=85?"Отлично! Ты готов к СОРу.":pct>=65?"Хорошо, но повтори ошибки.":pct>=40?"Перечитай шпаргалку и пройди ещё раз.":"Сначала прочитай шпаргалку, потом снова тест.";
  const level=m.type==="sor"?`<div class="mono muted" style="margin-top:8px">Уровень: ${pct>=85?"высокий":pct>=50?"средний":"низкий"}</div>`:"";
  const head=m.type==="sor"?"Пробный СОР":m.type==="mist"?"Работа над ошибками":m.type==="dates"?"Тест по датам":T(m.topic).par+" · "+T(m.topic).title;
  app.innerHTML=`<div class="panel"><div class="eyebrow">${esc(head)}</div>
  <div style="display:flex;align-items:baseline;gap:12px;margin-top:10px"><div class="score">${R.right}/${n}</div><div class="mono muted">${pct}%</div></div>
  <div class="verdict">${verdict}</div>${level}
  ${R.wrongList.length?`<h3 style="margin-top:18px;font-size:19px">Где ошибся</h3><div class="mist">${R.wrongList.map(q=>`<div><b>${esc(q.q)}</b>${q.k==="one"?"Ответ: "+esc(q.o[q.a]):q.k==="multi"?"Ответ: "+esc(q.a.map(i=>q.o[i]).join("; ")):q.k==="order"?esc(q.o.join(" → ")):esc(q.m.map(p=>p[0]+" — "+p[1]).join("; "))} <span class="mono muted">(стр. ${q.p})</span></div>`).join("")}</div>`:""}
  <div class="btns">
   ${R.wrongList.length?`<button class="btn" id="rw">Повторить ошибки (${R.wrongList.length})</button>`:""}
   ${m.type==="topic"?`<button class="btn ${R.wrongList.length?"ghost":""}" id="again">Пройти тему ещё раз</button>`:""}
   ${m.type==="sor"?`<button class="btn ${R.wrongList.length?"ghost":""}" id="sor2">Новый пробный СОР</button>`:""}
   ${m.type==="dates"?`<button class="btn ghost" id="tl2">Вернуться к ленте дат</button>`:""}
   <button class="btn ghost" id="hm">На главную</button></div></div>`;
  top0();
  const wl=R.wrongList.slice(),mode=m;
  const rw=document.getElementById("rw");if(rw)rw.onclick=()=>startQuiz(shuffle(wl),{type:"mist"});
  const ag=document.getElementById("again");if(ag)ag.onclick=()=>startQuiz(shuffle(Q.filter(q=>q.t===mode.topic)),mode);
  const s2=document.getElementById("sor2");if(s2)s2.onclick=sorPick;
  const t2=document.getElementById("tl2");if(t2)t2.onclick=()=>dates(false);
  document.getElementById("hm").onclick=home;
}

/* ================== ПИСЬМЕННЫЕ ЗАДАНИЯ ================== */
function openTasks(filter){
  const list=OPEN.filter(o=>!filter||T(o.t).s===filter);
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Все темы</button><span class="mono muted" style="font-size:13px">знаю ${Object.keys(S.known).length}/${OPEN.length}</span></div>
  <div class="panel"><h2 style="font-size:26px">Письменные задания</h2>
  <p class="muted" style="margin:6px 0 0">На СОРе бывают задания «объясните», «сравните», «заполните таблицу». Сначала ответь сам (вслух или в тетради), потом открой образец и честно отметь.</p>
  <div class="filter">${[["0","Все"],["1","Раздел I"],["2","Раздел II"]].map(([v,l])=>`<button class="chip ${+v===filter?"on":""}" data-f="${v}">${l}</button>`).join("")}</div>
  <div>${list.map(o=>{const t=T(o.t);return `<div class="task s${t.s} ${S.known[o.id]?"known":""}" id="${o.id}"><span class="tag">${t.par}</span><div class="q" style="margin-top:6px">${esc(o.q)}</div>
   <div class="ans" hidden>${o.a}</div>
   <div class="row"><button class="chip fill" data-show="${o.id}">Показать ответ</button>${S.known[o.id]?`<span class="mono" style="color:var(--ok);font-size:13px;align-self:center">✓ знаю</span>`:""}</div></div>`;}).join("")}</div></div>`;
  top0();
  document.getElementById("bk").onclick=home;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>openTasks(+b.dataset.f));
  app.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.show,card=document.getElementById(id);card.querySelector(".ans").hidden=false;
    card.querySelector(".row").innerHTML=`<button class="chip" data-k="1">Я ответил так же</button><button class="chip" data-k="0">Надо ещё повторить</button>`;
    card.querySelectorAll("[data-k]").forEach(k=>k.onclick=()=>{if(k.dataset.k==="1"){S.known[id]=1;card.classList.add("known");toast("Отлично, отмечено");}else{delete S.known[id];card.classList.remove("known");toast("Вернись к нему позже");}save();
      card.querySelector(".row").innerHTML=S.known[id]?`<span class="mono" style="color:var(--ok);font-size:13px">✓ знаю</span>`:`<span class="mono muted" style="font-size:13px">повторить</span>`;});
  });
}

home();
</script>

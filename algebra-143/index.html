<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фильмы и круг — с. 143</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: одна карточка = один маленький шаг; снизу полоса шагов, экранная клавиатура для чисел */
:root{
  --bg:#f3f5fb; --card:#ffffff; --ink:#18203a; --muted:#5c6684; --line:#dbe1ef;
  --pen:#2546c4; --pen-soft:#e5eafb; --ok:#14834f; --ok-soft:#ddf3e7; --bad:#c4382e; --bad-soft:#fbe6e3;
  --sun:#f2a516; --sun-soft:#fff3d6; --ring:#d0453a; --dia:#2e8b3a;
  --display:"Unbounded","Golos Text",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141d; --card:#1a2030; --ink:#e8ecf6; --muted:#9ba5c0; --line:#2b3448;
  --pen:#8aa2ff; --pen-soft:#24304f; --ok:#5fd39a; --ok-soft:#183126; --bad:#ff8a7e; --bad-soft:#3a2224;
  --sun:#f5b94a; --sun-soft:#3a2f17; --ring:#ff7b70; --dia:#6fd27c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141d; --card:#1a2030; --ink:#e8ecf6; --muted:#9ba5c0; --line:#2b3448;
  --pen:#8aa2ff; --pen-soft:#24304f; --ok:#5fd39a; --ok-soft:#183126; --bad:#ff8a7e; --bad-soft:#3a2224;
  --sun:#f5b94a; --sun-soft:#3a2f17; --ring:#ff7b70; --dia:#6fd27c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 28px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
header b{font-family:var(--display);font-weight:500;font-size:15px}
header span{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px;margin-bottom:14px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--ok)}.dots i.now{background:var(--pen)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;min-height:300px;display:flex;flex-direction:column;gap:14px}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--pen);font-weight:700}
.q{font-size:21px;font-weight:600;line-height:1.35;text-wrap:balance}
.say{font-size:17px}
.say b{color:var(--pen)}
.big{font-family:var(--display);font-size:30px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums}
.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:17px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 4px;text-align:center}
.tbl th{background:var(--pen-soft);color:var(--pen);font-weight:600;font-size:14px}
.tbl td.hl{background:var(--sun-soft);font-weight:700}
.tbl td.q3{background:var(--sun-soft);font-weight:700;color:var(--pen)}
.tickets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ticket{border:2px dashed var(--sun);background:var(--sun-soft);border-radius:8px;padding:6px 10px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.answer{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:28px;min-height:56px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-variant-numeric:tabular-nums}
.answer .cur{color:var(--pen)}
.answer .ph{color:var(--muted);font-size:18px;font-family:var(--body)}
.answer.good{border-color:var(--ok);background:var(--ok-soft)}
.answer.bad{border-color:var(--bad);background:var(--bad-soft)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{font:inherit;font-size:22px;font-weight:600;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;touch-action:manipulation}
.pad button.ok{background:var(--pen);color:var(--card);border-color:var(--pen);font-size:18px}
.pad button.del{font-size:18px}
.opts{display:grid;gap:8px}
.opts button{font:inherit;font-size:18px;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.opts button.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:12px;padding:11px 13px;font-size:16px}
.fb.ok{background:var(--ok-soft)}.fb.ok b{color:var(--ok)}
.fb.no{background:var(--bad-soft)}
.fb.help{background:var(--sun-soft)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.btn{font:inherit;font-size:17px;font-weight:600;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.main{background:var(--pen);color:var(--card);border-color:var(--pen);flex:1}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
svg.circ{display:block;width:100%;height:auto}
.circ text{font-family:var(--body);font-size:13px;font-weight:700}
.note{font-size:14px;color:var(--muted)}
.hw{border:2px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:17px;background:var(--bg)}
.hw p{margin:4px 0}
.hw .n{font-weight:700;color:var(--pen)}
.formula{font-family:var(--display);font-size:24px;text-align:center;padding:10px;border-radius:12px;background:var(--pen-soft);color:var(--pen)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><b>Алгебра · с. 143 · № 7 и 8</b><span id="cnt"></span></header>
  <div class="dots" id="dots"></div>
  <div class="card" id="card"></div>
  <div class="nav"><button type="button" class="btn" id="back">← Назад</button><button type="button" class="btn main" id="next" disabled>Дальше →</button></div>
  <p class="note" style="text-align:center;margin-top:14px">Ответы вводи кнопками на экране. Ошибся — не страшно, будет подсказка.</p>
</div>

<script>
const TABLE=`<table class="tbl"><tr><th>Фильмов, x</th><td>0</td><td>1</td><td>2</td><td>4</td></tr><tr><th>Цена, y (тг)</th><td>0</td><td>1000</td><td>2000</td><td>4000</td></tr></table>`;
const TABLE_HL=(i)=>`<table class="tbl"><tr><th>Фильмов, x</th>${[0,1,2,4].map((v,j)=>`<td${j===i?' class="hl"':''}>${v}</td>`).join("")}</tr><tr><th>Цена, y (тг)</th>${[0,1000,2000,4000].map((v,j)=>`<td${j===i?' class="hl"':''}>${v}</td>`).join("")}</tr></table>`;
const tick=n=>`<div class="tickets">${Array.from({length:n},()=>`<span class="ticket">🎬 1000 тг</span>`).join("")}</div>`;

/* Шаги. type: info | num | choice */
const STEPS=[
 {tag:"№ 7 · Фильмы",type:"info",html:`<div class="q">Прокат фильмов</div><div class="say">В учебнике таблица: сколько стоит взять напрокат <b>x</b> фильмов.</div>${TABLE}<div class="say">Сначала поймём таблицу. По одному вопросу за раз.</div>`},
 {tag:"№ 7 · Фильмы",type:"num",q:"Сколько стоит <b>1 фильм</b>?",extra:TABLE_HL(1),ans:1000,unit:"тг",
  help:["Найди в таблице столбик, где x = 1. Что написано под ним?"],ok:"Один фильм — 1000 тг. Запомни это число, оно главное."},
 {tag:"№ 7 · Фильмы",type:"num",q:"Сколько стоят <b>2 фильма</b>? Посчитай сам, потом сверь с таблицей.",extra:tick(2),ans:2000,unit:"тг",
  help:["Каждый фильм по 1000 тг. Два билета: 1000 + 1000."],ok:"2 фильма = 2 · 1000 = 2000 тг. В таблице то же самое."},
 {tag:"№ 7 · Фильмы",type:"num",q:"А <b>3 фильма</b>? Их в таблице нет — посчитай сам.",extra:tick(3),ans:3000,unit:"тг",
  help:["Три билета по 1000 тг: 1000 + 1000 + 1000.","Это то же, что 3 · 1000."],ok:"3 фильма = 3 · 1000 = 3000 тг. Это ответ на <b>№ 7b</b>!"},
 {tag:"№ 7 · Фильмы",type:"num",q:"А <b>10 фильмов</b>?",ans:10000,unit:"тг",
  help:["Сколько фильмов — столько раз по 1000. 10 · 1000 = ?"],ok:"10 · 1000 = 10 000 тг. Видишь правило? Количество фильмов × 1000."},
 {tag:"№ 7 · Фильмы",type:"info",html:`<div class="q">Заметил правило?</div><div class="say">1 фильм → 1 · 1000<br>2 фильма → 2 · 1000<br>3 фильма → 3 · 1000<br>10 фильмов → 10 · 1000</div><div class="say">Каждый раз: <b>число фильмов умножаем на 1000</b>. А если число фильмов неизвестно, его называют <b>x</b>.</div>`},
 {tag:"№ 7 · Фильмы",type:"choice",q:"Фильмов <b>x</b>. Какая формула даёт цену <b>y</b>?",opts:["y = x + 1000","y = 1000x","y = x : 1000","y = 1000"],r:1,
  why:["Проверь на 2 фильмах: x + 1000 = 2 + 1000 = 1002 тг. А должно быть 2000. Не подходит.",null,"Проверь на 2 фильмах: 2 : 1000 = 0,002 тг. Слишком дёшево! Не подходит.","Тогда любое количество фильмов стоило бы 1000 тг. А 2 фильма стоят 2000."],
  ok:"<b>y = 1000x</b> — это ответ на <b>№ 7a</b>. Как в теме: y = mx, а m = 1000 — цена одного фильма."},
 {tag:"№ 7 · Проверка",type:"num",q:"Проверим формулу. Подставь <b>x = 4</b> в y = 1000x.",extra:`<div class="formula">y = 1000 · 4</div>`,ans:4000,unit:"тг",
  help:["1000 · 4 = 1000 + 1000 + 1000 + 1000."],ok:"4000 тг — совпало с таблицей. Значит, формула верная."},
 {tag:"№ 8 · Круг",type:"circle"},
 {tag:"№ 8 · Круг",type:"choice",q:"Сколько раз диаметр уместился в длине окружности?",opts:["2 раза","Чуть больше 3 раз","Ровно 4 раза","10 раз"],r:1,
  why:["Вернись на шаг назад и посмотри ещё раз: зелёных кусочков больше двух.",null,"Посмотри ещё раз: четвёртый кусочек не помещается полностью.","Нет, намного меньше. Вернись и посмотри картинку."],
  ok:"Чуть больше 3 раз — а точнее <b>3,14 раза</b>. Это число называют <b>π</b> («пи»). У любого круга, большого и маленького, одно и то же."},
 {tag:"№ 8 · Круг",type:"info",html:`<div class="q">Формула из учебника</div><div class="formula">C = π · d</div><div class="say"><b>C</b> — длина окружности (circumference), <b>d</b> — диаметр (diameter), <b>π ≈ 3,14</b>.</div><div class="say">Это та же формула, что у фильмов! Сравни:</div><div class="formula" style="font-size:19px">y = 1000 · x<br>C = 3,14 · d</div><div class="say">У фильмов на 1000 умножаем, у круга — на 3,14.</div>`},
 {tag:"№ 8 · Круг",type:"choice",q:"У фильмов число 1000 — это constant of proportionality (коэффициент m). А какое оно в формуле <b>C = π · d</b>?",opts:["d — диаметр","C — длина окружности","π ≈ 3,14","157"],r:2,
  why:["d меняется: у каждого круга свой диаметр. А коэффициент всегда одинаковый.","C тоже меняется от круга к кругу. Ищи число, которое не меняется.",null,"157 — это из следующего вопроса, к формуле оно не относится."],
  ok:"Коэффициент — <b>π ≈ 3,14</b>. Это ответ на <b>№ 8a</b>."},
 {tag:"№ 8 · Разминка",type:"num",q:"Диаметр круга <b>10 см</b>. Какая длина окружности?",extra:`<div class="formula">C = 3,14 · 10</div>`,ans:31.4,unit:"см",
  help:["Умножить на 10 — значит сдвинуть запятую на один знак вправо: 3,14 → 31,4."],ok:"C = 31,4 см. Знаем диаметр — <b>умножаем</b> на 3,14."},
 {tag:"№ 8 · Разминка",type:"num",q:"Теперь наоборот: длина окружности <b>31,4 см</b>. Какой диаметр?",extra:`<div class="formula">31,4 = 3,14 · d</div>`,ans:10,unit:"см",
  help:["Только что было: 3,14 · 10 = 31,4. Значит d = ?","Чтобы найти d, дели: 31,4 : 3,14."],ok:"d = 10 см. Знаем длину окружности — <b>делим</b> на 3,14."},
 {tag:"№ 8 · Домашка",type:"num",q:"Длина окружности <b>157 см</b>. Какой диаметр? (№ 8b)",extra:`<div class="formula">157 = 3,14 · d</div>`,ans:50,unit:"см",
  help:["Как в прошлом шаге: d = 157 : 3,14.","Чтобы делить было проще, убери запятые: 15700 : 314. Попробуй 314 · 50 — сколько будет?"],ok:"d = 157 : 3,14 = 50 см. Округлить до десятых: <b>50,0 см</b>. Проверка: 3,14 · 50 = 157 ✓"},
 {tag:"Сам, без подсказок",type:"num",q:"Ручка стоит <b>150 тг</b>. Сколько стоят <b>6 ручек</b>?",ans:900,unit:"тг",help:["6 · 150 = ?"],ok:"6 · 150 = 900 тг. Формула: y = 150x."},
 {tag:"Сам, без подсказок",type:"num",q:"Длина окружности <b>62,8 см</b>. Какой диаметр?",ans:20,unit:"см",help:["Знаем длину окружности — делим на 3,14."],ok:"62,8 : 3,14 = 20 см."},
 {tag:"Готово",type:"final"}
];

/* ---------- состояние ---------- */
const KEY="p143-arsen-v2";let S={i:0,done:{}};
try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&typeof v.i==="number")S=v}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const card=document.getElementById("card"),nextB=document.getElementById("next"),backB=document.getElementById("back");
const fmt=n=>String(Math.round(n*1000)/1000).replace(".",",");

function dots(){document.getElementById("dots").innerHTML=STEPS.map((_,k)=>`<i class="${k<S.i||S.done[k]?"done":""} ${k===S.i?"now":""}"></i>`).join("");
  document.getElementById("cnt").textContent=`шаг ${S.i+1} из ${STEPS.length}`}

function show(){const st=STEPS[S.i];dots();backB.disabled=S.i===0;nextB.textContent=S.i===STEPS.length-1?"Сначала":"Дальше →";
  const canGo=st.type==="info"||st.type==="final"||S.done[S.i];nextB.disabled=!canGo;
  let h=`<div class="tag">${st.tag}</div>`;
  if(st.type==="info"){card.innerHTML=h+st.html;S.done[S.i]=1;save();nextB.disabled=false;return}
  if(st.type==="final")return final(h);
  if(st.type==="circle")return circle(h);
  h+=`<div class="q">${st.q}</div>${st.extra||""}`;
  if(st.type==="num"){
    h+=`<div class="answer" id="ans"><span class="ph">введи число</span></div><div class="pad" id="pad"></div><div id="fb"></div>`;card.innerHTML=h;
    let val="",tries=0;const ans=document.getElementById("ans"),fb=document.getElementById("fb");
    const paint=()=>{ans.className="answer";ans.innerHTML=val?`<span class="cur">${val}</span>${st.unit?`<span class="ph">${st.unit}</span>`:""}`:`<span class="ph">введи число</span>`};
    if(S.done[S.i]){val=fmt(st.ans);paint();ans.classList.add("good");fb.innerHTML=`<div class="fb ok"><b>Верно!</b> ${st.ok}</div>`}
    const keys=["7","8","9","⌫","4","5","6",",","1","2","3","0"];const pad=document.getElementById("pad");
    keys.forEach(k=>{const b=document.createElement("button");b.type="button";b.textContent=k;if(k==="⌫"){b.className="del";b.setAttribute("aria-label","Стереть")}
      b.onclick=()=>{if(S.done[S.i])return;if(k==="⌫")val=val.slice(0,-1);else if(k===","){if(!val.includes(","))val+=(val?",":"0,")}else if(val.length<8)val=val==="0"?k:val+k;paint();fb.innerHTML=""};pad.appendChild(b)});
    const ok=document.createElement("button");ok.type="button";ok.className="ok";ok.textContent="Проверить";ok.style.gridColumn="span 4";pad.appendChild(ok);
    ok.onclick=()=>{if(S.done[S.i])return;if(!val){fb.innerHTML=`<div class="fb no">Сначала набери число.</div>`;return}
      const v=parseFloat(val.replace(",","."));
      if(Math.abs(v-st.ans)<1e-9){ans.classList.add("good");S.done[S.i]=1;save();fb.innerHTML=`<div class="fb ok"><b>Верно!</b> ${st.ok}</div>`;nextB.disabled=false;dots();return}
      tries++;ans.classList.add("bad");
      let m=`<div class="fb no">Пока не так. Попробуй ещё.</div>`;
      const hi=st.help[Math.min(tries,st.help.length)-1];if(hi)m+=`<div class="fb help">💡 ${hi}</div>`;
      if(tries>=3)m+=`<div class="fb help">Ответ: <b>${fmt(st.ans)} ${st.unit||""}</b>. Набери его и нажми «Проверить», чтобы идти дальше.</div>`;
      fb.innerHTML=m};
    return}
  if(st.type==="choice"){h+=`<div class="opts" id="opts"></div><div id="fb"></div>`;card.innerHTML=h;const o=document.getElementById("opts"),fb=document.getElementById("fb");
    st.opts.forEach((t,j)=>{const b=document.createElement("button");b.type="button";b.textContent=t;if(S.done[S.i]&&j===st.r)b.classList.add("right");
      b.onclick=()=>{if(S.done[S.i])return;if(j===st.r){b.classList.add("right");S.done[S.i]=1;save();fb.innerHTML=`<div class="fb ok"><b>Верно!</b> ${st.ok}</div>`;nextB.disabled=false;dots()}
        else{b.classList.add("wrong");fb.innerHTML=`<div class="fb no">${st.why[j]}</div>`}};o.appendChild(b)});
    if(S.done[S.i])fb.innerHTML=`<div class="fb ok"><b>Верно!</b> ${st.ok}</div>`}
}

/* ---------- раскатываем окружность ---------- */
function circle(h){
  card.innerHTML=h+`<div class="q">Что такое длина окружности?</div><div class="say">Представь: обматываем круглую банку ниткой (<span style="color:var(--ring);font-weight:700">красная</span>), а потом разворачиваем нитку в прямую линию. Сравним её с диаметром (<span style="color:var(--dia);font-weight:700">зелёный</span> — линия через центр).</div>
  <svg class="circ" id="cv" viewBox="0 0 340 228" role="img" aria-label="Окружность раскатывается в прямую, по ней откладываются диаметры"></svg>
  <button type="button" class="btn main" id="roll">Раскатать нитку</button><div id="fb"></div>`;
  const svg=document.getElementById("cv"),D=90,cx=60,cy=70,r=D/2,baseY=180,x0=15;
  function frame(t){ // t 0..1
    const L=Math.PI*D*t;let s="";
    s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--sun-soft)" stroke="var(--line)" stroke-width="1"/>`;
    // оставшаяся часть окружности
    const ang=2*Math.PI*(1-t);if(t<1){const a0=Math.PI/2,a1=a0+ang;const large=ang>Math.PI?1:0;
      s+=`<path d="M${cx+r*Math.cos(a0)},${cy+r*Math.sin(a0)} A${r},${r} 0 ${large} 1 ${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)}" fill="none" stroke="var(--ring)" stroke-width="4"/>`}
    s+=`<line x1="${cx-r}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="var(--dia)" stroke-width="3"/><text x="${cx-10}" y="${cy-6}" fill="var(--dia)">d</text>`;
    s+=`<line x1="${x0}" y1="${baseY}" x2="${x0+L*1.0}" y2="${baseY}" stroke="var(--ring)" stroke-width="4" stroke-linecap="round"/>`;
    if(t>=1){for(let k=0;k<4;k++){const a=x0+k*D,b=Math.min(x0+(k+1)*D,x0+Math.PI*D);if(a>=x0+Math.PI*D)break;const full=b-a>=D-0.5;
        s+=`<line x1="${a+2}" y1="${baseY+14}" x2="${b-2}" y2="${baseY+14}" stroke="var(--dia)" stroke-width="5" stroke-linecap="round"/>`;
        s+=`<text x="${(a+b)/2-(full?14:20)}" y="${baseY-12}" fill="var(--ink)">${full?`${k+1}-й d`:"чуть-чуть"}</text>`}}
    s+=`<text x="${x0}" y="${baseY+36}" fill="var(--muted)" style="font-weight:500">${t>=1?"Диаметр уместился 3 раза и ещё чуть-чуть":""}</text>`;
    svg.innerHTML=s}
  frame(S.done[S.i]?1:0);const fb=document.getElementById("fb");
  if(S.done[S.i]){fb.innerHTML=`<div class="fb ok">Посмотрел — жми «Дальше».</div>`;nextB.disabled=false}
  document.getElementById("roll").onclick=()=>{const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;const t0=performance.now(),dur=reduce?1:1800;
    (function step(now){const t=Math.min(1,(now-t0)/dur);frame(t);if(t<1)requestAnimationFrame(step);else{S.done[S.i]=1;save();nextB.disabled=false;dots();fb.innerHTML=`<div class="fb ok">Посчитай зелёные кусочки и жми «Дальше».</div>`}})(t0)};
}

/* ---------- итог ---------- */
function final(h){card.innerHTML=h+`<div class="q">Молодец! Теперь запиши в тетрадь</div>
  <div class="hw">
   <p><span class="n">№ 7</span></p>
   <p>a) 1 фильм стоит 1000 тг, значит <b>y = 1000x</b></p>
   <p>b) x = 3: y = 1000 · 3 = <b>3000 тг</b></p>
   <p style="margin-top:10px"><span class="n">№ 8</span></p>
   <p>a) C = π · d, коэффициент <b>π ≈ 3,14</b></p>
   <p>b) 157 = 3,14 · d<br>d = 157 : 3,14 = <b>50,0 см</b></p>
  </div>
  <div class="say">Главное из урока: <b>y = mx</b> — это «одна штука стоит m, значит x штук стоят m · x». Знаешь x — умножай на m. Знаешь y — дели на m.</div>`;
  S.done[S.i]=1;save();nextB.disabled=false}

nextB.onclick=()=>{if(S.i===STEPS.length-1){S={i:0,done:{}};save();show();window.scrollTo(0,0);return}S.i++;save();show();window.scrollTo(0,0)};
backB.onclick=()=>{if(S.i>0){S.i--;save();show();window.scrollTo(0,0)}};
show();
</script>
</body>

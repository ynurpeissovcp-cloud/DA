*{box-sizing:border-box}
body{background:var(--bg) var(--topo) repeat;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
.top{display:flex;flex-direction:column;gap:10px;padding-block:8px 18px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--relief)}
.top h1{font-size:clamp(30px,8vw,44px);text-transform:uppercase}
.top p{margin:0;color:var(--muted);max-width:52ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:20px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* mode buttons */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:8px 22px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.mode.primary{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode strong{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.02em}
.mode small{font-size:13px;opacity:.85;line-height:1.35}
.mode:disabled{opacity:.5;cursor:default}

.sec-title{display:flex;align-items:baseline;gap:10px;margin-block:22px 10px}
.sec-title h2{font-size:22px;text-transform:uppercase}
.sec-title .mono{font-size:12px;color:var(--muted)}

/* topic route */
.route{display:flex;flex-direction:column;gap:10px;position:relative}
.topic{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.pin{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:-.03em;border:2px solid var(--c);color:var(--c);background:var(--cs)}
.pin.done{background:var(--c);color:var(--surface)}
.topic h3{font-size:18px;font-weight:500}
.topic .meta{font-size:13px;color:var(--muted);margin-top:2px}
.topic .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px}
.chip.fill{background:var(--c);border-color:var(--c);color:var(--surface);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c)}
.s1{--c:var(--s1);--cs:var(--s1s)} .s2{--c:var(--s2);--cs:var(--s2s)} .s3{--c:var(--s3);--cs:var(--s3s)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.back{background:none;border:none;padding:6px 0;color:var(--accent);font-weight:600;font-size:15px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}

/* quiz */
.qtop{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);align-items:center}
.qtop .mono{white-space:nowrap}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);background:var(--cs);border-radius:6px;padding:3px 8px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-block:10px 16px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font-size:19px;font-weight:600;line-height:1.4;margin-block:6px 6px}
.hint{font-size:13px;color:var(--muted);margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px;line-height:1.35}
.opt .box{flex:0 0 22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:-1px}
.opt.round .box{border-radius:50%}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.order-built{display:flex;flex-direction:column;gap:6px;min-height:52px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:10px}
.order-built .empty{color:var(--muted);font-size:14px;padding:6px}
.oitem{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:8px;padding:9px 12px;text-align:left;font-size:15px}
.oitem .n{font-family:var(--mono);font-weight:700;color:var(--accent)}
.oitem.right{background:var(--ok-bg);border-color:var(--ok)} .oitem.right .n{color:var(--ok)}
.oitem.wrong{background:var(--bad-bg);border-color:var(--bad)} .oitem.wrong .n{color:var(--bad)}
.match{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.mrow label{font-weight:600;font-size:15px}
.mrow select{width:100%;font:inherit;font-size:15px;padding:9px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.mrow.right{border-color:var(--ok);background:var(--ok-bg)} .mrow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mrow .fix{font-size:14px;color:var(--ok);font-weight:600}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:none;border-radius:10px;padding:13px 18px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb b.v{display:block;font-family:var(--display);font-size:18px;font-weight:600;margin-bottom:4px}
.fb.ok b.v{color:var(--ok)} .fb.no b.v{color:var(--bad)}
.fb .pg{font-family:var(--mono);font-size:12px;color:var(--muted);display:block;margin-top:6px}

/* cheat sheet */
.cheat h2{font-size:26px;text-transform:uppercase}
.cheat h3{font-size:18px;margin-block:20px 8px;color:var(--c);text-transform:uppercase;letter-spacing:.03em}
.cheat p,.cheat li{font-size:16px}
.cheat ul{padding-left:20px;margin:6px 0;display:flex;flex-direction:column;gap:6px}
.cheat b{color:var(--c)}
.remember{border-left:4px solid var(--c);background:var(--cs);border-radius:0 10px 10px 0;padding:10px 14px;margin-block:12px}
.remember::before{content:"Запомни";display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.tbl{overflow-x:auto;margin-block:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--cs);font-weight:600}

/* results */
.score{font-family:var(--display);font-size:56px;font-weight:700;line-height:1;color:var(--accent)}
.verdict{font-size:18px;font-weight:600;margin-top:6px}
.mist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mist div{background:var(--bad-bg);border-radius:8px;padding:10px 12px;font-size:14px}
.mist div b{display:block;margin-bottom:2px}

/* open tasks */
.task{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px}
.task + .task{margin-top:10px}
.task .q{font-weight:600;font-size:16px}
.task .ans{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:15px}
.task .ans ul{padding-left:18px;margin:4px 0}
.task .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.task.known{border-color:var(--ok)}
.filter{display:flex;flex-wrap:wrap;gap:8px;margin-block:10px 14px}
.filter .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
.foot{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:380px){.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:17px}.modes{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

{t:1,k:"match",q:"Кто что изучает? Соедини специалиста и предмет изучения.",m:[["Геоморфолог","рельеф"],["Климатолог","климат"],["Гидролог","воды (реки, озёра)"],["Почвовед","почвы"]],ex:"В тексте прямо сказано: геоморфологи изучают рельеф. Остальные понятны по корню слова.",p:7},
{t:1,k:"one",q:"Второй путь изучения природы в физической географии основан на…",o:["всестороннем анализе природных комплексов (сочетаний компонентов)","детальном изучении каждого компонента отдельно","изучении только карт","изучении населения"],a:0,ex:"Первый путь — каждый компонент природы отдельно (климат, рельеф, почвы…). Второй — природные комплексы, то есть сочетания компонентов. Оба пути дополняют друг друга.",p:7},
{t:1,k:"one",q:"Два одинаковых завода построены по одному проекту в разных регионах, но работают по-разному. Как это объясняет географ?",o:["Различным географическим положением","Разным количеством рабочих","Разным цветом зданий","Это невозможно объяснить"],a:0,ex:"Для географа ответ ясен: в первую очередь из-за различного географического положения.",p:7},
{t:1,k:"multi",q:"Что является объектами изучения географии? Выбери все верные.",o:["Природа","Население","Хозяйство","Политическое развитие мира","Химические реакции в пробирке"],a:[0,1,2,3],ex:"Объекты географии: природа, население, хозяйство, политическое развитие мира, отношения человека и природы.",p:3},
{t:1,k:"one",q:"Сколько разделов в учебнике географии 7 класса?",o:["6","4","8","10"],a:0,ex:"Шесть разделов: методы исследований, картография, физическая, социальная, экономическая география и страноведение.",p:3},

/* ---------- 2. Путешественники ---------- */
{t:2,k:"one",q:"На чём первобытные люди рисовали первые схемы местности?",o:["На скалах, сводах пещер, коре деревьев, шкурах","На бумаге","На глиняных глобусах","На ткани"],a:0,ex:"Эти простые схемы (реки, дороги, места охоты) были прообразами современных карт.",p:9},
{t:2,k:"match",q:"Соедини древний народ и его достижение.",m:[["Египтяне","солнечный календарь"],["Китайцы","предсказание солнечных затмений"],["Индийцы","числовая нумерация"]],ex:"Знания древних народов появлялись при поиске плодородных земель, в походах и торговле.",p:9},
{t:2,k:"match",q:"Соедини учёного античности и его вклад.",m:[["Анаксимандр","первая карта с масштабом"],["Аристотель","доказательства шарообразности Земли"],["Эратосфен","точное измерение Земли и термин «география»"],["Птолемей","труд «География», по нему составили карту мира"]],ex:"Фалес первым объяснял форму Земли научно, его ученик Анаксимандр сделал первую карту с масштабом.",p:9},
{t:2,k:"one",q:"Махмуд Кашгари известен тем, что…",o:["создал круглую карту мира и словарь «Диван Лугат ат-Турк»","первым обогнул Землю","открыл Америку","написал «Хождение за три моря»"],a:0,ex:"Махмуд Кашгари — тюркский учёный. На его круглой карте — древние тюркские города, и он составил первый энциклопедический словарь тюркского языка.",p:"9–10"},
{t:2,k:"one",q:"Кто первым из европейцев в конце XIII века совершил долгое путешествие на Восток и много лет жил в Китае?",o:["Марко Поло","Афанасий Никитин","Христофор Колумб","Фернан Магеллан"],a:0,ex:"Свои впечатления Марко Поло описал в «Книге о разнообразии мира».",p:10},
{t:2,k:"one",q:"«Хождение за три моря» — путевые заметки о путешествии в…",o:["Индию","Китай","Америку","Африку"],a:0,ex:"Афанасий Никитин, купец из Твери, в XV веке пробыл в Индии около трёх лет.",p:10},
{t:2,k:"one",q:"Эпоха Великих географических открытий — это…",o:["XV–XVII века","XI–XIII века","XVIII–XIX века","I–III века"],a:0,ex:"Ни в один другой период не сделали столько открытий, важных для всего мира.",p:10},
{t:2,k:"one",q:"Что искал Колумб, когда в 1492 году отплыл на запад?",o:["Западный морской путь в Индию","Новый материк Америку","Путь в Антарктиду","Северный полюс"],a:0,ex:"Колумб открыл Новый Свет, но до конца жизни был уверен, что достиг берегов Индии.",p:"10–11"},
{t:2,k:"one",q:"Кто первым предположил, что земли, открытые Колумбом, — это новый материк?",o:["Америго Веспуччи","Марко Поло","Магеллан","Птолемей"],a:0,ex:"Поэтому в 1507 году новую часть света предложили назвать Америкой.",p:11},
{t:2,k:"multi",q:"Что доказало первое кругосветное плавание Магеллана (1519–1522)? Выбери все верные.",o:["Земля имеет форму шара","Существует единый Мировой океан","Существует Тихий океан, отделяющий Америку от Азии","Земля плоская","Антарктида — материк"],a:[0,1,2],ex:"Экспедиция ушла на запад, а вернулась с востока — значит, Земля шар. Из 5 кораблей вернулся 1, из 265 человек — 18. Магеллан погиб в пути.",p:11},
{t:2,k:"one",q:"Сколько человек вернулось из экспедиции Магеллана (вышло 265)?",o:["18","65","120","5"],a:0,ex:"Вернулся лишь один корабль из пяти и только 18 человек.",p:11},
{t:2,k:"order",q:"Расставь путешествия по времени (от раннего к позднему).",o:["Марко Поло (конец XIII в.)","Афанасий Никитин (XV в.)","Первое плавание Колумба (1492)","Кругосветка Магеллана (1519–1522)"],ex:"XIII век → XV век → 1492 → 1519.",p:"10–11"},
{t:2,k:"one",q:"Какой арабский путешественник в X веке побывал на территории западного Казахстана?",o:["Ахмад ибн Фадлан","Ибн Баттута","Бируни","Идриси"],a:0,ex:"Он собрал сведения о рельефе и климате этого края.",p:11},
{t:2,k:"one",q:"Кто написал «Сборник летописей» с информацией о городах, реках, горах и границах Казахстана?",o:["Кадыргали Жалаири","Махмуд Кашгари","Шокан Уалиханов","Страбон"],a:0,ex:"Историк Кадыргали Жалаири описал события в Казахстане и Средней Азии XIII–XV веков.",p:11},
{t:2,k:"multi",q:"Что сделал П. П. Семенов-Тян-Шанский? Выбери все верные.",o:["Первым из европейских учёных проник в Центральный Тянь-Шань","Описал и нанёс на карту пик Хан Тенгри","Доказал, что в Тянь-Шане нет действующих вулканов","Впервые установил вертикальную поясность растительности","Открыл лошадь Пржевальского"],a:[0,1,2,3],ex:"За этот подвиг он получил право называться «Тян-Шанским». Лошадь открыл Пржевальский.",p:12},
{t:2,k:"one",q:"Путешествие Шокана Уалиханова в Кашгар (Восточный Туркестан) современники считали…",o:["подлинным географическим открытием","неудачным","туристической поездкой","военным походом"],a:0,ex:"Экспедиция была рискованной: почти год, из них почти полгода в самом Кашгаре. Уалиханов знал местные языки и собрал сведения о природе, хозяйстве и быте.",p:12},
{t:2,k:"multi",q:"Что связано с Н. М. Пржевальским? Выбери все верные.",o:["Четыре экспедиции по Монголии, Китаю и Тибету","Дикая лошадь (керкулан, кертагы)","Двугорбый верблюд","Сбор гербариев и коллекций птиц","Открытие Америки"],a:[0,1,2,3],ex:"Пржевальский ликвидировал «белые пятна» на карте Внутренней Азии.",p:"12–13"},
{t:2,k:"one",q:"Какая организация объединила лучших учёных и путешественников (Семенов, Пржевальский, Уалиханов и др.)?",o:["Русское географическое общество","Академия наук Казахстана","Институт географии","ЮНЕСКО"],a:0,ex:"Большая часть открытий была сделана по заданию Русского географического общества.",p:12},
{t:2,k:"match",q:"Соедини исследователя и регион его главных исследований.",m:[["Семенов-Тян-Шанский","Центральный Тянь-Шань"],["Уалиханов","Кашгар (Восточный Туркестан)"],["Пржевальский","Монголия, Китай, Тибет"],["Афанасий Никитин","Индия"]],ex:"Частый вопрос на СОРе — «кто куда ходил».",p:"10–13"},

/* ---------- 3. Учёные Казахстана ---------- */
{t:3,k:"one",q:"Кто стал организатором и первым президентом Академии наук Казахстана?",o:["К. И. Сатпаев","Ш. Уалиханов","П. П. Семенов","А. С. Бейсенова"],a:0,ex:"Каныш Сатпаев — учёный-геолог, автор более 640 научных работ.",p:14},
{t:3,k:"one",q:"В каком году образована Академия наук Казахстана?",o:["1946","1921","1952","1963"],a:0,ex:"1946 — Академия наук; 1952 — Географическое общество Казахстана. Не перепутай!",p:14},
{t:3,k:"one",q:"В каком году было организовано Географическое общество Казахстана?",o:["1952","1946","1887","1991"],a:0,ex:"В него вошли ведущие географы вузов и научных учреждений.",p:15},
{t:3,k:"one",q:"Зачем в годы войны было важно Жездинское месторождение марганцевых руд, разработанное под руководством Сатпаева?",o:["Для выпуска броневой стали","Для производства соли","Для строительства плотин","Для удобрений"],a:0,ex:"Марганец нужен для броневой стали — это помогло в военные годы.",p:14},
{t:3,k:"one",q:"Что такое сель?",o:["Мощный грязекаменный поток, стекающий с гор после ливней","Подземный толчок","Снежная лавина","Сильный ветер в пустыне"],a:0,ex:"Сели — одна из самых актуальных проблем для Казахстана, особенно для Алматы.",p:14},
{t:3,k:"match",q:"Соедини год и событие, связанное с селями.",m:[["1921","сель обрушился на Алматы по реке Киши Алматы"],["1963","сель от обвала морены прошёл по долине реки Есик"]],ex:"Катастрофа 1921 года стала толчком к изучению селей. Сель 1963 года разрушил плотину озера Есик.",p:"14–15"},
{t:3,k:"one",q:"Чем прославилась селезащитная плотина «Медеу»?",o:["Размерами и способом сооружения — направленными взрывами","Тем, что это ГЭС","Тем, что она самая старая в мире","Тем, что сделана из льда"],a:0,ex:"Комплекс противоселевой защиты на реке Киши Алматы — первый положительный пример борьбы с селями в нашей стране и в мире.",p:15},
{t:3,k:"multi",q:"Какие неблагоприятные погодные явления изучали учёные Казахстана? Выбери все верные.",o:["Засухи","Суховеи","Пыльные бури","Град и гололёд","Цунами"],a:[0,1,2,3],ex:"Борьба с засухами и дефицитом воды была очень важна для хозяйства республики. Цунами в Казахстане не бывает — у нас нет океана.",p:15},
{t:3,k:"one",q:"Под руководством какой организации сейчас развивается географическая наука Казахстана?",o:["Института географии и водной безопасности","Русского географического общества","Министерства спорта","Института истории"],a:0,ex:"Также исследования ведут кафедры географии крупных вузов.",p:15},
{t:3,k:"one",q:"Кто написал «Климатический очерк Казахстана» (первая попытка климатического районирования)?",o:["М. Д. Пономарев и В. Н. Барсук","К. И. Сатпаев","Н. М. Пржевальский","С. С. Неуструев"],a:0,ex:"Неуструев руководил почвенными экспедициями, а климатом занимались Пономарев и Барсук.",p:14},
{t:3,k:"multi",q:"Какие озёра Казахстана особенно изучали учёные? Выбери все из учебника.",o:["Аральское","Балкаш","Алаколь","Сасыкколь","Байкал"],a:[0,1,2,3],ex:"Байкал находится в России. В учебнике: Аральское, Балкаш, Алаколь, Кошкараколь, Сасыкколь.",p:15},

/* ---------- 4. Источники ---------- */
{t:4,k:"one",q:"Какие источники названы основополагающими картографическими источниками информации?",o:["Карты и географические атласы","Открытки и марки","Прогнозы погоды","Журналы"],a:0,ex:"Карты и атласы содержат накопленные человечеством знания о природе и обществе.",p:16},
{t:4,k:"multi",q:"Что относится к графическим материалам (иллюстрациям)? Выбери все.",o:["Рисунки","Фотографии","Схемы и графики","Диаграммы и инфографика","Энциклопедии"],a:[0,1,2,3],ex:"Энциклопедии — это текстовые источники (как справочники и словари).",p:16},
{t:4,k:"one",q:"Крупнейшее картографическое произведение независимого Казахстана — это…",o:["трёхтомный Национальный атлас Республики Казахстан","«Атлас географии Казахстана»","контурная карта","глобус Казахстана"],a:0,ex:"Национальный атлас издан в 2010 году на казахском, русском и английском языках под руководством Института географии.",p:"16–17"},
{t:4,k:"one",q:"Главный учебный атлас «Атлас географии Казахстана» (2013) создан под руководством…",o:["академика А. С. Бейсеновой","К. И. Сатпаева","Ш. Уалиханова","П. П. Семенова"],a:0,ex:"Он тоже вышел на трёх языках.",p:17},
{t:4,k:"one",q:"Какие снимки нужны для прогноза погоды, а какие для изучения почв?",o:["Для погоды — более мелкого масштаба, для почв — более крупного","Для погоды — крупного, для почв — мелкого","Одинаковые","Для погоды снимки не нужны"],a:0,ex:"Погода охватывает огромные территории — нужен мелкий масштаб. Почвы изучают детально — нужен крупный.",p:17},
{t:4,k:"multi",q:"Где используют космические снимки? Выбери все верные.",o:["Разведка полезных ископаемых","Прогнозы погоды","Наблюдение за пыльными бурями и пожарами","Изучение почв и растительности"],a:[0,1,2,3],ex:"Все варианты верны — космические снимки охватывают огромные территории и дают объективную информацию.",p:17},
{t:4,k:"one",q:"Аэро- и космические фотоснимки — это…",o:["снимки земной поверхности с летательных и космических аппаратов","рисунки художников","фотографии людей","карты в атласе"],a:0,ex:"На них Земля изображена так, как её видно сверху.",p:17},
{t:4,k:"one",q:"Где систематизируется и хранится географическая информация по разным территориям?",o:["В компьютерных базах данных","Только в учебниках","В музеях","В газетах"],a:0,ex:"Это подводка к §10 — географические базы данных.",p:17},
{t:4,k:"one",q:"Какие карты используют при планировании экспедиций?",o:["Детальные топографические карты","Политические карты мира","Контурные карты","Карты звёздного неба"],a:0,ex:"«По картам планируются все экспедиции — для этого используются детальные топографические карты».",p:16},

/* ---------- 5. Опыты, наблюдения, графики ---------- */
{t:5,k:"one",q:"Опыт с парафином: на стекле след от иглы круглый, на горном хрустале — эллипс. Какой вывод?",o:["В аморфных веществах тепло распространяется медленнее, в кристаллических — быстрее","В стекле тепло идёт быстрее","Парафин не плавится","Хрусталь не проводит тепло"],a:0,ex:"Стекло — аморфное вещество, горный хрусталь — кристаллическое.",p:19},
{t:5,k:"one",q:"Способность кристаллов самим принимать форму многогранника называется…",o:["самоогранение","водопроницаемость","выветривание","кристаллизация воды"],a:0,ex:"Можно вырастить кристаллы дома из раствора медного купороса или квасцов.",p:19},
{t:5,k:"order",q:"Опыт «Водопроницаемость горных пород». Расставь породы от той, через которую вода пройдёт БЫСТРЕЕ всего, к самой медленной.",o:["Крупный песок","Мелкий песок","Суглинок","Глина"],ex:"Чем крупнее частицы, тем больше промежутков между ними и тем быстрее проходит вода. Глина почти не пропускает воду, а суглинок — смесь глины и песка.",p:19},
{t:5,k:"one",q:"Опыт с вентилятором и ящиком с песком показывает…",o:["как ветер создаёт микроформы рельефа","как образуются вулканы","как течёт река","как растут кристаллы"],a:0,ex:"Это опыт 3 «Ветер и его деятельность».",p:20},
{t:5,k:"one",q:"Куда устанавливают уличный термометр?",o:["За окно, обращённое на север","За окно, обращённое на юг","На крышу","В комнату"],a:0,ex:"На северной стороне нет прямых солнечных лучей, поэтому термометр показывает настоящую температуру воздуха.",p:20},
{t:5,k:"match",q:"Соедини прибор и то, что он измеряет.",m:[["Термометр","температуру воздуха"],["Барометр","атмосферное давление"],["Гигрометр","влажность воздуха"],["Анемометр","скорость ветра"],["Альтиметр (высотомер)","высоту местности"],["Флюгер","направление ветра"]],ex:"Приложение «Барометр» в смартфоне объединяет термометр, барометр, гигрометр, анемометр и альтиметр.",p:"20, 23"},
{t:5,k:"one",q:"Какое атмосферное давление считается нормальным?",o:["1013 гПа (760 мм рт. ст.)","1000 гПа (700 мм рт. ст.)","760 гПа","1030 гПа"],a:0,ex:"Запомни пару: 1013 гПа = 760 мм ртутного столба.",p:24},
{t:5,k:"one",q:"Зачем температуру в «Дневнике погоды» записывают 3 раза в день?",o:["Чтобы найти среднесуточную температуру и по ней тип погоды","Потому что термометр часто ломается","Чтобы найти давление","Так просто принято"],a:0,ex:"Утром, после школы и перед сном. Остальные данные — 1 раз в сутки (в 14–15 часов).",p:24},
{t:5,k:"one",q:"Утром +12°C, днём +22°C, вечером +17°C. Средняя +17°C. Какой это тип погоды?",o:["Тёплая (+16…+22°C)","Жаркая (+23…+28°C)","Умеренно тёплая (+8…+15°C)","Прохладная (+4…+8°C)"],a:0,ex:"(12 + 22 + 17) : 3 = 17. По таблице 2: от +16 до +22 °C — тёплая погода.",p:24},
{t:5,k:"one",q:"Утром −5°C, днём −4°C, вечером −9°C. Какой тип погоды?",o:["Умеренно морозная (−4…−12°C)","Слабо морозная (−1…−3°C)","Значительно морозная (−13…−22°C)","Оттепель"],a:0,ex:"(−5 − 4 − 9) : 3 = −6. От −4 до −12 °C — умеренно морозная.",p:24},
{t:5,k:"multi",q:"К полевым методам исследований относятся… Выбери все.",o:["Стационарные исследования","Экспедиционные исследования","Экскурсии","Чтение учебника"],a:[0,1,2],ex:"Стационар — исследования на одном месте. Экспедиция — с выездом. Экскурсия — для учащихся.",p:21},
{t:5,k:"multi",q:"Назови четыре основных метода полевых исследований.",o:["Наблюдение","Эксперимент","Описание","Измерение","Пересказ"],a:[0,1,2,3],ex:"Частый вопрос: «наблюдение, эксперимент, описание, измерение».",p:21},
{t:5,k:"one",q:"Где почти 70 лет казахстанские географы наблюдают за ледниками?",o:["На стационаре «Ледник Туйыксу» в Илейском Алатау","На Байконуре","На озере Балкаш","В пустыне Кызылкум"],a:0,ex:"Также они следят за лавиноопасными районами и опасными высокогорными озёрами (там бывают сели).",p:22},
{t:5,k:"match",q:"Соедини прибор и его применение.",m:[["Теодолит и нивелир","топографическая съёмка местности"],["Лазерный сканер","3D-модели удалённых объектов (ледники, оползни)"],["Барометр","измерение давления"]],ex:"Лазерный сканер изучает объекты за несколько километров.",p:22},
{t:5,k:"one",q:"Экскурсия — это…",o:["кратковременное нахождение группы учащихся на природе для изучения объектов","многолетние наблюдения на одном месте","научная экспедиция на несколько лет","опыт в лаборатории"],a:0,ex:"Экскурсии бывают на метеостанции, заводы, заповедники и т. д.",p:"22–23"},
{t:5,k:"match",q:"Разложи по группам: это элемент погоды (постоянная характеристика воздуха) или погодное явление (появляется и исчезает)?",m:[["Температура","элемент погоды"],["Давление","элемент погоды"],["Влажность","элемент погоды"],["Гроза","погодное явление"],["Облака","погодное явление"],["Осадки","погодное явление"]],ex:"Элементы погоды есть всегда: температура, давление, влажность. Явления появляются и исчезают: ветер, облака, осадки, гроза.",p:23},
{t:5,k:"match",q:"Соедини графическое изображение и его определение.",m:[["Схема","упрощённое изображение объекта или процесса"],["Диаграмма","фигура по цифровым данным, показывает соотношение величин"],["Профиль","вертикальный разрез участка поверхности"],["График","линия, показывает зависимость или изменение во времени"]],ex:"Это главный материал §7 — на СОРе почти всегда спрашивают определения.",p:"25–26"},
{t:5,k:"match",q:"Что это за графическое изображение?",m:[["Круговая диаграмма состава земной коры","диаграмма"],["Разрез речной долины","профиль"],["«Классификация равнин»","схема"],["Кривая изменения температуры за месяц","график"]],ex:"Профиль = разрез, график = линия, диаграмма = фигура по цифрам, схема = упрощённый рисунок.",p:"25–26"},
{t:5,k:"match",q:"Классификация равнин по высоте. Соедини.",m:[["Низменность","до 200 м"],["Возвышенность","200–500 м"],["Плоскогорье","более 500 м"]],ex:"Это схема на рис. 17а.",p:26},
{t:5,k:"one",q:"Наскальные рисунки в урочище Тамгалы — это пример…",o:["древних графических рисунков (петроглифов)","современной карты","космического снимка","диаграммы"],a:0,ex:"Слово «графика» — от греч. «графикос», «письменный».",p:25},

/* ---------- 6. Карты ---------- */
{t:6,k:"multi",q:"Какие виды изображения земной поверхности показаны на рис. 18? Выбери все.",o:["План местности","Географическая карта","Аэрофотоснимок","Космический снимок","Глобус Луны"],a:[0,1,2,3],ex:"Четыре вида: план, карта, аэрофотоснимок, космический снимок.",p:"29–30"},
{t:6,k:"one",q:"Горизонтали на плане местности — это линии, которые соединяют точки…",o:["с одинаковой высотой над уровнем моря","с одинаковой температурой","одного меридиана","с одинаковым давлением"],a:0,ex:"Горизонталями показывают рельеф (неровности поверхности).",p:30},
{t:6,k:"one",q:"Чем географическая карта отличается от плана местности?",o:["Показывает большие территории в мелком масштабе","Показывает маленький участок в крупном масштабе","На ней нет условных знаков","На ней нет масштаба"],a:0,ex:"На карте 1 см — десятки и сотни км. План — крупный масштаб, маленький участок.",p:30},
{t:6,k:"multi",q:"Какие бывают картографические проекции? Выбери все.",o:["Цилиндрические","Конические","Азимутальные","Квадратные"],a:[0,1,2],ex:"В любой проекции возникают искажения: формы, размеров, площадей.",p:30},
{t:6,k:"match",q:"Соедини проекцию и её особенность.",m:[["Цилиндрическая","меньше всего искажений у экватора, больше к полюсам"],["Коническая","самые большие искажения в приполярных районах"],["Азимутальная","плоскость касается глобуса; так делают карты Антарктиды"]],ex:"Глобус проецируют на цилиндр, конус или плоскость, а потом разворачивают.",p:"30–31"},
{t:6,k:"one",q:"Какая параллель самая длинная?",o:["Экватор","Северный полярный круг","Тропик","Все одинаковые"],a:0,ex:"Длина параллелей уменьшается от экватора к полюсам.",p:31},
{t:6,k:"match",q:"Соедини понятие и определение.",m:[["Меридианы","кратчайшие линии, соединяющие полюса"],["Параллели","линии, параллельные экватору (окружности)"],["Экватор","линия на одинаковом расстоянии от полюсов"],["Легенда карты","перечень всех условных знаков с пояснениями"]],ex:"На глобусе параллели — окружности, меридианы — полуокружности.",p:31},
{t:6,k:"one",q:"Картосхема — это…",o:["упрощённая обобщённая карта без градусной сетки и масштаба","очень подробная карта","космический снимок","карта со всеми проекциями"],a:0,ex:"Главное отличие от карты: нет градусной сетки и масштаба.",p:32},
{t:6,k:"match",q:"Классификация картосхем. Соедини признак и пример.",m:[["По охвату территории","мировые, материков, океанов, государств"],["По содержанию","общегеографические, тематические, комплексные"],["По назначению","учебные, справочные, туристские"]],ex:"Те же признаки, что и у обычных карт.",p:32},
{t:6,k:"order",q:"Расставь шаги составления картосхемы по порядку.",o:["Определить тему","Собрать информацию и ресурсы","Составить картосхему","Выбрать условные обозначения"],ex:"План из §8: тема → сбор информации → составление → условные знаки.",p:32},
{t:6,k:"one",q:"Географическая номенклатура — это…",o:["совокупность названий географических объектов","набор условных знаков","вид проекции","список учёных"],a:0,ex:"Номенклатура — это «язык географических имён».",p:33},
{t:6,k:"match",q:"Соедини: что значит…",m:[["Понимать карту","знать её свойства, виды, условные знаки"],["Читать карту","по условным знакам видеть размещение и связи явлений"],["Знать карту","по памяти представлять расположение и названия объектов"]],ex:"«Знать карту» достигается изучением номенклатуры.",p:34},
{t:6,k:"order",q:"Расставь шаги изучения географического названия по порядку.",o:["Прочитать название вслух несколько раз","Запомнить правильное написание","Найти объект на карте в атласе","Найти на картах другого масштаба и проекции","Проверить себя на контурной карте"],ex:"Неправильное написание или произношение названия — это географическая ошибка.",p:"34–35"},
{t:6,k:"multi",q:"Река Ертис (Иртыш). Выбери все верные утверждения.",o:["Исток — в горах Монгольского Алтая (Китай)","Общая длина — 4248 км","По Казахстану течёт 1700 км","Впадает в реку Обь","Впадает в озеро Балкаш"],a:[0,1,2,3],ex:"Пример из учебника, как описывать объект: исток, длина, куда впадает.",p:35},
{t:6,k:"match",q:"Номенклатура: что это за объект?",m:[["Гибралтар","пролив"],["Камчатка","полуостров"],["Гудзонов","залив"],["Челюскин","мыс"],["Иссык-Куль","озеро"],["Гренландия","остров"]],ex:"Списки объектов — на стр. 35–36. Покажи их в атласе.",p:"35–36"},
{t:6,k:"match",q:"Вулкан действующий или потухший?",m:[["Ключевская Сопка","действующий"],["Этна","действующий"],["Везувий","действующий"],["Эльбрус","потухший"],["Казбек","потухший"]],ex:"В списке учебника потухшие — только Эльбрус и Казбек.",p:36},
{t:6,k:"one",q:"Какое озеро названо самым глубоким из высокогорных?",o:["Иссык-Куль","Байкал","Балкаш","Маркаколь"],a:0,ex:"А Флорида в переводе — «цветущая».",p:35},
{t:6,k:"one",q:"ГИС (геоинформационная система) — это система, которая…",o:["собирает, хранит, обрабатывает, анализирует и отображает пространственные данные","только рисует карты от руки","измеряет температуру","запускает спутники"],a:0,ex:"ГИС-технологии превращают большие объёмы статистики в цифровые карты.",p:37},
{t:6,k:"one",q:"Картографический метод — это метод исследования, основанный на…",o:["получении информации с помощью карт","опросе людей","лабораторных опытах","подсчёте населения"],a:0,ex:"С его помощью созданы базы данных о водных, лесных, биологических ресурсах.",p:37},
{t:6,k:"one",q:"Статистические методы — это методы изучения…",o:["массовых явлений, которые можно выразить в числах","отдельных камней","погоды за один день","карт"],a:0,ex:"Их используют для составления таблиц.",p:39},
{t:6,k:"multi",q:"Какие методы применяются в организации географических данных? Выбери все.",o:["Картографический","Компьютерный","Пространственный","Статистический","Сказочный"],a:[0,1,2,3],ex:"Вывод §10: четыре метода.",p:39},
{t:6,k:"one",q:"Данные дистанционного зондирования — это…",o:["материалы, полученные со спутников и космических аппаратов","данные опросов","школьные дневники погоды","рисунки учёных"],a:0,ex:"Их собирают в разное время года за несколько лет.",p:37},
{t:6,k:"one",q:"Совокупность сохранённых пространственных данных называется…",o:["пространственной базой данных","легендой карты","номенклатурой","картосхемой"],a:0,ex:"Количественные данные удобно хранить в таблицах.",p:39},

/* ---------- 7. Строение Земли ---------- */
{t:7,k:"one",q:"Литосфера состоит из…",o:["земной коры и верхней части мантии","только земной коры","мантии и ядра","ядра и коры"],a:0,ex:"Литосфера — «каменная оболочка» (греч. литос — камень).",p:41},
{t:7,k:"order",q:"Расставь оболочки Земли от центра к поверхности.",o:["Внутреннее ядро (твёрдое)","Внешнее ядро (жидкое)","Мантия","Земная кора"],ex:"Ядро → мантия → кора. Внутреннее ядро твёрдое, внешнее — жидкое.",p:"41–42"},
{t:7,k:"multi",q:"Что верно про ядро Земли? Выбери все.",o:["Состоит в основном из железа и никеля","Температура до +6000°C","Внешнее ядро жидкое, внутреннее твёрдое","Толщина около 3500 км","Состоит из гранита"],a:[0,1,2,3],ex:"Средний радиус Земли — 6370 км, из них ядро — 3500 км.",p:"41–42"},
{t:7,k:"one",q:"Какая оболочка Земли самая объёмная и массивная?",o:["Мантия","Ядро","Земная кора","Атмосфера"],a:0,ex:"Мантия (лат. «плащ») толщиной 2900 км, температура от +1000 до +4000 °C.",p:42},
{t:7,k:"one",q:"Плюмы — это…",o:["восходящие потоки очень горячего мантийного вещества","трещины в коре","подводные горы","слои осадочных пород"],a:0,ex:"Англ. «плюм» — перо. Плюмы поднимаются к поверхности и «строят» литосферные плиты.",p:42},
{t:7,k:"one",q:"Астеносфера — это…",o:["слой расплавленной («слабой») мантии под литосферой","самый верхний слой коры","внутреннее ядро","осадочный слой"],a:0,ex:"Греч. «астенос» — слабый. Твёрдая литосфера «плавает» на ней, как лёд на воде.",p:43},
{t:7,k:"one",q:"Какая средняя толщина земной коры?",o:["33 км","330 км","3 км","2900 км"],a:0,ex:"Всего 0,5% от радиуса Земли — как тонкая плёнка.",p:43},
{t:7,k:"match",q:"Соедини слой земной коры и породы, из которых он состоит.",m:[["Осадочный","глины, известняки, пески"],["Гранитный","граниты"],["Базальтовый","базальты"]],ex:"Сверху вниз в материковой коре: осадочный → гранитный → базальтовый.",p:43},
{t:7,k:"one",q:"Какие два химических элемента главные в земной коре?",o:["Кислород (49%) и кремний (26%)","Железо и никель","Водород и гелий","Углерод и азот"],a:0,ex:"8 элементов дают 97% массы коры: O, Si, Al, Fe, Ca, Na, K, Mg.",p:"43–44"},
{t:7,k:"one",q:"Как меняется температура в глубине земной коры?",o:["На глубине 20–30 м постоянна, глубже растёт на 1,5–3°C на каждые 100 м","Падает с глубиной","Не меняется вообще","Растёт на 100°C каждые 10 м"],a:0,ex:"В самой глубокой скважине (Россия, 12,3 км) намерили +230 °C.",p:"43–44"},
{t:7,k:"match",q:"Сравни два типа земной коры.",m:[["Материковая: число слоёв","3 (осадочный, гранитный, базальтовый)"],["Океаническая: число слоёв","2 (осадочный, базальтовый)"],["Материковая: толщина","30–40 км под равнинами, до 70–80 км под горами"],["Океаническая: толщина","5–10 км"]],ex:"Главное отличие: в океанической коре НЕТ гранитного слоя.",p:44},
{t:7,k:"one",q:"Какого слоя нет в океанической коре?",o:["Гранитного","Базальтового","Осадочного","Всех слоёв нет"],a:0,ex:"Океаническая кора: осадочный + базальтовый.",p:44},
{t:7,k:"one",q:"Почему при разломе океаническая кора погружается в астеносферу, а материки — нет?",o:["Океаническая кора плотнее и тяжелее","Океаническая кора толще","Материки тяжелее","Из-за воды океана"],a:0,ex:"Океаническая кора тоньше, но плотнее и тяжелее материковой и даже астеносферы.",p:44},
{t:7,k:"one",q:"Какая кора появилась на Земле первой?",o:["Океаническая","Материковая","Гранитная","Обе одновременно"],a:0,ex:"Более 4 млрд лет назад «океан» магмы остыл и образовал первую кору океанического типа.",p:44},

<h3>Средние века</h3><ul><li>Арабские учёные: Ибн Сина, Бируни, Ибн Баттута, Идриси</li><li><b>Махмуд Кашгари</b> — круглая карта мира, словарь «Диван Лугат ат-Турк»</li><li><b>Марко Поло</b> — конец XIII в., Китай, «Книга о разнообразии мира»</li><li><b>Афанасий Никитин</b> — XV в., Индия, «Хождение за три моря»</li></ul>
<h3>Великие географические открытия (XV–XVII вв.)</h3><ul><li><b>Колумб</b>, 1492 — искал путь в Индию, открыл Новый Свет (думал, что это Индия)</li><li><b>Америго Веспуччи</b> — понял, что это новый материк → 1507 «Америка»</li><li><b>Магеллан</b>, 1519–1522 — первая кругосветка: 5 кораблей и 265 чел. → вернулись 1 корабль и 18 чел. Доказала: Земля — шар, есть единый Мировой океан и Тихий океан</li></ul>
<h3>Казахстан</h3><ul><li>Сведения у Птолемея, Геродота, Страбона</li><li><b>Ахмад ибн Фадлан</b> (X в.) — западный Казахстан</li><li><b>Кадыргали Жалаири</b> — «Сборник летописей»</li><li><b>Семенов-Тян-Шанский</b> (1856–57) — Центральный Тянь-Шань, пик Хан Тенгри, нет действующих вулканов, вертикальная поясность</li><li><b>Шокан Уалиханов</b> (1856–58) — Заилийский край, Жонгария, <b>Кашгар</b> — «географическое открытие»</li><li><b>Пржевальский</b> — 4 экспедиции: Монголия, Китай, Тибет; лошадь Пржевальского (керкулан), двугорбый верблюд</li></ul>
<div class="remember">Учёных объединило <b>Русское географическое общество</b>.</div>`,
3:`<h3>Предвоенные и военные годы</h3><ul><li>Почвенные экспедиции: Неуструев, Прасолов, Безсонов</li><li>Фауна: Шнитников, Виноградов</li><li>«Климатический очерк Казахстана» — Пономарев и Барсук</li><li>Рудные месторождения: Нехорошев, <b>Сатпаев</b>. Жездинское месторождение марганца → броневая сталь в войну</li></ul>
<h3>Сели</h3><p><b>Сель</b> — мощный грязекаменный поток с гор после ливней.</p><ul><li><b>1921</b> — сель на Алматы (река Киши Алматы), сотни погибших</li><li><b>1963</b> — сель от обвала морены, долина реки Есик, разрушена плотина озера</li><li>Плотина <b>«Медеу»</b> на Киши Алматы — построена направленными взрывами, мировая слава</li></ul>
<h3>Послевоенные годы</h3><div class="remember"><b>1946</b> — Академия наук Казахстана (первый президент — <b>К. И. Сатпаев</b>).<br><b>1952</b> — Географическое общество Казахстана.</div>
<ul><li>Первая схема физико-географического районирования</li><li>Изучали засухи, суховеи, пыльные бури, град, заморозки, гололёд, метели</li><li>Озёра: Аральское, Балкаш, Алаколь, Кошкараколь, Сасыкколь</li><li>Сейчас — <b>Институт географии и водной безопасности</b></li></ul>`,
4:`<h3>Виды источников</h3><ul><li>Текстовые: учебники, справочники, словари, энциклопедии, журналы</li><li><b>Картографические</b> (главные): карты и атласы</li><li><b>Графические</b>: рисунки, фото, схемы, графики, диаграммы, инфографика</li><li>Ещё: документальные фильмы, прогнозы погоды, открытки, марки, интернет</li></ul>
<h3>Атласы Казахстана</h3><div class="tbl"><table><tr><th>Атлас</th><th>Год</th><th>Кто</th></tr><tr><td>Национальный атлас РК (3 тома) — крупнейший</td><td>2010</td><td>Институт географии</td></tr><tr><td>«Атлас географии Казахстана» — главный учебный</td><td>2013</td><td>академик А. С. Бейсенова</td></tr></table></div><p>Оба — на казахском, русском и английском.</p>
<h3>Аэро- и космические снимки</h3><ul><li>Снимки с самолётов и спутников</li><li>Для <b>погоды</b> — мелкий масштаб, для <b>почв</b> — крупный</li><li>Применяют: поиск полезных ископаемых, погода, пыльные бури, пожары, почвы, растительность</li></ul>
<p>Экспедиции планируют по детальным <b>топографическим</b> картам. Информацию хранят в компьютерных <b>базах данных</b>.</p>`,
5:`<h3>Опыты (§5)</h3><ul><li><b>Опыт 1</b>: парафин на стекле → круг, на кристалле → эллипс. Вывод: в аморфных (стекло) тепло идёт медленнее, в кристаллических (хрусталь) — быстрее. Кристаллы способны к <b>самоогранению</b></li><li><b>Опыт 2</b>: водопроницаемость. Быстрее всего — крупный песок, потом мелкий песок, суглинок, медленнее всего — глина</li><li><b>Опыт 3</b>: вентилятор + песок = микроформы рельефа от ветра</li><li><b>Опыт 4</b>: нагрев горных пород Солнцем → график температуры</li></ul>
<h3>Приборы</h3><div class="tbl"><table><tr><th>Прибор</th><th>Измеряет</th></tr><tr><td>Термометр</td><td>температуру</td></tr><tr><td>Барометр (-анероид)</td><td>давление</td></tr><tr><td>Гигрометр</td><td>влажность</td></tr><tr><td>Анемометр</td><td>скорость ветра</td></tr><tr><td>Флюгер</td><td>направление ветра</td></tr><tr><td>Альтиметр</td><td>высоту</td></tr></table></div>
<div class="remember">Норма давления — <b>1013 гПа = 760 мм рт. ст.</b> Уличный термометр — за окном на <b>север</b>. Температуру меряем <b>3 раза</b> в день → среднесуточная → тип погоды.</div>
<h3>Типы погоды (тёплое время)</h3><div class="tbl"><table><tr><th>Средняя t</th><th>Тип</th></tr><tr><td>+2…+3</td><td>холодная</td></tr><tr><td>+4…+8</td><td>прохладная</td></tr><tr><td>+8…+15</td><td>умеренно тёплая</td></tr><tr><td>+16…+22</td><td>тёплая</td></tr><tr><td>+23…+28</td><td>жаркая</td></tr><tr><td>+29…+33</td><td>очень жаркая</td></tr><tr><td>+34 и выше</td><td>крайне жаркая</td></tr></table></div>
<p>Холодное время: +2…0 оттепель; −1…−3 слабо морозная; −4…−12 умеренно морозная; −13…−22 значительно морозная; −23…−33 сильно; −34…−43 жестоко; ниже −43 крайне морозная.</p>
<h3>Полевые методы (§6)</h3><ul><li>Формы: <b>стационарные</b>, <b>экспедиционные</b>, <b>экскурсии</b></li><li>4 метода: <b>наблюдение, эксперимент, описание, измерение</b></li><li>Стационар «Ледник Туйыксу» (Илейский Алатау) — почти 70 лет наблюдений</li><li>Теодолит, нивелир — топосъёмка; лазерный сканер — 3D-модели</li><li><b>Элементы погоды</b> (всегда есть): температура, давление, влажность. <b>Погодные явления</b> (приходят и уходят): ветер, облака, осадки, гроза</li></ul>
<h3>Графические методы (§7)</h3><ul><li><b>Схема</b> — упрощённое изображение (классификация равнин)</li><li><b>Диаграмма</b> — фигура по цифрам, соотношение величин (состав земной коры). Бывают круговые, столбиковые, линейные, кольцевые…</li><li><b>Профиль</b> — вертикальный разрез (профиль речной долины)</li><li><b>График</b> — линия: зависимость или изменение во времени (температура)</li></ul>
<p>Равнины: низменность до 200 м, возвышенность 200–500 м, плоскогорье более 500 м. Петроглифы Тамгалы — древняя графика.</p>`,
6:`<h3>Изображения Земли (§8)</h3><ul><li><b>План местности</b> — крупный масштаб, горизонтали (линии одинаковой высоты), стрелка «С»</li><li><b>Карта</b> — мелкий масштаб, большие территории</li><li><b>Аэрофотоснимок</b> — детали зависят от высоты полёта</li><li><b>Космический снимок</b> — облака, вихри, пожары</li></ul>
<h3>Проекции</h3><div class="tbl"><table><tr><th>Проекция</th><th>Особенность</th></tr><tr><td>Цилиндрическая</td><td>точно у экватора, искажения растут к полюсам</td></tr><tr><td>Коническая</td><td>больше всего искажений у полюсов</td></tr><tr><td>Азимутальная</td><td>плоскость касается глобуса — карты Антарктиды, Сев. Ледовитого океана</td></tr></table></div>
<p>Искажаются форма, размеры, площади. <b>Меридианы</b> соединяют полюса, <b>параллели</b> параллельны экватору, самая длинная параллель — <b>экватор</b>. <b>Легенда</b> — список всех условных знаков карты.</p>
<div class="remember"><b>Картосхема</b> — упрощённая карта <b>без градусной сетки и масштаба</b>. Классификация: по охвату, по содержанию, по назначению. План составления: тема → сбор информации → составление → условные знаки.</div>
<h3>Номенклатура (§9)</h3><ul><li><b>Номенклатура</b> — совокупность названий географических объектов</li><li><b>Понимать</b> карту — свойства, виды, знаки; <b>читать</b> — видеть размещение и связи; <b>знать</b> — помнить расположение по памяти</li><li>Шаги: прочитать вслух → написание → найти в атласе → на других картах → контурная карта</li><li>Ертис: исток — Монгольский Алтай (Китай), 4248 км, по Казахстану 1700 км, впадает в Обь</li></ul>
<h3>Базы данных (§10)</h3><ul><li><b>ГИС</b> — сбор, хранение, обработка, анализ и отображение пространственных данных</li><li><b>Картографический метод</b> — информация с помощью карт</li><li><b>Статистический</b> — массовые явления в числах</li><li>Дистанционное зондирование — данные со спутников</li><li>4 метода: картографический, компьютерный, пространственный, статистический</li></ul>`,
7:`<h3>Внутреннее строение Земли</h3><div class="tbl"><table><tr><th>Оболочка</th><th>Толщина</th><th>Состояние, состав</th><th>t</th></tr><tr><td>Земная кора</td><td>в среднем 33 км</td><td>твёрдая; O 49%, Si 26%</td><td>в среднем +14°C на поверхности</td></tr><tr><td>Мантия</td><td>2900 км</td><td>в основном твёрдая, самая объёмная</td><td>+1000…+4000°C</td></tr><tr><td>Ядро</td><td>3500 км</td><td>железо + никель; внешнее жидкое, внутреннее твёрдое</td><td>до +6000°C</td></tr></table></div>
<p>Радиус Земли — 6370 км.</p>
<div class="remember"><b>Литосфера</b> = земная кора + верхняя часть мантии. Она «плавает» на <b>астеносфере</b> (слабый расплавленный слой), как лёд на воде.</div>
<ul><li><b>Плюмы</b> — горячие восходящие потоки из мантии (англ. «перо»)</li><li>Температура растёт на 1,5–3°C каждые 100 м глубины (с 20–30 м)</li><li>8 элементов = 97% массы коры: O, Si, Al, Fe, Ca, Na, K, Mg</li></ul>
<h3>Два типа земной коры</h3><div class="tbl"><table><tr><th></th><th>Материковая</th><th>Океаническая</th></tr><tr><td>Слои</td><td>3: осадочный, гранитный, базальтовый</td><td>2: осадочный, базальтовый</td></tr><tr><td>Толщина</td><td>30–40 км (равнины), до 70–80 км (горы)</td><td>5–10 км</td></tr><tr><td>Вес</td><td>лёгкая, не тонет</td><td>плотнее и тяжелее, погружается в астеносферу</td></tr></table></div>
<p>Первой образовалась океаническая кора (больше 4 млрд лет назад).</p>`,
8:`<h3>Порядки структур</h3><ul><li>1-й — <b>литосферные плиты</b></li><li>2-й — материки и впадины океанов</li><li>3-й — <b>платформы</b> (устойчивые) и <b>сейсмические пояса</b> (подвижные)</li></ul>
<h3>Плиты</h3><ul><li>Блоки литосферы 5–250 км толщиной, движутся по астеносфере на 1–18 см в год</li><li>Теория появилась в 1960-е</li><li>7 больших: Тихоокеанская, Африканская, Северо-Американская, Евразийская, Южно-Американская, Антарктическая, Индо-Австралийская (больше 90% поверхности)</li><li>Средние: Наска (только океаническая кора), Филиппинская, Карибская, Кокос</li><li>Евразия = Евразийская + Северо-Американская + Индо-Австралийская + Аравийская</li></ul>
<ul><li>Земле 4,6 млрд лет; породы материков — больше 4 млрд лет, дна океана — не старше 180 млн лет</li><li><b>Шельф</b> — материковая отмель (кора материков 41%, суша 29%)</li><li><b>Платформы</b> — древние ровные участки → равнины (Прикаспийская низменность на Восточно-Европейской платформе)</li><li><b>Сейсмические пояса</b> — больше 90% вулканов и землетрясений. Урало-Монгольский: Мугалжар, Сарыарка, Алтай, Тянь-Шань</li><li>Срединно-Атлантический хребет — самый длинный; Чилийско-Перуанский желоб — самый длинный; Марианский — самый глубокий (11 022 м)</li></ul>
<h3>Движения (§13)</h3><ul><li><b>Вертикальные</b>: Скандинавия поднимается, Нидерланды опускаются (растаял ледник 9000 лет назад)</li><li><b>Горизонтальные</b>: движение плит</li><li><b>Грабен</b> — опустившийся участок; <b>горст</b> — поднявшийся. Рифт Восточной Африки: озёра Танганьика, Ньяса</li><li><b>Вегенер</b> — дрейф континентов, <b>Пангея</b> («вся Земля»)</li></ul>
<div class="remember"><b>Спрединг</b> — плиты расходятся, новая кора (срединно-океанические хребты, Исландия).<br><b>Субдукция</b> — океаническая плита ныряет под материковую (желоба, Анды, Японские острова).<br><b>Коллизия</b> — две материковые плиты сминаются в складки (Гималаи).</div>
<p>Через 50 млн лет: Атлантический океан больше, Индийский меньше, Африка разделится, Средиземное море «закроется».</p>`,
9:`<p><b>Катаклизм</b> — резкий разрушительный переворот в природе: землетрясения, извержения вулканов, цунами.</p>
<h3>Землетрясения</h3><ul><li>Несколько десятков каждую минуту → «пульс планеты»</li><li><b>Гипоцентр (очаг)</b> — место разрыва на глубине; <b>эпицентр</b> — точка на поверхности над очагом</li><li>Показатели: энергетический класс (магнитуда), ощутимость по 12-балльной шкале, глубина очага</li><li>Глубже очаг → слабее в эпицентре, но шире площадь</li><li>В океане → <b>цунами</b></li></ul>
<div class="remember"><b>1887</b> — Верненская катастрофа (Алматы). Опасность: Алматы 8–9 баллов, Зайсан 7, Усть-Каменогорск 6. Опасны юг, юго-восток и восток Казахстана — коллизия Евразийской и Индо-Австралийской плит.</div>
<h3>Вулканы</h3><ul><li>Очаг → <b>жерло</b> → <b>кратер</b> → <b>лава</b>; крупные обломки — <b>вулканические бомбы</b></li><li><b>Действующие</b>: Ключевская Сопка (Камчатка), Этна, Везувий; <b>потухшие</b>: Эльбрус, Казбек</li><li>Везувий, 79 г. н. э. — Помпеи, Геркуланум, Стабии</li><li><b>Гейзеры</b> — фонтанирующие горячие источники рядом с вулканами: Исландия, Йеллоустон (США), Новая Зеландия, Япония, Камчатка</li></ul>
<h3>Сейсмические пояса</h3><ul><li><b>Тихоокеанский</b> — кольцо вокруг Тихого океана (Анды, Кордильеры, Камчатка, Япония)</li><li><b>Альпийско-Гималайский</b> — от Альп до Индокитая, более 15 тыс. км</li><li><b>Центрально-Азиатский</b> — Тянь-Шань, Жетысуский Алатау, Сауыр-Тарбагатай, Алтай</li></ul>
<h3>Сейсмология</h3><ul><li>В мире больше 2000 станций; план РК на 2024–2028: +285 станций и ремонт 70</li><li>Время землетрясения пока точно предсказать нельзя</li><li>Сейсмостойкое строительство: крепкие стены и перекрытия, прочные материалы, устойчивые грунты</li></ul>`
};

const OPEN = [
{t:1,q:"Объясните, почему география — комплексная наука.",a:"Она изучает сразу природу, население и хозяйство Земли и <b>взаимодействие</b> природы и общества. В ней много направлений (физическая, социальная, экономическая, политическая), а помогает им картография."},
{t:1,q:"Приведите по 2 примера природных и антропогенных объектов вашей местности.",a:"Природные: горы Илейского Алатау, река Улкен Алматы, озеро Улкен Алматы. Антропогенные: плотина «Медеу», парк, мост, завод. <i>(Антропогенные — созданные человеком.)</i>"},
{t:1,q:"Как картография помогает изучать Землю?",a:"Прежде чем что-то изучать, надо знать, <b>где</b> это находится. Карта отвечает на вопрос «где?», показывает расположение объектов и связи между ними. Поэтому карту называют «вторым языком географии»."},

{t:2,q:"Расскажите о значении исследований Н. М. Пржевальского.",a:"Четыре экспедиции по Монголии, Китаю и Тибету. Убрал «белые пятна» на карте Внутренней Азии, описал кочевников и земледельцев, собрал гербарии и коллекции. Открыл дикую лошадь (лошадь Пржевальского, керкулан) и двугорбого верблюда."},
{t:3,q:"Выделите основные направления деятельности К. И. Сатпаева.",a:"Поиск и разведка рудных месторождений (Жездинское месторождение марганца — броневая сталь в годы войны); организатор и первый президент Академии наук Казахстана (1946); основатель школы металлогении и Института геологических наук; более 640 научных работ."},
{t:3,q:"Почему изучение селей особенно важно для Алматы?",a:"Город стоит у гор. В 1921 году сель по реке Киши Алматы разрушил много домов, погибли сотни людей. После этого начали изучать сели и построили противоселевую плотину «Медеу» (направленными взрывами)."},

{t:5,q:"Назовите четыре основных метода полевых исследований и объясните один из них.",a:"Наблюдение, эксперимент, описание, измерение. Например, <b>измерение</b> — использование приборов: термометр для температуры, барометр для давления, теодолит и нивелир для съёмки местности."},

{t:7,q:"Какая оболочка лежит в основании литосферы и какое у неё значение?",a:"<b>Астеносфера</b> — слабый пластичный слой верхней мантии. С ней связаны образование магматических пород, вулканы, вертикальные и горизонтальные движения коры. Она главная в движении литосферных плит."},

OPEN.forEach((o,i)=>o.id="o"+i);

/* ================== СОСТОЯНИЕ ================== */
const KEY="geo7_arsen_v1";
let S={best:{},wrong:{},seen:{},known:{},sor:[]};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const app=document.getElementById("app");
const T=id=>TOPICS.find(t=>t.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200);}
function top0(){window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});}

/* ================== ГЛАВНАЯ ================== */
function home(){
  const seen=Object.keys(S.seen).length, wrongN=Object.keys(S.wrong).length;
  const known=Object.keys(S.known).length;
  let h=`<header class="top">
    <div class="eyebrow">Экспедиция Арсена · 7 класс · стр. 1–60</div>
    <h1>География: готовимся к СОРу</h1>
    <p>Арсен, выбери тему: сначала прочитай шпаргалку, потом пройди тест. Ошибки сохраняются, их можно отработать отдельно.</p>
    <div class="stats">
      <div class="stat"><b>${seen}/${Q.length}</b><span>вопросов решено</span></div>
      <div class="stat"><b>${wrongN}</b><span>ошибок на работу</span></div>
      <div class="stat"><b>${S.sor.length?Math.max(...S.sor)+"%":"—"}</b><span>лучший пробный СОР</span></div>
    </div></header>
  <div class="modes">
    <button class="mode primary" data-act="sor"><strong>Пробный СОР</strong><small>15 случайных вопросов по выбранному разделу, с баллами в конце</small></button>
    <button class="mode" data-act="mist" ${wrongN?"":"disabled"}><strong>Работа над ошибками</strong><small>${wrongN?wrongN+" вопр. — пока не ответишь верно":"Ошибок пока нет"}</small></button>
    <button class="mode" data-act="open"><strong>Письменные задания</strong><small>Вопросы «объясните, сравните» с образцами ответов · ${known}/${OPEN.length}</small></button>
  </div>`;
  [1,2,3].forEach(s=>{
    h+=`<div class="sec-title"><h2>${SECTIONS[s][0]}</h2><span class="mono">${SECTIONS[s][1]}</span></div><div class="route">`;
    TOPICS.filter(t=>t.s===s).forEach(t=>{
      const n=Q.filter(q=>q.t===t.id).length, b=S.best[t.id];
      h+=`<div class="topic s${t.s}"><div class="pin ${b>=80?"done":""}">${t.par.replace("§","§")}</div><div style="min-width:0">
        <h3>${t.title}</h3><div class="meta">стр. ${t.pages} · ${n} вопросов${b!=null?` · рекорд <span class="mono">${b}%</span>`:""}</div>
        <div class="bar"><i style="width:${b||0}%"></i></div>
        <div class="acts"><button class="chip" data-cheat="${t.id}">Шпаргалка</button><button class="chip fill" data-quiz="${t.id}">Тест</button></div></div></div>`;
    });
    h+=`</div>`;
  });
  h+=`<p class="foot">Учебник: География 7 класс, Егорина, Нуркенова, Алиаскаров, Шимина, «Атамура» 2025. Прогресс хранится в этом браузере.</p>`;
  app.innerHTML=h; top0();
  app.querySelectorAll("[data-cheat]").forEach(b=>b.onclick=()=>cheat(+b.dataset.cheat));
  app.querySelectorAll("[data-quiz]").forEach(b=>b.onclick=()=>startQuiz(shuffle(Q.filter(q=>q.t===+b.dataset.quiz)),{type:"topic",topic:+b.dataset.quiz}));
  app.querySelector('[data-act="sor"]').onclick=sorPick;
  app.querySelector('[data-act="mist"]').onclick=()=>{const l=Q.filter(q=>S.wrong[q.id]);if(l.length)startQuiz(shuffle(l),{type:"mist"});};
  app.querySelector('[data-act="open"]').onclick=()=>openTasks(0);
}

/* ================== ШПАРГАЛКА ================== */
function cheat(id){
  const t=T(id);
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Все темы</button><span class="tag s${t.s}">${t.par} · стр. ${t.pages}</span></div>
  <article class="panel cheat s${t.s}"><h2>${t.title}</h2>${CHEAT[id]}
  <div class="btns"><button class="btn" id="go">Пройти тест по теме</button><button class="btn ghost" id="bk2">Назад</button></div></article>`;
  top0();
  document.getElementById("bk").onclick=home;document.getElementById("bk2").onclick=home;
  document.getElementById("go").onclick=()=>startQuiz(shuffle(Q.filter(q=>q.t===id)),{type:"topic",topic:id});
}

/* ================== ПРОБНЫЙ СОР ================== */
function sorPick(){
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Все темы</button></div>
  <div class="panel"><h2 style="font-size:26px;text-transform:uppercase">Пробный СОР</h2>
  <p class="muted">Выбери, что будет на СОРе. Если не знаешь — бери «Всё, стр. 1–60».</p>
  <div class="btns">
   <button class="btn" data-s="1">Раздел 1 · §1–7 (методы, учёные)</button>
   <button class="btn" data-s="2">Раздел 2 · §8–10 (карты)</button>
   <button class="btn" data-s="3">Раздел 3.1 · §11–15 (литосфера)</button>
   <button class="btn ghost" data-s="0">Всё, стр. 1–60 (20 вопросов)</button>
  </div></div>`;
  top0();
  document.getElementById("bk").onclick=home;
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    const s=+b.dataset.s;
    let pool=s?Q.filter(q=>T(q.t).s===s):Q.slice();
    const n=s?Math.min(15,pool.length):20;
    // равномерно по темам
    const byT={};shuffle(pool).forEach(q=>(byT[q.t]=byT[q.t]||[]).push(q));
    const keys=Object.keys(byT);let out=[];let i=0;
    while(out.length<n){const k=keys[i%keys.length];if(byT[k].length)out.push(byT[k].shift());i++;if(i>1000)break;}
    startQuiz(shuffle(out),{type:"sor",sec:s});
  });
}

/* ================== КВИЗ ================== */
let R=null;
function startQuiz(list,mode){R={list,mode,i:0,right:0,wrongList:[]};renderQ();}
function renderQ(){
  const q=R.list[R.i], t=T(q.t), n=R.list.length;
  const title=R.mode.type==="sor"?"Пробный СОР":R.mode.type==="mist"?"Работа над ошибками":t.title;
  let body="";
  const kindHint={one:"Выбери один ответ",multi:"Выбери ВСЕ верные ответы",order:"Нажимай по порядку. Нажми ещё раз, чтобы убрать",match:"Для каждой строки выбери ответ из списка"}[q.k];
  if(q.k==="one"||q.k==="multi"){
    R.perm=shuffle(q.o.map((_,i)=>i));
    body=`<div class="opts">${R.perm.map((oi,j)=>`<button class="opt ${q.k==="one"?"round":""}" data-oi="${oi}"><span class="box">${q.k==="multi"?"":"АБВГДЕЖЗИ"[j]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>`;
  } else if(q.k==="order"){
    R.pick=[];R.perm=shuffle(q.o.map((_,i)=>i));
    body=`<div class="order-built" id="built"></div><div class="opts" id="pool"></div>`;
  } else if(q.k==="match"){
    const rights=[...new Set(q.m.map(p=>p[1]))];R.rights=shuffle(rights);
    body=`<div class="match">${q.m.map((p,i)=>`<div class="mrow" id="mr${i}"><label for="ms${i}">${esc(p[0])}</label><select id="ms${i}"><option value="">— выбери —</option>${R.rights.map((r,j)=>`<option value="${j}">${esc(r)}</option>`).join("")}</select></div>`).join("")}</div>`;
  }
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Выйти</button><span class="mono muted" style="font-size:13px">${R.i+1} / ${n}</span></div>
  <div class="panel s${t.s}">
   <div class="qtop"><span class="tag">${t.par} · ${esc(title)}</span><span class="mono">стр. ${q.p}</span></div>
   <div class="progress"><i style="width:${(R.i)/n*100}%"></i></div>
   <div class="qtext">${esc(q.q)}</div><div class="hint">${kindHint}</div>
   ${body}
   <div id="fbx"></div>
   <div class="btns" id="ctl">${q.k==="one"?"":`<button class="btn" id="chk" disabled>Проверить</button>`}</div>
  </div>`;
  top0();
  document.getElementById("bk").onclick=()=>{R=null;home();};
  const chk=document.getElementById("chk");
  if(q.k==="one"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{b.classList.add("sel");check(+b.dataset.oi);});
  } else if(q.k==="multi"){
    const sel=new Set();
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const oi=+b.dataset.oi;sel.has(oi)?sel.delete(oi):sel.add(oi);b.classList.toggle("sel");b.querySelector(".box").textContent=sel.has(oi)?"✓":"";chk.disabled=!sel.size;});
    chk.onclick=()=>check([...sel]);
  } else if(q.k==="order"){
    const draw=()=>{
      const built=document.getElementById("built"),pool=document.getElementById("pool");
      built.innerHTML=R.pick.length?R.pick.map((oi,k)=>`<button class="oitem" data-rm="${oi}"><span class="n">${k+1}</span><span>${esc(q.o[oi])}</span></button>`).join(""):`<div class="empty">Нажимай на пункты ниже в правильном порядке</div>`;
      pool.innerHTML=R.perm.filter(oi=>!R.pick.includes(oi)).map(oi=>`<button class="opt" data-ad="${oi}"><span class="box">+</span><span>${esc(q.o[oi])}</span></button>`).join("");
      built.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{R.pick=R.pick.filter(x=>x!==+b.dataset.rm);draw();});
      pool.querySelectorAll("[data-ad]").forEach(b=>b.onclick=()=>{R.pick.push(+b.dataset.ad);draw();});
      chk.disabled=R.pick.length!==q.o.length;
    };
    draw();chk.onclick=()=>check(R.pick.slice());
  } else if(q.k==="match"){
    const sels=[...app.querySelectorAll("select")];
    sels.forEach(s=>s.onchange=()=>{chk.disabled=sels.some(x=>x.value==="");});
    chk.onclick=()=>check(sels.map(s=>R.rights[+s.value]));
  }
}
function check(ans){
  const q=R.list[R.i];let ok=false,rightText="";
  if(q.k==="one"){
    ok=ans===q.a;
    app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const oi=+b.dataset.oi;if(oi===q.a)b.classList.add("right");else if(oi===ans)b.classList.add("wrong");b.classList.remove("sel");});
    rightText=q.o[q.a];
  } else if(q.k==="multi"){
    const A=new Set(q.a);ok=ans.length===A.size&&ans.every(x=>A.has(x));
    app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const oi=+b.dataset.oi,picked=ans.includes(oi);b.classList.remove("sel");
      if(A.has(oi)){b.classList.add("right");b.querySelector(".box").textContent="✓";}else if(picked){b.classList.add("wrong");b.querySelector(".box").textContent="✕";}});
    rightText=q.a.map(i=>q.o[i]).join("; ");
  } else if(q.k==="order"){
    ok=ans.every((oi,k)=>oi===k);
    const built=document.getElementById("built");
    built.innerHTML=ans.map((oi,k)=>`<div class="oitem ${oi===k?"right":"wrong"}"><span class="n">${k+1}</span><span>${esc(q.o[oi])}</span></div>`).join("");
    document.getElementById("pool").innerHTML="";
    rightText=q.o.map((x,k)=>(k+1)+") "+x).join(" → ");
  } else if(q.k==="match"){
    ok=ans.every((r,i)=>r===q.m[i][1]);
    q.m.forEach((p,i)=>{const row=document.getElementById("mr"+i),s=document.getElementById("ms"+i);s.disabled=true;
      if(ans[i]===p[1])row.classList.add("right");else{row.classList.add("wrong");row.insertAdjacentHTML("beforeend",`<span class="fix">Верно: ${esc(p[1])}</span>`);}});
    rightText="";
  }
  S.seen[q.id]=1;
  if(ok){R.right++;if(S.wrong[q.id])delete S.wrong[q.id];}
  else{S.wrong[q.id]=1;R.wrongList.push(q);}
  save();
  const praise=["Верно!","Точно!","Молодец!","Так держать!","Правильно!"];
  document.getElementById("fbx").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b class="v">${ok?praise[Math.floor(Math.random()*praise.length)]:"Не совсем"}</b>${!ok&&rightText?`<div><b>Правильно:</b> ${esc(rightText)}</div>`:""}<div>${esc(q.ex)}</div><span class="pg">Учебник, стр. ${q.p}</span></div>`;
  const last=R.i===R.list.length-1;
  document.getElementById("ctl").innerHTML=`<button class="btn" id="nx">${last?"Результат":"Дальше →"}</button>`;
  document.getElementById("nx").onclick=()=>{if(last)result();else{R.i++;renderQ();}};
  document.getElementById("fbx").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function result(){
  const n=R.list.length,pct=Math.round(R.right/n*100),m=R.mode;
  if(m.type==="topic"){S.best[m.topic]=Math.max(S.best[m.topic]||0,pct);}
  if(m.type==="sor"){S.sor.push(pct);}
  save();
  let verdict=pct>=85?"Отлично! Ты готов к СОРу.":pct>=65?"Хорошо, но повтори ошибки.":pct>=40?"Надо повторить шпаргалку и пройти ещё раз.":"Сначала прочитай шпаргалку, потом снова тест.";
  const level=m.type==="sor"?`<div class="mono muted" style="margin-top:8px">Уровень: ${pct>=85?"высокий":pct>=50?"средний":"низкий"}</div>`:"";
  app.innerHTML=`<div class="panel"><div class="eyebrow">${m.type==="sor"?"Пробный СОР":m.type==="mist"?"Работа над ошибками":T(m.topic).par+" · "+T(m.topic).title}</div>
  <div style="display:flex;align-items:baseline;gap:12px;margin-top:10px"><div class="score mono">${R.right}/${n}</div><div class="mono muted">${pct}%</div></div>
  <div class="verdict">${verdict}</div>${level}
  ${R.wrongList.length?`<h3 style="margin-top:18px;font-size:18px">Где ошибся</h3><div class="mist">${R.wrongList.map(q=>`<div><b>${esc(q.q)}</b>${q.k==="one"?"Ответ: "+esc(q.o[q.a]):q.k==="multi"?"Ответ: "+esc(q.a.map(i=>q.o[i]).join("; ")):q.k==="order"?esc(q.o.join(" → ")):esc(q.m.map(p=>p[0]+" — "+p[1]).join("; "))} <span class="mono muted">(стр. ${q.p})</span></div>`).join("")}</div>`:""}
  <div class="btns">
   ${R.wrongList.length?`<button class="btn" id="rw">Повторить ошибки (${R.wrongList.length})</button>`:""}
   ${m.type==="topic"?`<button class="btn ${R.wrongList.length?"ghost":""}" id="again">Пройти тему ещё раз</button>`:""}
   ${m.type==="sor"?`<button class="btn ${R.wrongList.length?"ghost":""}" id="sor2">Новый пробный СОР</button>`:""}
   <button class="btn ghost" id="hm">На главную</button></div></div>`;
  top0();
  const wl=R.wrongList.slice(),mode=m;
  const rw=document.getElementById("rw");if(rw)rw.onclick=()=>startQuiz(shuffle(wl),{type:"mist"});
  const ag=document.getElementById("again");if(ag)ag.onclick=()=>startQuiz(shuffle(Q.filter(q=>q.t===mode.topic)),mode);
  const s2=document.getElementById("sor2");if(s2)s2.onclick=sorPick;
  document.getElementById("hm").onclick=home;
}

/* ================== ПИСЬМЕННЫЕ ЗАДАНИЯ ================== */
function openTasks(filter){
  const list=OPEN.filter(o=>!filter||T(o.t).s===filter);
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Все темы</button><span class="mono muted" style="font-size:13px">знаю ${Object.keys(S.known).length}/${OPEN.length}</span></div>
  <div class="panel"><h2 style="font-size:26px;text-transform:uppercase">Письменные задания</h2>
  <p class="muted" style="margin:6px 0 0">На СОРе бывают задания «объясните», «сравните», «оцените». Сначала ответь сам (вслух или в тетради), потом открой образец и честно отметь.</p>
  <div class="filter">${[["0","Все"],["1","Раздел 1"],["2","Раздел 2"],["3","Литосфера"]].map(([v,l])=>`<button class="chip ${+v===filter?"on":""}" data-f="${v}">${l}</button>`).join("")}</div>
  <div>${list.map(o=>{const t=T(o.t);return `<div class="task s${t.s} ${S.known[o.id]?"known":""}" id="${o.id}"><span class="tag">${t.par}</span><div class="q" style="margin-top:6px">${esc(o.q)}</div>
   <div class="ans" hidden>${o.a}</div>
   <div class="row"><button class="chip fill" data-show="${o.id}">Показать ответ</button>${S.known[o.id]?`<span class="mono" style="color:var(--ok);font-size:13px;align-self:center">✓ знаю</span>`:""}</div></div>`;}).join("")}</div></div>`;
  top0();
  document.getElementById("bk").onclick=home;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>openTasks(+b.dataset.f));
  app.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.show,card=document.getElementById(id);card.querySelector(".ans").hidden=false;
    card.querySelector(".row").innerHTML=`<button class="chip" data-k="1">Я ответил так же</button><button class="chip" data-k="0">Надо ещё повторить</button>`;
    card.querySelectorAll("[data-k]").forEach(k=>k.onclick=()=>{if(k.dataset.k==="1"){S.known[id]=1;card.classList.add("known");toast("Отлично, отмечено");}else{delete S.known[id];card.classList.remove("known");toast("Вернись к нему позже");}save();
      card.querySelector(".row").innerHTML=S.known[id]?`<span class="mono" style="color:var(--ok);font-size:13px">✓ знаю</span>`:`<span class="mono muted" style="font-size:13px">повторить</span>`;});
  });
}

home();
</script>

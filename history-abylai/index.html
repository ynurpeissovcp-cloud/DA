*{box-sizing:border-box}
body{background:var(--bg) var(--orn) repeat;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}

.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px}

.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c)}
.s1{--c:var(--s1);--cs:var(--s1s)} .s2{--c:var(--s2);--cs:var(--s2s)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.back{background:none;border:none;padding:6px 0;color:var(--accent);font-weight:600;font-size:15px}

.qtext{font-size:19px;font-weight:600;line-height:1.4;margin-block:6px 6px}

.opts{display:flex;flex-direction:column;gap:8px}

.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.order-built{display:flex;flex-direction:column;gap:6px;min-height:52px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:10px}
.order-built .empty{color:var(--muted);font-size:14px;padding:6px}
.oitem{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:8px;padding:9px 12px;text-align:left;font-size:15px}
.oitem .n{font-family:var(--mono);font-weight:700;color:var(--accent)}
.oitem.right{background:var(--ok-bg);border-color:var(--ok)} .oitem.right .n{color:var(--ok)}
.oitem.wrong{background:var(--bad-bg);border-color:var(--bad)} .oitem.wrong .n{color:var(--bad)}
.match{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.mrow label{font-weight:600;font-size:15px}
.mrow select{width:100%;font:inherit;font-size:15px;padding:9px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.mrow.right{border-color:var(--ok);background:var(--ok-bg)} .mrow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mrow .fix{font-size:14px;color:var(--ok);font-weight:600}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:none;border-radius:10px;padding:13px 18px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb b.v{display:block;font-family:var(--display);font-weight:400;font-size:19px;margin-bottom:4px}
.fb.ok b.v{color:var(--ok)} .fb.no b.v{color:var(--bad)}
.fb .pg{font-family:var(--mono);font-size:12px;color:var(--muted);display:block;margin-top:6px}

.cheat h2{font-size:26px}

.cheat b{color:var(--c)}
.remember{border-left:4px solid var(--c);background:var(--cs);border-radius:0 10px 10px 0;padding:10px 14px;margin-block:12px}
.remember::before{content:"Запомни";display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.kz{border:1px dashed var(--gold);background:var(--gold-soft);border-radius:10px;padding:10px 14px;margin-block:12px;font-size:15px}
.kz::before{content:"Казахские слова";display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.kz i{font-style:normal;font-weight:600}
.tbl{overflow-x:auto;margin-block:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--cs);font-weight:600}

.score{font-family:var(--mono);font-size:52px;font-weight:700;line-height:1;color:var(--accent)}
.verdict{font-size:18px;font-weight:600;margin-top:6px}
.mist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mist div{background:var(--bad-bg);border-radius:8px;padding:10px 12px;font-size:14px}
.mist div b{display:block;margin-bottom:2px}

.task{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px}
.task + .task{margin-top:10px}
.task .q{font-weight:600;font-size:16px}
.task .ans{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:15px}
.task .ans ul{padding-left:18px;margin:4px 0}
.task .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.task.known{border-color:var(--ok)}
.filter{display:flex;flex-wrap:wrap;gap:8px;margin-block:10px 14px}

/* timeline */
.tl{position:relative;display:flex;flex-direction:column;gap:0;margin-top:12px}
.tl::before{content:"";position:absolute;left:68px;top:6px;bottom:6px;width:2px;background:var(--gold);opacity:.45}
.ev{display:grid;grid-template-columns:58px 1fr;gap:22px;align-items:start;padding-block:8px;text-align:left;background:none;border:none;width:100%;position:relative}
.ev .yr{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--gold);text-align:right;line-height:1.3}
.ev .yr small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.ev::after{content:"";position:absolute;left:63px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--c)}
.ev .tx{font-size:15px;line-height:1.4;min-width:0;border-radius:6px}
.tl.hide .ev:not(.open) .tx{color:transparent;background:var(--line);user-select:none}
.ev .sec{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-bottom:2px}
.tl.hide .ev:not(.open) .sec{opacity:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}

const SECTIONS = {1:["Раздел II. Абылай хан","§11–12 · стр. 37–45"],2:["Раздел III. Культура Казахстана в XVIII веке","§13–16 · стр. 46–57"]};

/* ================== ВОПРОСЫ ==================
 k: one | multi | order | match;  d:1 — вопрос на дату
*/
const Q = [
/* ---------- 1. Абылай: личность и внутренняя политика ---------- */
{t:1,k:"one",d:1,q:"В каком году и где родился Абылай?",o:["В 1711 г. (по другим данным в 1713 г.) в Туркестане","В 1693 г. в Баянауле","В 1735 г. в Оренбурге","В 1741 г. в Ташкенте"],a:0,ex:"Год рождения в учебнике дан с оговоркой: 1711 или 1713.",p:37},
{t:1,k:"one",q:"Какое имя Абылай получил при рождении?",o:["Абильмансур","Абулмамбет","Султанмамет","Абулфеиз"],a:0,ex:"Имя «Абылай» он получил позже, после поединка с джунгарским батыром.",p:37},
{t:1,k:"multi",q:"Что верно о молодом Абылае? Выбери все.",o:["Получил мусульманское образование","Владел семью восточными языками","Хорошо играл на домбре","В междоусобных войнах остался сиротой","С 15 лет участвовал в войне с джунгарами","Учился в Петербурге"],a:[0,1,2,3,4],ex:"Жизненный путь Абылая был нелёгким: сирота, с 15 лет на войне.",p:37},
{t:1,k:"multi",q:"Какими качествами отличался Абылай? Выбери все.",o:["Большая физическая сила, смелость, ловкость","Делил военную добычу со своими воинами","Был прекрасным оратором","Знал обычное право и шежире","Был человеком слова, честным и справедливым","Боялся воевать и не ходил в походы"],a:[0,1,2,3,4],ex:"До последних дней он был вместе с воинами и не раз был ранен в сражениях.",p:37},
{t:1,k:"one",d:1,q:"В каком году Абылай в единоборстве победил джунгарского батыра Шарыша?",o:["1733","1741","1756","1771"],a:0,ex:"Ему было около двадцати лет, он был в ополчении хана Абулмамбета.",p:38},
{t:1,k:"one",q:"С каким боевым кличем Абылай вышел на поединок с Шарышем?",o:["«Абылай!»","«Алаш!»","«Елім-ай!»","«Аңырақай!»"],a:0,ex:"«Абылай» — имя его знаменитого деда. После этого поединка Абильмансура стали звать Абылаем.",p:38},
{t:1,k:"one",q:"Управителем какого улуса стал Абылай в начале 30-х гг. XVIII в.?",o:["Атыгайского","Байкыргызского","Алшынского","Найманского"],a:0,ex:"Позже его власть распространилась на роды и племена Среднего и Старшего жузов.",p:38},
{t:1,k:"one",q:"Кто написал: «Обязанный своему возвышению только личным достоинствам, он сумел заслужить уважение народа… ни один киргизский хан не имел такой неограниченной власти, как Абылай»?",o:["Ш. Уалиханов","Н. Коншин","Хан Абулхаир","И. Крафт"],a:0,ex:"Это задание есть и в повторении раздела на стр. 45.",p:38},
{t:1,k:"one",d:1,q:"Что предложила царская администрация Абылаю в 1759 г.?",o:["Сместить хана Абулмамбета и занять его место","Переехать в Омскую крепость","Начать войну с Китаем","Отдать Туркестан России"],a:0,ex:"Абылай отказался: это могло разрушить единство народа. Ханом трёх жузов он согласился стать только после смерти Абулмамбета.",p:38},
{t:1,k:"multi",q:"Схема «Внутренняя политика Абылая». Выбери все пункты.",o:["Воссоздание централизованного независимого государства","Усиление судебной власти","Прекращение междоусобиц и барымты","Поощрение земледелия, сенокошения, рыболовства, торговли","Строительство кузниц","Развитие караванной торговли","Запрет кочевать"],a:[0,1,2,3,4,5],ex:"Шесть блоков на схеме стр. 38. Цель — сильное централизованное и независимое государство.",p:38},
{t:1,k:"one",d:1,q:"Когда и где Абылая провозгласили ханом всех трёх жузов?",o:["В 1771 г. в Туркестане","В 1778 г. в Петербурге","В 1733 г. в Ордабасы","В 1780 г. в Петропавловске"],a:0,ex:"Этому помогла его роль в разгроме джунгар и волжских калмыков.",p:38},
{t:1,k:"one",d:1,q:"Кем признало Абылая царское правительство в 1778 г.?",o:["Ханом только Среднего жуза","Ханом трёх жузов","Генералом русской армии","Губернатором Оренбурга"],a:0,ex:"Абылай не поехал на церемонию присяги: он считал, что его избрал народ и клясться в верности России он не обязан.",p:39},
{t:1,k:"one",q:"Почему Абылай отказался ехать на церемонию присяги и вручения царской грамоты?",o:["Считал, что ханом его избрал народ, и не обязан клясться России","Был болен","Боялся Китая","Не знал русского языка"],a:0,ex:"Царское правительство даже пыталось его арестовать и сместить.",p:39},
{t:1,k:"match",q:"Кого Абылай поставил управлять землями? Соедини.",m:[["Жетысу (Семиречье)","султаны Адиль и Суюк"],["Центральный Казахстан","султан Касым"],["Среднее Прииртышье","двоюродный брат Султанмамет"],["Восточный Казахстан","Абулфеиз, сын Абулмамбета"]],ex:"Большинство назначенных султанов были родственниками Абылая.",p:39},
{t:1,k:"one",q:"Кто был влиятельным советником Абылая?",o:["Бухар жырау","Тевкелев","Нуралы","Амурсана"],a:0,ex:"Абылай опирался на толенгутов, батыров и биев, а главным советником был Бухар жырау.",p:39},
{t:1,k:"one",q:"Барымта — это…",o:["угон скота (её Абылай прекратил вместе с междоусобицами)","караванная пошлина","вид ковра","совет биев"],a:0,ex:"Прекращение междоусобиц и барымты — один из пунктов внутренней политики.",p:39},
{t:1,k:"one",q:"Покровителем кого был Абылай?",o:["Поэтов, музыкантов и религиозных деятелей","Только купцов","Русских чиновников","Китайских послов"],a:0,ex:"Картина «Избрание Абылая ханом в Туркестане» — художник Ж. Кайранбай.",p:39},
{t:1,k:"match",q:"Соедини понятие и значение.",m:[["Шежире","родословная казахов"],["Караван","группа вьючных животных, везущая грузы и людей"],["Стела","памятник, обелиск"],["Манапы","родовая знать, судьи и военачальники кыргызов"]],ex:"Словарик на стр. 44.",p:44},

/* ---------- 2. Внешняя политика ---------- */
{t:2,k:"one",q:"Какой была внешняя политика Абылая?",o:["Гибкой и дальновидной: он защищал неприкосновенность территории","Покорной России","Покорной Китаю","Агрессивной ко всем соседям"],a:0,ex:"Главная цель — неприкосновенность территории Казахского ханства.",p:40},
{t:2,k:"multi",q:"Как Абылай строил отношения с Россией? Выбери все.",o:["Старался сохранять взаимовыгодные добрососедские отношения","Поддерживал дипломатические и торговые связи","Защищал своих подданных от притязаний российских военных","Вёл независимую от России политику","Полностью выполнял все приказы царя"],a:[0,1,2,3],ex:"Он был посредником в освобождении подданных и брал пошлины с караванов.",p:40},
{t:2,k:"one",q:"Какую огромную заслугу перед казахами имел Абылай в отношениях с Россией?",o:["Вернул казахам пастбища на правобережье Иртыша","Построил Омскую крепость","Отдал Россию Китаю","Открыл первый университет"],a:0,ex:"То есть на внутренней стороне пограничной линии — добился настойчивыми требованиями.",p:40},
{t:2,k:"one",q:"Что задумывала Россия, чтобы ослабить Абылая?",o:["Заменить Абылая и Султанмамета верными России людьми, например Нуралы, и даже посадить хана в Омскую крепость","Сделать Абылая генералом","Отдать ему Оренбург","Переселить его в Китай"],a:0,ex:"Это противоречило степным законам.",p:40},
{t:2,k:"one",d:1,q:"Когда Абылай попал в плен к джунгарам и когда его освободили?",o:["В плен — после похода 1741 г., освобождён в 1743 г.","В 1733 г., освобождён в 1771 г.","В 1756 г., освобождён в 1767 г.","В 1771 г., освобождён в 1778 г."],a:0,ex:"Освобождению помог мир казахов с Джунгарским государством.",p:40},
{t:2,k:"one",q:"Что делал Абылай после смерти Галдан-Цэрэна, когда в Джунгарии началась борьба за трон?",o:["Поддерживал поочерёдно то одного, то другого претендента и добился уступок земель","Стал ханом Джунгарии","Не вмешивался","Помогал Китаю захватить Казахстан"],a:0,ex:"Так казахи ослабляли врага и возвращали захваченные районы.",p:40},
{t:2,k:"one",d:1,q:"Что создал Китай в 1761 г., чтобы закрепиться в Джунгарии?",o:["Наместничество Синьцзян («Новая линия»)","Иртышскую линию","Оренбургскую крепость","Ханство Амурсаны"],a:0,ex:"«Синьцзян» и значит «Новая линия» (новая граница).",p:40},
{t:2,k:"one",d:1,q:"Сколько волжских калмыков в 1771 г. попытались перебраться на китайскую линию?",o:["180 тысяч","18 тысяч","1 миллион","60 тысяч"],a:0,ex:"Они прошли через земли Младшего и Среднего жузов, но потерпели поражение от казахов.",p:40},
{t:2,k:"one",q:"Как в истории назван разгром калмыков отрядом Абылая в 1771 г.?",o:["«Пыльный поход»","«Қалмақ қырылған»","«Ақтабан шұбырынды»","«Аңырақай»"],a:0,ex:"Самая крупная битва была на реке Жем и на берегу озера Балкаш.",p:41},
{t:2,k:"one",d:1,q:"С какого года Абылай стал поддерживать дипломатические отношения с Китаем?",o:["С 1756 г.","С 1733 г.","С 1771 г.","С 1780 г."],a:0,ex:"Так он приостановил колониальную политику России и не допустил агрессии Китая.",p:41},
{t:2,k:"one",q:"Какую позицию занял Абылай, когда китайское посольство обсуждало пограничные вопросы?",o:["Отказался признавать за Китаем исконно казахские земли, занятые раньше Джунгарией","Отдал Китаю все земли","Попросил Китай принять казахов в подданство","Уехал в Россию"],a:0,ex:"Казахи считали себя законными хозяевами части земель Джунгарии.",p:41},
{t:2,k:"one",q:"Кому Абылай оказывал помощь в антицинском (антикитайском) восстании?",o:["Амурсане","Галдан-Цэрэну","Нуралы","Тевкелеву"],a:0,ex:"Амурсана (1722–1757) — джунгарский нойон, в 1755 г. поднял восстание против Цинского Китая. Потом бежал в Сибирь.",p:"41, 44"},
{t:2,k:"one",d:1,q:"К какому году Джунгария была полностью покорена китайской армией?",o:["К 1758 г.","К 1741 г.","К 1771 г.","К 1780 г."],a:0,ex:"Рубрика «Знайте» на стр. 41.",p:41},
{t:2,k:"one",q:"Что произошло весной 1756 г.?",o:["Казахские отряды совершили рейд вглубь Джунгарии против китайцев; потом китайцы пошли в наступление, но вернулись обратно","Абылай стал ханом трёх жузов","Абылай попал в плен","Калмыки ушли в Китай"],a:0,ex:"Казахские ополченцы задерживали китайцев и совершали на них неожиданные набеги.",p:41},
{t:2,k:"one",d:1,q:"Что разрешил Китай казахам в 1767 г.?",o:["Пользоваться пастбищами в районе Тарбагатая и реки Или","Торговать в Пекине","Строить крепости в Китае","Жить в Синьцзяне без кочевья"],a:0,ex:"К концу XVIII в. часть Среднего и Старшего жузов заняла свои традиционные пастбища.",p:42},
{t:2,k:"one",q:"Как Абылай собирался поступить при войне России с Китаем (выяснила Оренбургская канцелярия в 1759 г.)?",o:["Сохранять нейтралитет — не помогать ни России, ни Китаю","Воевать за Россию","Воевать за Китай","Напасть на обоих"],a:0,ex:"«…ни российской, ни китайской сторонам помогать не будет, но в собственной только осторожности пребудет».",p:42},
{t:2,k:"one",q:"Почему в 60-х гг. XVIII в. осложнились отношения с алатаускими кыргызами?",o:["Спор за освободившиеся земли джунгар, взаимный угон скота, нападения на караваны","Кыргызы приняли подданство России","Кыргызы ушли в Китай","Из-за религии"],a:0,ex:"Абылай совершил упреждающие рейды, а потом заключили перемирие.",p:42},
{t:2,k:"one",d:1,q:"Что сделал Абылай в 1779 г. в отношениях с кыргызами?",o:["Взял в аманаты детей знатных манапов и из пленных образовал две волости","Объявил войну Китаю","Переселил казахов в Кыргызстан","Стал ханом кыргызов"],a:0,ex:"Волости — Жанакыргызская и Байкыргызская. Это привело к миру между двумя родственными народами.",p:42},
{t:2,k:"match",q:"Отношения Абылая с соседями (таблица со стр. 44). Соедини.",m:[["Россия","добрососедство, торговля, но независимая политика; вернул пастбища у Иртыша"],["Джунгарское ханство","борьба и ослабление; плен 1741–1743; поддержка претендентов на трон"],["Цинская империя","дипломатия с 1756 г., отказ отдать земли; пастбища Тарбагатая и Или (1767)"],["Кыргызский народ","рейды, аманаты от манапов, две волости, мир (1779)"]],ex:"Эта таблица — частое задание на СОРе.",p:"40–44"},
{t:2,k:"one",d:1,q:"Когда умер Абылай и где похоронен?",o:["В 1780 г., в мавзолее Ходжи Ахмеда Ясауи в Туркестане","В 1771 г., в Петропавловске","В 1778 г., в Омске","В 1787 г., в Баянауле"],a:0,ex:"Китай, узнав о смерти хана, прислал посольство для поминовения.",p:42},
{t:2,k:"one",q:"Кто писал, что Абылай «умел… казаться преданным то России, то Китаю, то Джунгарии, но в действительности не подчинялся никому»?",o:["И. Крафт","Ш. Уалиханов","А. Бокейхан","Кошке Кеменгеров"],a:0,ex:"Кеменгеров тоже считал: «Абылай до самой своей кончины практически не подчинялся России».",p:"42–43"},
{t:2,k:"one",q:"По А. Бокейхану, кто пользовался кличем «Абылай!» даже в русско-японскую войну (1904–1905)?",o:["Сибирские казаки","Китайские солдаты","Джунгары","Кыргызские манапы"],a:0,ex:"Так велика была слава хана среди соседей.",p:43},
{t:2,k:"multi",q:"Как сегодня чтут память Абылая? Выбери все.",o:["Его имя носят проспекты и улицы","Казахский университет международных отношений и мировых языков в Алматы","Стела в предгорьях Кокшетау","Музей «Резиденция Абылай хана» в Петропавловске","«Абылайханские чтения»","Памятник в Пекине"],a:[0,1,2,3,4],ex:"Казахи охотно дают имя Абылай своим детям.",p:"43–44"},
{t:2,k:"match",q:"Соедини слова и автора (задание из повторения раздела).",m:[["«…ни один киргизский хан не имел такой неограниченной власти, как Абылай»","Ш. Уалиханов"],["«Так возникла Иртышская линия укреплений…»","Н. Коншин"],["«…доколь р. Яик не высохнет, киргизский народ от нее не отлучится»","Абулхаир хан"]],ex:"Задание 1 на стр. 45.",p:45},
{t:2,k:"one",q:"Письмо 28 февраля 1778 г. Абылай отправил…",o:["Екатерине II — просил подтвердить его звание хана трёх жузов","Анне Иоанновне","Китайскому императору","Галдан-Цэрэну"],a:0,ex:"В письме он писал, что в 1771 г. в Туркестане его признали ханом трёх жузов.",p:44},
{t:2,k:"one",q:"По Левшину, когда независимость Абылая стала особенно заметной?",o:["После 1771 г., когда он начал явно называться ханом","После 1733 г.","После 1743 г.","После 1780 г."],a:0,ex:"Он «признавал себя, смотря по нужде, то подданным русским, то китайским, а на самом деле был властителем независимым».",p:"44–45"},
{t:2,k:"order",d:1,q:"Расставь события жизни Абылая по порядку.",o:["Поединок с батыром Шарышем (1733)","Плен у джунгар и освобождение (1741–1743)","Начало отношений с Китаем (1756)","Провозглашён ханом трёх жузов в Туркестане (1771)","Россия признала его ханом Среднего жуза (1778)","Смерть хана (1780)"],ex:"1733 → 1741–1743 → 1756 → 1771 → 1778 → 1780.",p:"38–42"},

/* ---------- 3. Устное творчество ---------- */
{t:3,k:"match",q:"Соедини понятие и значение.",m:[["Акын","поэт-импровизатор"],["Жырау","поэт-сказитель, размышлявший о судьбах народа"],["Айтыс","песенное состязание акынов"],["Кюй","инструментальная пьеса на домбре, кобызе"],["Шешен","мастер красноречия, оратор"]],ex:"Словарик на стр. 50 и введение к §13–14.",p:"46, 50"},
{t:3,k:"multi",q:"Какие темы были главными в творчестве жырау XVIII в.?",o:["Борьба против джунгарских завоевателей","Борьба против царской колонизации","Героизм батыров","Космические полёты"],a:[0,1,2],ex:"Особое место в культуре XVIII в. принадлежит акынам и жырау.",p:46},
{t:3,k:"one",q:"Актамберды Сарыулы — это…",o:["жырау и батыр, звавший к героизму и отваге","кобызшы из Торгая","собиратель шежире","русский путешественник"],a:0,ex:"В 50-х гг. XVIII в. он возглавил возвращение казахов на отвоёванные у джунгар земли.",p:46},
{t:3,k:"one",q:"Где родился Бухар жырау Калкаманулы?",o:["В Баянаульском районе Павлодарской области, у горы Далба","В Туркестане","В Торгае","В Кокшетау"],a:0,ex:"Его отец — Калкаман батыр.",p:47},
{t:3,k:"one",q:"Как в народе называли Бухар жырау?",o:["«Көмекей әулие» — святой","«Дарабоз»","«Шал-акын»","«Сардар»"],a:0,ex:"Шал-акын — это Тлеуке Кулекеулы. Дарабоз — Кабанбай батыр.",p:47},
{t:3,k:"multi",q:"Что верно о Бухар жырау? Выбери все.",o:["Был ближайшим советником и соратником Абылая","Воспевал Абылая как прогрессивного деятеля","Предугадал колониальные планы царского правительства","Призывал народ к единству","Мечтал о сильном и независимом государстве","Был китайским послом"],a:[0,1,2,3,4],ex:"Темы: любовь к родной земле, патриотизм, героизм батыров. Годы жизни: 1693–1787.",p:"44, 47"},
{t:3,k:"one",q:"Кому Умбетей Тулеулы посвятил жоқтау (плач) и естірту (извещение)?",o:["Батыру Канжыгалы Богенбаю","Хану Абылаю","Бухар жырау","Батыру Шарышу"],a:0,ex:"Умбетей участвовал во всех антиджунгарских походах.",p:47},
{t:3,k:"match",q:"Соедини жанр и значение.",m:[["Жоқтау","плач, причитание по умершему"],["Естірту","извещение о смерти"],["Толғау","песня-размышление"]],ex:"Толғау — название кюя Тлепа Аспантайулы и жанр раздумий.",p:"47–50"},

{t:2,q:"Почему Абылай брал в аманаты детей знатных кыргызов?",a:"Чтобы гарантировать мир: пока дети знатных манапов были у казахов, кыргызы не нападали. Так в 1779 г. установился мир между двумя родственными народами."},
{t:2,q:"Используя источники, сделайте заключение об Абылае (Уалиханов, Бокейхан, Крафт, твоё мнение).",a:"<ul><li><b>Уалиханов</b>: возвысился личными достоинствами, имел неограниченную власть</li><li><b>Бокейхан</b>: клич «Абылай!» знали даже сибирские казаки</li><li><b>Крафт</b>: казался преданным то России, то Китаю, то Джунгарии, но не подчинялся никому</li><li><b>Моё мнение</b>: Абылай — выдающийся правитель, который сохранил независимость и единство Казахского ханства</li></ul>"},
{t:2,q:"Какова роль Абылай хана в сохранении независимого Казахского государства?",a:"Объединил три жуза и централизовал власть; разгромил джунгар и калмыков; остановил продвижение китайских отрядов; вернул пастбища Тарбагатая и Или; прекратил набеги кыргызов; формально признавая Россию и Китай, на деле был независимым."},
{t:3,q:"Назовите имена и основное направление творчества жырау и акынов XVIII в.",a:"<ul><li><b>Актамберды</b> — призыв к героизму и отваге</li><li><b>Бухар жырау</b> — патриотизм, единство, независимость, воспевал Абылая</li><li><b>Умбетей</b> — подвиги батыров, жоқтау о Богенбае</li><li><b>Таттикара</b> — подвиги Олжабая и Богенбая</li><li>Котеш, Тлеуке (Шал-акын)</li></ul>"},
{t:3,q:"Почему Абылай хан назначил Бухар жырау своим советником?",a:"Бухар был мудрым бием, знатоком обычного права и шежире, опытным дипломатом, всегда говорил правду и пользовался огромным уважением народа («Көмекей әулие»). Он призывал к единству и независимости — это совпадало с целями Абылая."},
{t:3,q:"В чём необходимость знания «семи предков» сегодня?",a:"Шежире — это историческая память семьи и народа. Знание семи предков помогает знать свои корни, уважать старших, соблюдать традицию не жениться на близких родственниках (функция социального регулятора)."},
{t:3,q:"Расскажите о значении айтыса.",a:"На айтысе выявляли лучших акынов-импровизаторов. Акыны открыто оценивали жизнь общества, высмеивали недостойное поведение. Поэтому люди берегли репутацию и старались быть гостеприимными, щедрыми, уважать старших. Победителей награждали золотом, серебром, лошадьми."},
{t:4,q:"Заполните таблицу: виды ремёсел, сырьё, изделия.",a:"<ul><li><b>Деревообработка</b> (үйші): берёза, карагач, клён → остов юрты, домбыра, кобыз, күбі, астау, сандық</li><li><b>Кузнечное и ювелирное</b> (ұста, зергер): металл, серебро → оружие, утварь, сырға, білезік, жүзік</li><li><b>Кожевенное</b>: шкуры → тон, ішік, саба, торсық, кісе, сбруя</li><li><b>Войлочное и ткачество</b>: шерсть овец, коз, верблюдов → кошма, текемет, сырмақ, тұскиіз, алаша, қоржын</li></ul>"},
{t:4,q:"В чём уникальность прикладного искусства казахов?",a:"Почти все вещи делали сами из продуктов скотоводства, ничего не выбрасывали (безотходность). Вещи были удобны для кочевья и при этом красивы: их украшали орнаментом, инкрустацией из кости и серебра."},
{t:4,q:"Что из себя представлял обычай «Асар»?",a:"Взаимопомощь, <b>бесплатный коллективный труд</b>. Хозяин звал соседей (например, женщин для валки войлока или ткачества ковра), кормил их мясом, а они работали. Помощь делали всем без исключения — по-казахски «көмек»."},
{t:5,q:"Почему основным мотивом орнамента были рога барана?",a:"Самым многочисленным скотом у казахов были овцы. Узор қошқар мүйіз стал символом <b>богатства, свободы, самостоятельности и самодостаточности</b> степняков."},
{t:5,q:"Расскажите о значении юрты в традиционном казахском обществе.",a:"Юрта — главное жилище кочевника: лёгкая, быстро собирается и перевозится, тёплая зимой и прохладная летом («одно из самых практичных изобретений» — Ф. фон Шварц). В юрте есть почётное место төр для гостей; гость всегда под защитой хозяина. Её делали всем миром: үйші — дерево, женщины — войлок."},
{t:5,q:"Опишите зимнее жилище казахов (қыстау).",a:"Строили на плодородных местах у родовых захоронений, из камня, дерева, дёрна, самана. Двускатная крыша, печь с казаном, окно из бычьего пузыря. Две части: ауыз үй (вход) и төр жақ (жилая), в ней нар. Рядом хлев, шошала для мяса и малқора для скота. Топили хворостом и тезеком."}
];
OPEN.forEach((o,i)=>o.id="o"+i);

/* ================== СОСТОЯНИЕ ================== */
const KEY="hist7_arsen_v2";
let S={best:{},wrong:{},seen:{},known:{},sor:[]};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const app=document.getElementById("app");
const T=id=>TOPICS.find(t=>t.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200);}
function top0(){window.scrollTo(0,0);}

/* ================== ГЛАВНАЯ ================== */
function home(){
  const seen=Object.keys(S.seen).length, wrongN=Object.keys(S.wrong).length;
  const known=Object.keys(S.known).length, dN=Q.filter(q=>q.d).length;
  let h=`<header class="top">
    <div class="eyebrow">Арсен · 7 класс · стр. 37–57</div>
    <h1>История Казахстана: готовимся к СОРу</h1>
    <p>Арсен, выбери тему: сначала прочитай шпаргалку, потом пройди тест. Ошибки сохраняются, их можно отработать отдельно. Даты и годы жизни — в «Ленте дат». Казахские слова объяснены в шпаргалках.</p>
    <div class="stats">
      <div class="stat"><b>${seen}/${Q.length}</b><span>вопросов решено</span></div>
      <div class="stat"><b>${wrongN}</b><span>ошибок на работу</span></div>
      <div class="stat"><b>${S.sor.length?Math.max(...S.sor)+"%":"—"}</b><span>лучший пробный СОР</span></div>
    </div></header>
  <div class="modes">
    <button class="mode primary" data-act="sor"><strong>Пробный СОР</strong><small>15 случайных вопросов по разделу, с оценкой в конце</small></button>
    <button class="mode gold" data-act="dates"><strong>Лента дат</strong><small>${DATES.length} дат по порядку + тест из ${dN} вопросов</small></button>
    <button class="mode" data-act="mist" ${wrongN?"":"disabled"}><strong>Работа над ошибками</strong><small>${wrongN?wrongN+" вопр. — пока не ответишь верно":"Ошибок пока нет"}</small></button>
    <button class="mode" data-act="open" style="grid-column:1/-1"><strong>Письменные задания</strong><small>Вопросы «объясните, сравните, заполните таблицу» с образцами ответов · ${known}/${OPEN.length}</small></button>
  </div>`;
  [1,2].forEach(s=>{
    h+=`<div class="sec-title"><h2>${SECTIONS[s][0]}</h2><span class="mono">${SECTIONS[s][1]}</span></div><div class="route">`;
    TOPICS.filter(t=>t.s===s).forEach(t=>{
      const n=Q.filter(q=>q.t===t.id).length, b=S.best[t.id];
      h+=`<div class="topic s${t.s}"><div class="pin ${b>=80?"done":""}">${t.par}</div><div style="min-width:0">
        <h3>${t.title}</h3><div class="meta">стр. ${t.pages} · ${n} вопросов${b!=null?` · рекорд <span class="mono">${b}%</span>`:""}</div>
        <div class="bar"><i style="width:${b||0}%"></i></div>
        <div class="acts"><button class="chip" data-cheat="${t.id}">Шпаргалка</button><button class="chip fill" data-quiz="${t.id}">Тест</button></div></div></div>`;
    });
    h+=`</div>`;
  });
  h+=`<p class="foot">Учебник: История Казахстана (XVIII–XIX вв.), 7 класс, Кабульдинов, Калиев, Бейсембаева, «Атамұра» 2025. Прогресс хранится в этом браузере.</p>`;
  app.innerHTML=h; top0();
  app.querySelectorAll("[data-cheat]").forEach(b=>b.onclick=()=>cheat(+b.dataset.cheat));
  app.querySelectorAll("[data-quiz]").forEach(b=>b.onclick=()=>startQuiz(shuffle(Q.filter(q=>q.t===+b.dataset.quiz)),{type:"topic",topic:+b.dataset.quiz}));
  app.querySelector('[data-act="sor"]').onclick=sorPick;
  app.querySelector('[data-act="dates"]').onclick=()=>dates(false);
  app.querySelector('[data-act="mist"]').onclick=()=>{const l=Q.filter(q=>S.wrong[q.id]);if(l.length)startQuiz(shuffle(l),{type:"mist"});};
  app.querySelector('[data-act="open"]').onclick=()=>openTasks(0);
}

/* ================== ШПАРГАЛКА ================== */
function cheat(id){
  const t=T(id);
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Все темы</button><span class="tag s${t.s}">${t.par} · стр. ${t.pages}</span></div>
  <article class="panel cheat s${t.s}"><h2>${t.title}</h2>${CHEAT[id]}
  <div class="btns"><button class="btn" id="go">Пройти тест по теме</button><button class="btn ghost" id="bk2">Назад</button></div></article>`;
  top0();
  document.getElementById("bk").onclick=home;document.getElementById("bk2").onclick=home;
  document.getElementById("go").onclick=()=>startQuiz(shuffle(Q.filter(q=>q.t===id)),{type:"topic",topic:id});
}

/* ================== ЛЕНТА ДАТ ================== */
function dates(hide){
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Все темы</button></div>
  <div class="panel"><h2 style="font-size:26px">Лента дат</h2>
  <p class="muted" style="margin:6px 0 0">Читай сверху вниз. Потом включи «Проверь себя»: события скроются, вспоминай и нажимай на строку, чтобы открыть.</p>
  <div class="filter"><button class="chip ${hide?"":"on"}" data-h="0">Показать всё</button><button class="chip ${hide?"on":""}" data-h="1">Проверь себя</button></div>
  <div class="tl ${hide?"hide":""}" id="tl">${DATES.map(([y,sub,tx,s])=>`<button class="ev s${s}"><span class="yr">${y}${sub?`<small>${sub}</small>`:""}</span><span class="tx"><span class="sec">${s===1?"Абылай":"Культура"}</span><br>${tx}</span></button>`).join("")}</div>
  <div class="btns"><button class="btn" id="dq">Тест по датам (${Q.filter(q=>q.d).length})</button></div></div>`;
  top0();
  document.getElementById("bk").onclick=home;
  app.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>dates(b.dataset.h==="1"));
  app.querySelectorAll(".ev").forEach(b=>b.onclick=()=>b.classList.toggle("open"));
  document.getElementById("dq").onclick=()=>startQuiz(shuffle(Q.filter(q=>q.d)),{type:"dates"});
}

/* ================== ПРОБНЫЙ СОР ================== */
function sorPick(){
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Все темы</button></div>
  <div class="panel"><h2 style="font-size:26px">Пробный СОР</h2>
  <p class="muted">Выбери, что будет на СОРе. Если не знаешь — бери «Всё, стр. 37–57».</p>
  <div class="btns">
   <button class="btn" data-s="1">§11–12 · Абылай хан</button>
   <button class="btn" data-s="2">§13–16 · Культура XVIII века</button>
   <button class="btn ghost" data-s="0">Всё, стр. 37–57 (20 вопросов)</button>
  </div></div>`;
  top0();
  document.getElementById("bk").onclick=home;
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    const s=+b.dataset.s;
    let pool=s?Q.filter(q=>T(q.t).s===s):Q.slice();
    const n=s?Math.min(15,pool.length):20;
    const byT={};shuffle(pool).forEach(q=>(byT[q.t]=byT[q.t]||[]).push(q));
    const keys=Object.keys(byT);let out=[];let i=0;
    while(out.length<n){const k=keys[i%keys.length];if(byT[k].length)out.push(byT[k].shift());i++;if(i>1000)break;}
    startQuiz(shuffle(out),{type:"sor",sec:s});
  });
}

/* ================== КВИЗ ================== */
let R=null;
function startQuiz(list,mode){R={list,mode,i:0,right:0,wrongList:[]};renderQ();}
function renderQ(){
  const q=R.list[R.i], t=T(q.t), n=R.list.length;
  const title=R.mode.type==="sor"?"Пробный СОР":R.mode.type==="mist"?"Работа над ошибками":R.mode.type==="dates"?"Тест по датам":t.title;
  let body="";
  const kindHint={one:"Выбери один ответ",multi:"Выбери ВСЕ верные ответы",order:"Нажимай по порядку. Нажми ещё раз, чтобы убрать",match:"Для каждой строки выбери ответ из списка"}[q.k];
  if(q.k==="one"||q.k==="multi"){
    R.perm=shuffle(q.o.map((_,i)=>i));
    body=`<div class="opts">${R.perm.map((oi,j)=>`<button class="opt ${q.k==="one"?"round":""}" data-oi="${oi}"><span class="box">${q.k==="multi"?"":"АБВГДЕЖЗИ"[j]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>`;
  } else if(q.k==="order"){
    R.pick=[];R.perm=shuffle(q.o.map((_,i)=>i));
    body=`<div class="order-built" id="built"></div><div class="opts" id="pool"></div>`;
  } else if(q.k==="match"){
    const rights=[...new Set(q.m.map(p=>p[1]))];R.rights=shuffle(rights);
    body=`<div class="match">${q.m.map((p,i)=>`<div class="mrow" id="mr${i}"><label for="ms${i}">${esc(p[0])}</label><select id="ms${i}"><option value="">— выбери —</option>${R.rights.map((r,j)=>`<option value="${j}">${esc(r)}</option>`).join("")}</select></div>`).join("")}</div>`;
  }
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Выйти</button><span class="mono muted" style="font-size:13px">${R.i+1} / ${n}</span></div>
  <div class="panel s${t.s}">
   <div class="qtop"><span class="tag">${t.par} · ${esc(title)}</span><span class="mono">стр. ${q.p}</span></div>
   <div class="progress"><i style="width:${(R.i)/n*100}%"></i></div>
   <div class="qtext">${esc(q.q)}</div><div class="hint">${kindHint}</div>
   ${body}
   <div id="fbx"></div>
   <div class="btns" id="ctl">${q.k==="one"?"":`<button class="btn" id="chk" disabled>Проверить</button>`}</div>
  </div>`;
  top0();
  document.getElementById("bk").onclick=()=>{R=null;home();};
  const chk=document.getElementById("chk");
  if(q.k==="one"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{b.classList.add("sel");check(+b.dataset.oi);});
  } else if(q.k==="multi"){
    const sel=new Set();
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const oi=+b.dataset.oi;sel.has(oi)?sel.delete(oi):sel.add(oi);b.classList.toggle("sel");b.querySelector(".box").textContent=sel.has(oi)?"✓":"";chk.disabled=!sel.size;});
    chk.onclick=()=>check([...sel]);
  } else if(q.k==="order"){
    const draw=()=>{
      const built=document.getElementById("built"),pool=document.getElementById("pool");
      built.innerHTML=R.pick.length?R.pick.map((oi,k)=>`<button class="oitem" data-rm="${oi}"><span class="n">${k+1}</span><span>${esc(q.o[oi])}</span></button>`).join(""):`<div class="empty">Нажимай на пункты ниже в правильном порядке</div>`;
      pool.innerHTML=R.perm.filter(oi=>!R.pick.includes(oi)).map(oi=>`<button class="opt" data-ad="${oi}"><span class="box">+</span><span>${esc(q.o[oi])}</span></button>`).join("");
      built.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{R.pick=R.pick.filter(x=>x!==+b.dataset.rm);draw();});
      pool.querySelectorAll("[data-ad]").forEach(b=>b.onclick=()=>{R.pick.push(+b.dataset.ad);draw();});
      chk.disabled=R.pick.length!==q.o.length;
    };
    draw();chk.onclick=()=>check(R.pick.slice());
  } else if(q.k==="match"){
    const sels=[...app.querySelectorAll("select")];
    sels.forEach(s=>s.onchange=()=>{chk.disabled=sels.some(x=>x.value==="");});
    chk.onclick=()=>check(sels.map(s=>R.rights[+s.value]));
  }
}
function check(ans){
  const q=R.list[R.i];let ok=false,rightText="";
  if(q.k==="one"){
    ok=ans===q.a;
    app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const oi=+b.dataset.oi;if(oi===q.a)b.classList.add("right");else if(oi===ans)b.classList.add("wrong");b.classList.remove("sel");});
    rightText=q.o[q.a];
  } else if(q.k==="multi"){
    const A=new Set(q.a);ok=ans.length===A.size&&ans.every(x=>A.has(x));
    app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const oi=+b.dataset.oi,picked=ans.includes(oi);b.classList.remove("sel");
      if(A.has(oi)){b.classList.add("right");b.querySelector(".box").textContent="✓";}else if(picked){b.classList.add("wrong");b.querySelector(".box").textContent="✕";}});
    rightText=q.a.map(i=>q.o[i]).join("; ");
  } else if(q.k==="order"){
    ok=ans.every((oi,k)=>oi===k);
    const built=document.getElementById("built");
    built.innerHTML=ans.map((oi,k)=>`<div class="oitem ${oi===k?"right":"wrong"}"><span class="n">${k+1}</span><span>${esc(q.o[oi])}</span></div>`).join("");
    document.getElementById("pool").innerHTML="";
    rightText=q.o.map((x,k)=>(k+1)+") "+x).join(" → ");
  } else if(q.k==="match"){
    ok=ans.every((r,i)=>r===q.m[i][1]);
    q.m.forEach((p,i)=>{const row=document.getElementById("mr"+i),s=document.getElementById("ms"+i);s.disabled=true;
      if(ans[i]===p[1])row.classList.add("right");else{row.classList.add("wrong");row.insertAdjacentHTML("beforeend",`<span class="fix">Верно: ${esc(p[1])}</span>`);}});
    rightText="";
  }
  S.seen[q.id]=1;
  if(ok){R.right++;if(S.wrong[q.id])delete S.wrong[q.id];}
  else{S.wrong[q.id]=1;R.wrongList.push(q);}
  save();
  const praise=["Верно!","Точно!","Молодец!","Так держать!","Правильно!","Жарайсың!"];
  document.getElementById("fbx").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b class="v">${ok?praise[Math.floor(Math.random()*praise.length)]:"Не совсем"}</b>${!ok&&rightText?`<div><b>Правильно:</b> ${esc(rightText)}</div>`:""}<div>${esc(q.ex)}</div><span class="pg">Учебник, стр. ${q.p}</span></div>`;
  const last=R.i===R.list.length-1;
  document.getElementById("ctl").innerHTML=`<button class="btn" id="nx">${last?"Результат":"Дальше →"}</button>`;
  document.getElementById("nx").onclick=()=>{if(last)result();else{R.i++;renderQ();}};
  document.getElementById("fbx").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function result(){
  const n=R.list.length,pct=Math.round(R.right/n*100),m=R.mode;
  if(m.type==="topic"){S.best[m.topic]=Math.max(S.best[m.topic]||0,pct);}
  if(m.type==="sor"){S.sor.push(pct);}
  save();
  let verdict=pct>=85?"Отлично! Ты готов к СОРу.":pct>=65?"Хорошо, но повтори ошибки.":pct>=40?"Перечитай шпаргалку и пройди ещё раз.":"Сначала прочитай шпаргалку, потом снова тест.";
  const level=m.type==="sor"?`<div class="mono muted" style="margin-top:8px">Уровень: ${pct>=85?"высокий":pct>=50?"средний":"низкий"}</div>`:"";
  const head=m.type==="sor"?"Пробный СОР":m.type==="mist"?"Работа над ошибками":m.type==="dates"?"Тест по датам":T(m.topic).par+" · "+T(m.topic).title;
  app.innerHTML=`<div class="panel"><div class="eyebrow">${esc(head)}</div>
  <div style="display:flex;align-items:baseline;gap:12px;margin-top:10px"><div class="score">${R.right}/${n}</div><div class="mono muted">${pct}%</div></div>
  <div class="verdict">${verdict}</div>${level}
  ${R.wrongList.length?`<h3 style="margin-top:18px;font-size:19px">Где ошибся</h3><div class="mist">${R.wrongList.map(q=>`<div><b>${esc(q.q)}</b>${q.k==="one"?"Ответ: "+esc(q.o[q.a]):q.k==="multi"?"Ответ: "+esc(q.a.map(i=>q.o[i]).join("; ")):q.k==="order"?esc(q.o.join(" → ")):esc(q.m.map(p=>p[0]+" — "+p[1]).join("; "))} <span class="mono muted">(стр. ${q.p})</span></div>`).join("")}</div>`:""}
  <div class="btns">
   ${R.wrongList.length?`<button class="btn" id="rw">Повторить ошибки (${R.wrongList.length})</button>`:""}
   ${m.type==="topic"?`<button class="btn ${R.wrongList.length?"ghost":""}" id="again">Пройти тему ещё раз</button>`:""}
   ${m.type==="sor"?`<button class="btn ${R.wrongList.length?"ghost":""}" id="sor2">Новый пробный СОР</button>`:""}
   ${m.type==="dates"?`<button class="btn ghost" id="tl2">Вернуться к ленте дат</button>`:""}
   <button class="btn ghost" id="hm">На главную</button></div></div>`;
  top0();
  const wl=R.wrongList.slice(),mode=m;
  const rw=document.getElementById("rw");if(rw)rw.onclick=()=>startQuiz(shuffle(wl),{type:"mist"});
  const ag=document.getElementById("again");if(ag)ag.onclick=()=>startQuiz(shuffle(Q.filter(q=>q.t===mode.topic)),mode);
  const s2=document.getElementById("sor2");if(s2)s2.onclick=sorPick;
  const t2=document.getElementById("tl2");if(t2)t2.onclick=()=>dates(false);
  document.getElementById("hm").onclick=home;
}

/* ================== ПИСЬМЕННЫЕ ЗАДАНИЯ ================== */
function openTasks(filter){
  const list=OPEN.filter(o=>!filter||T(o.t).s===filter);
  app.innerHTML=`<div class="head-row"><button class="back" id="bk">← Все темы</button><span class="mono muted" style="font-size:13px">знаю ${Object.keys(S.known).length}/${OPEN.length}</span></div>
  <div class="panel"><h2 style="font-size:26px">Письменные задания</h2>
  <p class="muted" style="margin:6px 0 0">На СОРе бывают задания «объясните», «сравните», «заполните таблицу». Сначала ответь сам (вслух или в тетради), потом открой образец и честно отметь.</p>
  <div class="filter">${[["0","Все"],["1","Абылай"],["2","Культура"]].map(([v,l])=>`<button class="chip ${+v===filter?"on":""}" data-f="${v}">${l}</button>`).join("")}</div>
  <div>${list.map(o=>{const t=T(o.t);return `<div class="task s${t.s} ${S.known[o.id]?"known":""}" id="${o.id}"><span class="tag">${t.par}</span><div class="q" style="margin-top:6px">${esc(o.q)}</div>
   <div class="ans" hidden>${o.a}</div>
   <div class="row"><button class="chip fill" data-show="${o.id}">Показать ответ</button>${S.known[o.id]?`<span class="mono" style="color:var(--ok);font-size:13px;align-self:center">✓ знаю</span>`:""}</div></div>`;}).join("")}</div></div>`;
  top0();
  document.getElementById("bk").onclick=home;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>openTasks(+b.dataset.f));
  app.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.show,card=document.getElementById(id);card.querySelector(".ans").hidden=false;
    card.querySelector(".row").innerHTML=`<button class="chip" data-k="1">Я ответил так же</button><button class="chip" data-k="0">Надо ещё повторить</button>`;
    card.querySelectorAll("[data-k]").forEach(k=>k.onclick=()=>{if(k.dataset.k==="1"){S.known[id]=1;card.classList.add("known");toast("Отлично, отмечено");}else{delete S.known[id];card.classList.remove("known");toast("Вернись к нему позже");}save();
      card.querySelector(".row").innerHTML=S.known[id]?`<span class="mono" style="color:var(--ok);font-size:13px">✓ знаю</span>`:`<span class="mono muted" style="font-size:13px">повторить</span>`;});
  });
}

home();
</script>

</body></html>
